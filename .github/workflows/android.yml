name: Android-App
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: APK bauen
        working-directory: android
        env:
          VCODE: ${{ github.run_number }}
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee ../build.log
          cp app/build/outputs/apk/release/app-release.apk ../kalendarium.apk
      - name: Veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-app
          name: Kalendarium für Android
          make_latest: true
          files: kalendarium.apk
          body: |
            Kalendarium als echte Android-App. Erinnerungen werden als Android-Wecker geplant und vibrieren zuverlässig, auch bei geschlossener App und im Lautlos-Modus.
            Installation: kalendarium.apk auf dem Handy herunterladen und öffnen, Installation aus dieser Quelle erlauben.
      - name: Protokoll bei Fehler
        if: failure()
        run: |
          cp build.log /tmp/build.log 2>/dev/null || echo "kein build.log" > /tmp/build.log
          git checkout --orphan ci-log
          git rm -rf . > /dev/null
          cp /tmp/build.log build.log
          git add build.log
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -m "Build-Protokoll"
          git push -f origin ci-log
