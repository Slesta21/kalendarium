  .top{padding:10px 16px}
  .top h1{font-size:var(--t-h2)}
  main{padding:14px 16px calc(116px + env(safe-area-inset-bottom,0px))}
  .search input{width:130px}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in oklab, var(--surface) 94%, transparent);backdrop-filter:blur(var(--blur-1));-webkit-backdrop-filter:blur(var(--blur-1));border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:var(--t-xs);color:var(--faint);padding:4px 0}
  .tabbar button[aria-current="page"]{color:var(--accent-ink)}
  .tabbar svg{width:23px;height:23px}
  .fab{bottom:calc(80px + env(safe-area-inset-bottom,0px));right:16px;width:54px;height:54px}
  .hero{grid-template-columns:auto minmax(0,1fr)}
  .hero .wxnow{grid-column:1 / -1}
  .panel{padding:16px}
  .tl{grid-template-columns:74px minmax(0,1fr)}
  .tl-allday{padding-left:74px}
  .tl-h .wx .pp{display:none}
  .mo-d{min-height:66px;padding:5px}
  .mo-d .li,.mo-d .more,.mo-d .hn,.mo-d .n .wx span{display:none}
  .mo-d .dotrow{display:flex}
  .sheet{place-items:end center;padding:0}
  .sheet .card2{width:100%;border-radius:22px 22px 0 0;max-height:92vh;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px))}
  .dayrow{grid-template-columns:84px 32px 40px minmax(0,1fr)}
  .dayrow .ph{display:none}
  .next{grid-template-columns:auto minmax(0,1fr)}
  .next .cd{grid-column:1 / -1;text-align:left;font-size:var(--t-h2)}
  .days{gap:4px}
  .days .tmp span{display:none}
  .hide-m{display:none !important}
}
@media (min-width: 861px){ .hide-d{display:none !important} }
@media (prefers-reduced-motion: reduce){ *{animation:none !important;transition:none !important} }

/* ---- v3: klar und flach – keine Kästen, keine Seitenstreifen ---- */
body{font-size:var(--t-body);letter-spacing:.003em}
.top h1{font-weight:500;letter-spacing:-.015em}
.top h1 i,.hero .daytxt .wd,.brand b,.ym.cur h3{font-style:normal}
.top h1 i{color:var(--muted);font-weight:400}
.brand b{font-weight:600;letter-spacing:-.02em}
.panel{background:none;border:0;border-radius:0;padding:0}
.panel-h{margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.panel-h h2{font-size:var(--t-h3)}
.grid2{gap:44px}
.stack{gap:36px}
.settings{gap:40px 48px}
.settings .panel-h{border-bottom:0;padding-bottom:0}
.wxnow{background:none;border:0;padding:0}
.railwx{background:none;border:0;padding:6px 10px}
.next{background:var(--accent-soft);color:var(--ink);border-radius:var(--r-lg)}
.next .lbl,.next .meta,.next .cd small{opacity:1;color:var(--muted)}
.next .cd{color:var(--accent-ink)}
.days button{border:0;background:none;border-radius:var(--r)}
.days button:hover{background:var(--sunk)}
.days button.today{box-shadow:none;background:var(--accent-soft)}
.days button.today .dn,.days button.today .wd{color:var(--accent-ink)}
.ev{border-left:0;background:color-mix(in oklab, var(--c) 17%, var(--surface));border-radius:var(--r)}
.ev b{display:flex;align-items:center;gap:7px}
.ev b::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}
.wk-col .ev{border-left:0}
.wk-col .ev b::before{width:6px;height:6px}
.tl-body{border-left:0}
.buf{border-style:dotted}
.card{border:0;background:var(--sunk)}
.card:hover{background:color-mix(in oklab, var(--accent) 8%, var(--sunk))}
.scroller{border:0;background:none}
.wk-h,.wk-corner{background:var(--paper)}
.mo{border:0;background:var(--line);border-radius:var(--r)}
.ym{border:0;background:none;padding:6px 4px}
.notice{border:0}
.banner{border:0;background:var(--sunk)}
.row-item{padding:14px 2px}
.chip{border-color:transparent;background:var(--sunk)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.toast.rem{border:0;box-shadow:none}

/* ---- Stundenplan als Blockraster ---- */
.tt-grid{display:grid;grid-template-columns:64px repeat(var(--days),minmax(0,1fr));gap:8px;min-width:640px}
.tt-head{font-size:var(--t-xs);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:center;padding:4px 0 8px;font-weight:600}
.tt-head.today{color:var(--accent-ink)}
.tt-slot{display:flex;flex-direction:column;justify-content:center;align-items:flex-end;padding-right:6px;font-family:var(--f-mono);font-size:var(--t-xs);color:var(--muted);line-height:1.3}
.tt-slot b{font-family:var(--f-display);font-size:var(--t-lead);color:var(--ink);font-weight:500}
.tt-cell{min-height:104px;border-radius:var(--r);display:flex;flex-direction:column;gap:6px}
.tt-cell.free{border:1.5px dashed var(--line);background:none;cursor:pointer;align-items:center;justify-content:center;color:var(--faint);font-size:var(--t-sm)}
.tt-cell.free:hover{border-color:var(--accent);color:var(--accent-ink)}
.tt-block{flex:1;border:0;border-radius:var(--r);padding:12px 13px;background:color-mix(in oklab, var(--c) 17%, var(--surface));color:var(--ink);text-align:left;display:flex;flex-direction:column;gap:4px;cursor:pointer;min-width:0}
.tt-block:hover{background:color-mix(in oklab, var(--c) 24%, var(--surface))}
.tt-block .ty{font-size:var(--t-2xs);letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--c)}
.tt-block b{font-size:var(--t-ui);font-weight:600;line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tt-block small{font-size:var(--t-sm);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tt-cell.lunch{min-height:20px}

/* ---- v4: Ein Kalender-Tab, Schlafzeile, kräftige Blöcke ---- */
.top .seg{margin-left:4px}
.sleepline{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:center;padding:13px 18px;border-radius:var(--r);background:var(--sleep-soft);border:0;color:var(--ink);margin-bottom:20px;font-size:var(--t-ui);text-align:left;width:100%;cursor:pointer}
.sleepline span{display:inline-flex;gap:7px;align-items:center}
.sleepline svg{color:var(--sleep)}
.sleepline b{font-family:var(--f-mono);font-weight:500;font-size:var(--t-ui)}
.days button.sel{background:var(--ink);color:var(--paper)}
.days button.sel .wd,.days button.sel .tmp,.days button.sel .bed{color:inherit;opacity:.8}
.days .bed,.wk-h .bed,.mo-d .bed{font-family:var(--f-mono);font-size:var(--t-2xs);color:var(--sleep);display:flex;align-items:center;gap:3px}
.days .bed svg,.wk-h .bed svg,.mo-d .bed svg{width:11px;height:11px}
.ev.solid{background:var(--c);color:#fff}
.ev.solid b::before{background:#fff;opacity:.85}
.ev.solid .m{color:rgba(255,255,255,.86)}
.buf.block{background:color-mix(in oklab, var(--c) 16%, var(--surface));border:0;border-radius:var(--r)}
.tt-block{background:var(--c);color:#fff;box-shadow:none}
.tt-block:hover{background:color-mix(in oklab, var(--c) 88%, black)}
.tt-block .ty{color:rgba(255,255,255,.82)}
.tt-block small{color:rgba(255,255,255,.85)}
.newplace{display:grid;gap:12px;padding-top:12px;border-top:1px solid var(--line)}
.newplace .q{font-weight:600;font-size:var(--t-ui)}

/* ---- v5: Übergänge, Tagesfarben, Stil-Optionen ---- */
:root{--r-ev:12px}
.ev,.tt-block,.buf.block,.tt-cell{border-radius:var(--r-ev)}
.nav button,.tabbar button,.seg button,.chip,.days button{transition:background var(--d2) var(--ease),color var(--d2) var(--ease),box-shadow var(--d2) var(--ease)}
main.enter > *{animation:viewin var(--d3) var(--ease) both}
main.enter > *:nth-child(2){animation-delay:.035s} main.enter > *:nth-child(3){animation-delay:.07s} main.enter > *:nth-child(4){animation-delay:.1s} main.enter > *:nth-child(n+5){animation-delay:.13s}
@keyframes viewin{from{opacity:0;transform:translateY(12px)}}
:root[data-motion="off"] *{animation:none !important;transition:none !important}
.top{transition:border-color var(--d2)}
.top .sub{min-height:1.2em}
/* Tagesfarbe: Farbe der dominanten Kategorie, Stärke nach Auslastung */
.dtint{background:color-mix(in oklab, var(--dc, transparent) var(--dl, 0%), var(--paper))}
.wk-h.dtint{background:color-mix(in oklab, var(--dc, transparent) var(--dl, 0%), var(--paper))}
.wk-col.dtint{background-color:color-mix(in oklab, var(--dc, transparent) calc(var(--dl, 0%) * .35), transparent)}
.mo-d.dtint{background:color-mix(in oklab, var(--dc, transparent) var(--dl, 0%), var(--surface))}
.days button.dtint:not(.sel){background:color-mix(in oklab, var(--dc, transparent) var(--dl, 0%), transparent)}
.ymg button.dtint:not(.today){background:color-mix(in oklab, var(--dc, transparent) calc(var(--dl, 0%) * 1.6), transparent)}
.hero .bignum{color:var(--dc, var(--ink))}
.daybar{display:flex;height:6px;border-radius:var(--r-hair);overflow:hidden;gap:2px;margin-top:10px;max-width:280px}
.daybar i{display:block;height:100%;background:var(--c);border-radius:var(--r-hair)}
.wk-times div{display:flex;flex-direction:column;align-items:flex-end;gap:1px;line-height:1.15}
.wk-times .twx{display:flex;align-items:center;gap:2px;color:var(--muted);font-size:var(--t-2xs)}
.wk-times .twx svg{width:15px;height:15px}
.wk-times .twx.approx{opacity:.55}
.marker.sleep.late span{top:-26px}
/* Stil: Schrift */
:root[data-font="modern"]{--f-display:var(--f-body)}
:root[data-font="modern"] .top h1,:root[data-font="modern"] .panel-h h2,:root[data-font="modern"] .h2{font-weight:650;letter-spacing:-.025em}
:root[data-font="modern"] .hero .bignum{font-weight:600;letter-spacing:-.06em}
:root[data-font="tech"]{--f-display:var(--f-mono)}
:root[data-font="tech"] .top h1{font-size:var(--t-h2);letter-spacing:-.04em}
:root[data-font="tech"] .hero .bignum{letter-spacing:-.08em}
/* Stil: Dichte */
:root[data-density="compact"] body{font-size:var(--t-ui)}
:root[data-density="compact"] main{padding-top:12px}
:root[data-density="compact"] .row-item{padding:9px 2px}
:root[data-density="compact"] .grid2{gap:28px}
:root[data-density="airy"] body{font-size:var(--t-body)}
:root[data-density="airy"] .row-item{padding:18px 2px}
:root[data-density="airy"] .grid2{gap:60px}
/* Stil: Ecken */
:root[data-radius="crisp"]{--r:6px;--r-sm:4px;--r-ev:5px}
:root[data-radius="round"]{--r:22px;--r-sm:12px;--r-ev:18px}
/* Stil: Hintergrundton (nur hell) */
@media (prefers-color-scheme: light){
  :root[data-tone="neutral"]:not([data-theme="dark"]){--paper:#F1F1F2;--surface:#FCFCFC;--sunk:#E6E6E9;--line:#DADADE;--muted:#56565E}
  :root[data-tone="warm"]:not([data-theme="dark"]){--paper:#F3F1EE;--surface:#FDFCFA;--sunk:#E9E5E0;--line:#DDD8D1;--muted:#5C5650;--faint:#958D84}
}
:root[data-tone="neutral"][data-theme="light"]{--paper:#F1F1F2;--surface:#FCFCFC;--sunk:#E6E6E9;--line:#DADADE;--muted:#56565E}
:root[data-tone="warm"][data-theme="light"]{--paper:#F3F1EE;--surface:#FDFCFA;--sunk:#E9E5E0;--line:#DDD8D1;--muted:#5C5650;--faint:#958D84}
.stylegrid{display:grid;gap:4px}
.preview{display:flex;gap:10px;align-items:center;padding:14px;border-radius:var(--r);background:var(--sunk);margin-top:6px}
.preview .ev{position:static;flex:1;height:auto;pointer-events:none}

/* ---- v6: Planer ---- */
.ev.work{background:repeating-linear-gradient(135deg, color-mix(in oklab, var(--c) 16%, var(--surface)) 0 7px, color-mix(in oklab, var(--c) 8%, var(--surface)) 7px 14px);outline:1.5px dashed color-mix(in oklab, var(--c) 60%, transparent);outline-offset:-1.5px;color:var(--ink)}
.ev.work b::before{border-radius:var(--r-hair)}
.layers{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;align-items:center}
.layers .lbl{font-size:var(--t-xs);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-right:4px}
.wlist{display:flex;flex-direction:column;gap:12px}
.wday{border-radius:var(--r);background:var(--surface);padding:14px 16px}
.wday.dtint{background:color-mix(in oklab, var(--dc, transparent) var(--dl, 0%), var(--surface))}
.wday.today{box-shadow:inset 0 0 0 2px var(--accent)}
.wday-h{display:flex;align-items:center;gap:12px;cursor:pointer;margin-bottom:8px}
.wday-h .dn{font-family:var(--f-display);font-size:var(--t-h2);line-height:1;min-width:38px}
.wday-h .wd{font-weight:600}
.wday-h small{display:block;color:var(--muted);font-size:var(--t-sm)}
.wday-h .sp{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-family:var(--f-mono);font-size:var(--t-xs);color:var(--muted)}
.wday-h .sp .bed{color:var(--sleep);display:flex;gap:3px;align-items:center}
.wrow{display:grid;grid-template-columns:52px 8px minmax(0,1fr);gap:10px;align-items:center;padding:7px 0;border-top:1px solid color-mix(in oklab, var(--line) 70%, transparent);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;color:var(--ink);cursor:pointer;font-size:var(--t-ui)}
.wrow:first-of-type{border-top:0}
.wrow .t{font-family:var(--f-mono);font-size:var(--t-sm);color:var(--muted)}
.wrow .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.wrow.work .dot{border-radius:var(--r-hair);background:none;outline:1.5px dashed var(--c)}
.wrow.go{color:var(--muted);font-size:var(--t-md);cursor:default}
.wrow.go .dot{background:none;width:8px;height:2px;border-radius:1px;background:var(--faint)}
.wrow .ti{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrow .ti small{color:var(--muted);margin-left:6px}
.review{margin-top:28px}
.revgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:24px}
.stat .big{font-family:var(--f-display);font-size:var(--t-h1);line-height:1}
.stat small{display:block;color:var(--muted);font-size:var(--t-sm);margin-top:4px}
.catbars{display:flex;flex-direction:column;gap:8px}
.catbar{display:grid;grid-template-columns:120px minmax(0,1fr) 54px;gap:10px;align-items:center;font-size:var(--t-md)}
.catbar .tr{height:8px;border-radius:var(--r-xs);background:var(--sunk);overflow:hidden}
.catbar .tr i{display:block;height:100%;background:var(--c);border-radius:var(--r-xs)}
.catbar .n{font-family:var(--f-mono);font-size:var(--t-sm);color:var(--muted);text-align:right}
.habit{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.habit:first-of-type{border-top:0}
.habit .hd{display:flex;gap:4px}
.habit .hd i{width:9px;height:9px;border-radius:50%;background:var(--sunk)}
.habit .hd i.on{background:var(--c)}
.habit .hd i.off{background:transparent;outline:1px dashed var(--line)}
.habit .streak{font-family:var(--f-mono);font-size:var(--t-sm);color:var(--muted);white-space:nowrap}
.habit .hname{cursor:pointer;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.focusbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:45;display:flex;align-items:center;gap:12px;padding:10px 12px 10px 14px;border-radius:var(--r-pill);background:var(--ink);color:var(--paper);box-shadow:none;max-width:calc(100vw - 32px)}
.focusbar .btn{background:transparent;color:var(--paper);border-color:color-mix(in oklab, var(--paper) 30%, transparent)}
.fb-ring{width:30px;height:30px;border-radius:50%;background:conic-gradient(var(--accent-ink) calc(var(--p) * 1%), color-mix(in oklab, var(--paper) 20%, transparent) 0);flex:none}
.fb-txt{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.fb-txt small{opacity:.7;font-size:var(--t-xs);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.fb-txt b{font-size:var(--t-lead)}
.ymg button.brk:not(.today){background:var(--sleep-soft)}
.ymg button.exam:not(.today){background:color-mix(in oklab, var(--danger) 16%, var(--surface))}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:var(--t-sm);color:var(--muted);margin:14px 0 0}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:12px;height:12px;border-radius:var(--r-xs);display:inline-block}
.notebox{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.notebox textarea{width:100%;min-height:90px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--paper);font-size:var(--t-ui);resize:vertical}
.toast .act{margin-top:6px}
@media (max-width: 860px){ .focusbar{bottom:calc(84px + env(safe-area-inset-bottom,0px))} .catbar{grid-template-columns:90px minmax(0,1fr) 48px} }

/* ---- v7: lebendiger Plan ---- */
.ev{background:linear-gradient(160deg, color-mix(in oklab, var(--c) 28%, var(--surface)), color-mix(in oklab, var(--c) 11%, var(--surface)));box-shadow:0 8px 18px -12px var(--c), inset 0 0 0 1px color-mix(in oklab, var(--c) 20%, transparent);transition:transform var(--d1) var(--ease), box-shadow var(--d1) var(--ease)}
.ev:hover{transform:translateY(-1px);box-shadow:0 12px 24px -12px var(--c), inset 0 0 0 1px color-mix(in oklab, var(--c) 30%, transparent)}
.ev.solid{background:linear-gradient(155deg, color-mix(in oklab, var(--c) 82%, white), var(--c) 55%, color-mix(in oklab, var(--c) 85%, black));box-shadow:none}
.ev.work{box-shadow:none}
.ev .wm{position:absolute;right:-8px;bottom:-10px;opacity:.17;pointer-events:none;color:var(--c);display:flex}
.ev .wm svg{width:52px;height:52px;stroke-width:1.3}
.ev.solid .wm{color:#fff;opacity:.26}
.ev.short .wm{right:4px;bottom:auto;top:50%;transform:translateY(-50%);opacity:.22}
.ev.short .wm svg{width:20px;height:20px}
.wk-col .ev .wm svg{width:36px;height:36px}
.tt-block{position:relative;overflow:hidden;background:linear-gradient(155deg, color-mix(in oklab, var(--c) 80%, white), var(--c) 55%, color-mix(in oklab, var(--c) 85%, black))}
.tt-block .wm{position:absolute;right:-10px;bottom:-12px;opacity:.25;color:#fff;display:flex}
.tt-block .wm svg{width:64px;height:64px;stroke-width:1.2}
.sleepzone{background:radial-gradient(circle, color-mix(in oklab, var(--sleep) 55%, transparent) 0 1px, transparent 1.6px) 0 0/26px 26px, linear-gradient(to bottom, color-mix(in oklab, var(--sleep) 13%, transparent), color-mix(in oklab, var(--sleep) 22%, transparent))}
.marker.sleep span{background:var(--sleep);color:#fff;border:0;box-shadow:none}
.marker.now::before{box-shadow:0 0 10px 1px color-mix(in oklab, var(--danger) 60%, transparent)}
.marker.now span{background:var(--danger);color:#fff;border:0}
.wk-times div{border-radius:0}
.tl-h{border-radius:0}
.wk-h{gap:4px;padding:12px 6px 10px}
.wk-h .dn{font-size:var(--t-h1);font-weight:500;padding:2px 8px;border-radius:var(--r)}
.wk-h.today .dn{background:var(--accent);color:#fff;box-shadow:none}
.wk-h .wxl svg{width:22px;height:22px}
.wk-h .bed{background:var(--sleep-soft);padding:1px 7px;border-radius:var(--r-pill)}
.wk-col:hover{background-color:color-mix(in oklab, var(--accent) 3%, transparent)}
.travel{background:repeating-linear-gradient(135deg, color-mix(in oklab, var(--faint) 14%, transparent) 0 4px, transparent 4px 9px);border-color:color-mix(in oklab, var(--faint) 70%, transparent)}
.whero{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:center;justify-content:space-between;padding:20px 22px;border-radius:calc(var(--r) + 6px);margin-bottom:18px;background:radial-gradient(120% 140% at 0% 0%, color-mix(in oklab, var(--accent) 22%, var(--surface)), transparent 60%), radial-gradient(120% 140% at 100% 100%, color-mix(in oklab, var(--sleep) 18%, var(--surface)), transparent 60%), var(--surface)}
.whero-t{display:flex;flex-direction:column;gap:2px}
.whero-t b{font-family:var(--f-display);font-size:var(--t-h1);font-weight:500;line-height:1.05}
.whero-t span:last-child{color:var(--muted);font-size:var(--t-md)}
.whero-c{display:flex;flex-wrap:wrap;gap:8px}
.wchip{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:var(--r-pill);background:color-mix(in oklab, var(--c) 16%, var(--surface));font-size:var(--t-md);color:var(--ink);box-shadow:inset 0 0 0 1px color-mix(in oklab, var(--c) 22%, transparent)}
.wchip svg{color:var(--c)}
.wchip b{font-family:var(--f-mono);font-weight:500;font-size:var(--t-sm)}
.wrow:not(.go){background:linear-gradient(120deg, color-mix(in oklab, var(--c) 18%, transparent), color-mix(in oklab, var(--c) 6%, transparent));border:0;border-radius:var(--r);padding:9px 12px;margin-top:6px;position:relative;overflow:hidden}
.wrow.work{background:repeating-linear-gradient(135deg, color-mix(in oklab, var(--c) 14%, transparent) 0 7px, color-mix(in oklab, var(--c) 6%, transparent) 7px 14px)}
.wrow.go{border:0;padding:4px 12px}
.wday{box-shadow:none}
.wday-h .dn{font-size:var(--t-h1);color:var(--dc, var(--ink))}
.next{background:radial-gradient(130% 160% at 0% 0%, color-mix(in oklab, var(--c) 28%, var(--surface)), transparent 65%), var(--accent-soft)}
.days button{position:relative}
.days button.today:not(.sel) .dn{color:var(--accent-ink)}

/* ---- v7.1: flach, ohne 3D (keine Schatten, kein Anheben, keine Hell-Dunkel-Verläufe) ---- */
.ev{background:color-mix(in oklab, var(--c) 18%, var(--surface));box-shadow:none;transform:none !important}
.ev:hover{box-shadow:none;background:color-mix(in oklab, var(--c) 24%, var(--surface))}
.ev.solid{background:var(--c);box-shadow:none}
.ev.solid:hover{background:color-mix(in oklab, var(--c) 90%, var(--ink))}
.tt-block{background:var(--c);box-shadow:none}
.tt-block:hover{background:color-mix(in oklab, var(--c) 90%, var(--ink))}
.wk-h.today .dn,.marker.sleep span,.wday,.fab{box-shadow:none}
.marker.now::before{box-shadow:none}
.wchip{box-shadow:none}
.whero{background:color-mix(in oklab, var(--accent) 9%, var(--surface))}
.next{background:var(--accent-soft)}
.wrow:not(.go){background:color-mix(in oklab, var(--c) 13%, transparent)}
.nav button[aria-current="page"],.seg button[aria-pressed="true"]{box-shadow:none}
.nav button[aria-current="page"]{background:var(--sunk)}
.seg button[aria-pressed="true"]{background:var(--surface)}
.toast,.sheet .card2,.focusbar{box-shadow:0 0 0 1px var(--line)}

/* ---- v8: Premium-Feinschliff ----
   Typo-Skala (5 Größen, 2 Gewichte) · 8-Punkt-Raster · gleich helle Palette ·
   Mikro-Animationen · Linienillustrationen für leere Zustände */
:root{
  --fs-xs:12px; --fs-s:14px; --fs-m:16px; --fs-l:22px; --fs-xl:32px; --fs-hero:112px;
  --w-reg:400; --w-bold:600;
  --s1:8px; --s2:16px; --s3:24px; --s4:32px; --s5:40px; --s6:48px;
}
body{font-size:var(--fs-m);font-variant-numeric:tabular-nums;font-weight:var(--w-reg)}
.eyebrow,.tag,.group-h h3,.wk-h .wd,.mo-h,.tt-head,.lbl,.f > span{font-size:var(--fs-xs);font-weight:var(--w-bold);letter-spacing:.12em}
.btn,.chip,.seg button,.nav button,.row-item .sm,.ev .m,.note,.muted,.faint,small{font-weight:var(--w-reg)}
.btn{font-size:var(--fs-s);font-weight:var(--w-bold)}
.chip,.seg button{font-size:var(--fs-s)}
.nav button{font-size:var(--fs-m)}
.top h1{font-size:var(--fs-xl);font-weight:var(--w-reg);letter-spacing:-.02em}
.panel-h h2,.h2,.sheet h2{font-size:var(--fs-l);font-weight:var(--w-reg);letter-spacing:-.01em}
.hero .bignum{font-size:clamp(80px,11vw,var(--fs-hero));font-weight:300;letter-spacing:-.05em}
.hero .daytxt .wd{font-size:var(--fs-xl);font-weight:var(--w-reg)}
.wk-h .dn,.mo-d .n .d,.days .dn,.wday-h .dn,.whero-t b,.stat .big,.detail .big,.wxhero .t,.wxnow .t{font-weight:300}
.whero-t b,.stat .big{font-size:var(--fs-xl)}
.row-item .ti,.ev b,.tt-block b,.card b,.listrow .grow,.notice b,.next .t,.menu b{font-weight:var(--w-bold)}
.row-item .ti{font-size:var(--fs-m)} .row-item .sm,.ev .m,.note,.card small{font-size:var(--fs-s)}
.num,.mono,.cd,.days .tmp,.wk-times,.hh{font-feature-settings:"tnum" 1,"zero" 0}
main{padding:var(--s3) var(--s4) 128px}
.top{padding:var(--s2) var(--s4)}
.grid2{gap:var(--s6)}
.stack{gap:var(--s5)}
.panel-h{margin-bottom:var(--s1);padding-bottom:var(--s1)}
.row-item{padding:var(--s2) 0;gap:var(--s2)}
.notices{gap:var(--s1);margin-bottom:var(--s3)}
.notice{padding:var(--s2) var(--s2)}
.days{gap:var(--s1);margin-bottom:var(--s3)}
.whero{padding:var(--s3);margin-bottom:var(--s3)}
.hero{margin:0 0 var(--s3);gap:var(--s2) var(--s4)}
.sleepline{padding:var(--s2) var(--s3);margin-bottom:var(--s3);gap:var(--s1) var(--s3)}
@media (max-width: 860px){ main{padding:var(--s2) var(--s2) calc(120px + env(safe-area-inset-bottom,0px))} .top{padding:var(--s1) var(--s2)} .grid2{gap:var(--s5)} }
/* Palette im Nachtmodus gedämpft, damit nichts blendet */
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .ev.solid,:root:not([data-theme="light"]) .tt-block{background:color-mix(in oklab, var(--c) 72%, var(--surface))} }
:root[data-theme="dark"] .ev.solid,:root[data-theme="dark"] .tt-block{background:color-mix(in oklab, var(--c) 72%, var(--surface))}
/* Mikro-Animationen */
.check svg path{stroke-dasharray:24;stroke-dashoffset:0}
.check.on svg path{animation:drawcheck var(--d3) var(--ease) both}
@keyframes drawcheck{from{stroke-dashoffset:24}}
.check{transition:background var(--d2) var(--ease),border-color var(--d2) var(--ease)}
.check.on{animation:pop var(--d2) var(--ease)}
@keyframes pop{50%{transform:scale(1.12)}}
.switch::after{transition:transform var(--d2) var(--ease)}
.sheet .card2{animation-duration:.26s}
:root[data-motion="off"] .check.on svg path,:root[data-motion="off"] .check.on{animation:none}
/* Leere Zustände */
.emptyart{display:flex;flex-direction:column;align-items:center;text-align:center;gap:var(--s1);padding:var(--s3) var(--s2);color:var(--muted)}
.emptyart svg{width:72px;height:72px;fill:none;stroke:var(--faint);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;margin-bottom:4px}
.emptyart b{color:var(--ink);font-weight:var(--w-reg);font-family:var(--f-display);font-size:var(--fs-l)}
.emptyart span{font-size:var(--fs-s);max-width:34ch}
.tl-empty{position:absolute;left:0;right:0;top:40px;pointer-events:none}
.wday .emptyart{padding:var(--s1) 0;flex-direction:row;gap:var(--s2);text-align:left}
.wday .emptyart svg{width:40px;height:40px;margin:0}
.wday .emptyart b{font-size:var(--fs-m)}

/* ---- Prüf-Chat ---- */
.chat{display:flex;flex-direction:column;gap:10px;max-height:460px;overflow:auto;padding:2px 2px 6px}
.msg{max-width:92%;padding:11px 14px;border-radius:var(--r);font-size:var(--t-ui);line-height:1.45}
.msg.me{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:6px}
.msg.bot{align-self:flex-start;background:var(--sunk);border-bottom-left-radius:6px;display:flex;flex-direction:column;gap:8px;width:92%}
.msg.bot .what{font-weight:600}
.find{display:flex;gap:9px;align-items:flex-start;font-size:var(--t-md)}
.find i{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:none;background:var(--ok)}
.find.warn i{background:var(--warn)}
.find.bad i{background:var(--danger)}
.find.info i{background:var(--faint)}
.msg.bot .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.chat-hint{font-size:var(--t-sm);color:var(--muted);display:flex;flex-wrap:wrap;gap:6px}
.chat-hint button{border:0;background:var(--sunk);border-radius:var(--r-pill);padding:5px 11px;font-size:var(--t-sm);color:var(--muted)}
.typing{display:inline-flex;gap:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--faint);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{50%{opacity:.25}}

[hidden]{display:none !important}
/* ===== v9: Tageszeit-Stimmung, breite Ansicht, Befehlsleiste, Einrichtung ===== */
:root{--mood:#D9965E}
:root[data-daypart="morgen"]{--mood:#D9965E}
:root[data-daypart="tag"]{--mood:#4F8BD0}
:root[data-daypart="abend"]{--mood:#B0668E}
:root[data-daypart="nacht"]{--mood:#4C5596}
:root{--mood-ink:color-mix(in oklab, var(--mood) 72%, var(--ink))}
.top{background:color-mix(in oklab, color-mix(in oklab, var(--mood) 6%, var(--paper)) 88%, transparent);transition:background-color 1.2s}
:root[data-daypart="nacht"] .top{background:color-mix(in oklab, color-mix(in oklab, var(--mood) 12%, var(--paper)) 90%, transparent)}
.whero .eyebrow,.hero .eyebrow{color:var(--mood-ink)}
.sky{display:flex;flex-direction:column;align-items:stretch;gap:2px;min-width:180px;color:var(--mood-ink)}
.sky svg{width:200px;height:58px;overflow:visible}
.sky .arc{fill:none;stroke:color-mix(in oklab, var(--mood) 28%, transparent);stroke-width:1.5}
.sky .arc.done{stroke:var(--mood);stroke-width:2}
.sky .hz{stroke:color-mix(in oklab, var(--ink) 14%, transparent);stroke-width:1}
.sky .sun{fill:var(--mood)}
.sky .sun.off{fill:var(--surface);stroke:var(--mood);stroke-width:1.5}
.sky .lab{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:var(--t-xs);color:var(--muted)}
.sky .lab b{font-family:var(--f-body, inherit);font-weight:var(--w-bold, 600);letter-spacing:.12em;text-transform:uppercase;font-size:var(--t-2xs);color:var(--mood-ink)}

.wide3{display:grid;grid-template-columns:minmax(0,1fr) 316px;gap:var(--s5);align-items:start}
.wide3 > .w-left{display:none}
@media (min-width:1600px){ .wide3{grid-template-columns:228px minmax(0,1fr) 316px} .wide3 > .w-left{display:flex} }
.w-left,.w-right{position:sticky;top:88px;display:flex;flex-direction:column;gap:var(--s4);max-height:calc(100vh - 104px);overflow:auto;scrollbar-width:none;padding-bottom:var(--s3)}
.w-left::-webkit-scrollbar,.w-right::-webkit-scrollbar{display:none}
.w-mid{min-width:0}
.mm-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.mm-h b{font-family:var(--f-display);font-size:var(--fs-lg, 20px);font-weight:400}
.mm-h .nv{display:flex;gap:2px}
.mm-h .nv button{border:0;background:none;color:var(--muted);width:28px;height:28px;border-radius:var(--r-sm);display:grid;place-items:center}
.mm-h .nv button:hover{background:var(--sunk);color:var(--ink)}
.mm-h .nv svg{width:16px;height:16px}
.mm{display:grid;grid-template-columns:repeat(7,1fr);gap:2px 0}
.mm .wd{font-size:var(--t-2xs);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);text-align:center;padding-bottom:4px;font-weight:600}
.mm-d{position:relative;border:0;background:none;color:var(--ink);font-family:var(--f-mono);font-size:var(--t-sm);height:30px;display:grid;place-items:center;border-radius:var(--r-sm);padding:0}
.mm-d:hover{background:var(--sunk)}
.mm-d.inwk{background:color-mix(in oklab, var(--mood) 9%, transparent);border-radius:0}
.mm-d.inwk.wkfirst{border-radius:9px 0 0 9px}.mm-d.inwk.wklast{border-radius:0 9px 9px 0}
.mm-d.out{color:var(--faint)}
.mm-d.hol{color:var(--gold, #916A18)}
.mm-d.today{color:var(--accent-ink);font-weight:700}
.mm-d.sel{background:var(--ink);color:var(--paper);border-radius:var(--r-sm)}
.mm-d i{position:absolute;bottom:3px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--c)}
.mm-d.sel i{background:var(--paper)}
.side-h{font-size:var(--fs-xs);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:var(--w-bold, 600);margin:0 0 8px}
.up{display:flex;gap:10px;align-items:baseline;width:100%;border:0;background:none;text-align:left;padding:7px 8px;margin:0 -8px;border-radius:var(--r-sm);color:var(--ink);font-size:var(--t-md)}
.up:hover{background:var(--sunk)}
.up .d{font-family:var(--f-mono);font-size:var(--t-xs);color:var(--muted);flex:none;width:44px}
.up .d.hot{color:var(--danger)}
.up .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk-head{display:flex;align-items:flex-end;gap:12px}
.pk-head .n{font-family:var(--f-display);font-size:var(--t-d2);line-height:.85;font-weight:300;letter-spacing:-.04em;color:var(--dc, var(--ink))}
.pk-head .w{display:flex;flex-direction:column;gap:2px;padding-bottom:3px;min-width:0}
.pk-head .w b{font-family:var(--f-display);font-size:var(--fs-lg, 20px);font-weight:400}
.pk-head .w span{font-size:var(--t-sm);color:var(--muted)}
.pk-head .wx{margin-left:auto;display:flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:var(--t-sm);color:var(--muted);border:0;background:none;padding:0}
.pk-head .wx svg{width:28px;height:28px}
.pk-sleep{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:var(--t-sm);color:var(--muted);border:0;background:none;padding:0;text-align:left}
.pk-sleep b{color:var(--ink);font-family:var(--f-mono);font-weight:500}
.pk-sleep svg{width:14px;height:14px;vertical-align:-2px;margin-right:4px}
.pk-list{display:flex;flex-direction:column}
.pk-row{display:grid;grid-template-columns:46px 10px minmax(0,1fr);gap:10px;align-items:baseline;border:0;background:none;text-align:left;padding:8px;margin:0 -8px;border-radius:var(--r-sm);color:var(--ink)}
.pk-row:hover{background:var(--sunk)}
.pk-row .tm{font-family:var(--f-mono);font-size:var(--t-sm);color:var(--muted)}
.pk-row .dt{width:8px;height:8px;border-radius:50%;background:var(--c);align-self:center}
.pk-row.leg .dt{background:none;border:1.5px dashed var(--muted);width:6px;height:6px}
.pk-row.work .dt{background:none;border:2px solid var(--c);width:5px;height:5px}
.pk-row .ti{display:flex;flex-direction:column;min-width:0;font-size:var(--t-ui)}
.pk-row .ti small{font-size:var(--t-sm);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk-row.leg .ti{font-size:var(--t-md);color:var(--muted)}
.pk-row.tight .ti{color:var(--danger)}
.pk-row.past{opacity:.5}
.w-right .panel{padding:0;background:none;border:0}
.wk-h.peek{background:color-mix(in oklab, var(--mood) 10%, var(--surface))}
.wk-h.peek:not(.today) .dn{color:var(--mood-ink)}
.whero-t b span[data-count]{font-size:inherit;color:inherit}
.whero-c{flex-basis:100%}
.whero .sky{margin-left:auto}

.topcmd{display:flex;align-items:center;gap:10px;border:0;background:var(--sunk);border-radius:var(--r-pill);padding:8px 8px 8px 14px;color:var(--muted);font-size:var(--t-md);min-width:250px;cursor:pointer}
.topcmd:hover{color:var(--ink)}
.topcmd span{flex:1;text-align:left}
.topcmd svg{width:17px;height:17px}
kbd{font-family:var(--f-mono);font-size:var(--t-xs);padding:2px 7px;border-radius:var(--r-xs);background:color-mix(in oklab, var(--ink) 7%, transparent);color:var(--muted);white-space:nowrap}
.sheet.cmdmode{place-items:start center;padding-top:12vh}
.sheet.cmdmode .card2{width:min(640px,100%);padding:0;border-radius:var(--r-lg);box-shadow:none;border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column}
.cmd-in{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.cmd-in input{flex:1;border:0;background:none;font-size:var(--t-lead);color:var(--ink);outline:none;min-width:0;font-family:inherit;padding:0}
.cmd-in > svg{width:20px;height:20px;color:var(--muted);flex:none}
.cmd-list{max-height:min(54vh,460px);overflow:auto;padding:6px 8px 8px}
.cmd-sec{font-size:var(--fs-xs);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding:12px 12px 4px;font-weight:var(--w-bold, 600)}
.cmd-it{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-radius:var(--r);color:var(--ink)}
.cmd-it .ic{width:32px;height:32px;display:grid;place-items:center;border-radius:var(--r-sm);background:color-mix(in oklab, var(--c, var(--muted)) 13%, transparent);color:var(--c, var(--muted));flex:none}
.cmd-it .ic svg{width:18px;height:18px}
.cmd-it .tx{display:flex;flex-direction:column;min-width:0;flex:1}
.cmd-it .tx b{font-weight:500;font-size:var(--t-ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmd-it .tx small{color:var(--muted);font-size:var(--t-sm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmd-it .go{opacity:0;color:var(--muted)}
.cmd-it.on{background:color-mix(in oklab, var(--accent) 11%, transparent)}
.cmd-it.on .go{opacity:1}
.cmd-empty{padding:28px 20px;color:var(--muted);text-align:center;font-size:var(--t-md)}
.cmd-foot{display:flex;gap:18px;padding:10px 20px;border-top:1px solid var(--line);font-size:var(--t-sm);color:var(--muted);flex-wrap:wrap;align-items:center}
.cmd-foot .grow{flex:1}
@media (max-width:860px){
  .sheet.cmdmode{padding:10px;padding-top:max(12px, env(safe-area-inset-top,0px))}
  .sheet.cmdmode .card2{border-radius:var(--r-lg);max-height:82vh;padding:0}
  .cmd-foot{display:none}
}
.sheet.onbmode .card2{width:min(520px,100%);padding:var(--s4);box-shadow:none}
.onb-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--s4)}
.onb-dots{display:flex;gap:6px}
.onb-dots i{width:26px;height:4px;border-radius:var(--r-hair);background:var(--line);transition:background-color var(--d2)}
.onb-dots i.on{background:var(--mood)}
.onb h2{font-size:var(--fs-xl, 32px);margin:6px 0 8px}
.onb p.lead{color:var(--muted);margin:0 0 var(--s3);font-size:var(--t-ui);line-height:1.5}
.onb .art{color:var(--mood);margin-bottom:var(--s2)}
.onb .art svg{width:44px;height:44px}
.onb .frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:860px){ .sheet.onbmode .card2{padding:var(--s3) var(--s3) calc(var(--s3) + env(safe-area-inset-bottom,0px))} }
@media (prefers-reduced-motion: reduce){ .top,.whero{transition:none} }

/* ===== v10 HARMONIE: ein Faden, eine Stimme, eine Bewegung =====
   1 Tagesfaden oben in jeder Ansicht (Mood-Farbe = der Faden)
   2 Jede Ansicht beginnt mit einem Satz (.lead) in derselben Schrift
   3 Flach: keine getönten Kästen, Hinweise sind Zeilen mit Haarlinie
   4 Zwei Schriften: Serif für Stimme und Titel, Sans (tabellarische
     Ziffern) für alles andere. Keine Versalien-Etiketten.
   5 Eine Bewegungssprache: --ease, View Transitions mit Richtung     */
:root{--ease:cubic-bezier(.2,.8,.2,1);--ease-io:cubic-bezier(.65,0,.35,1);--d1:.14s;--d2:.24s;--d3:.4s;
  --f-mono:var(--f-body)}
:root[data-font="tech"]{--f-display:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace}
body{font-variant-numeric:tabular-nums}

/* Kopfzeile: ruhig, kein Kasten; Mood lebt nur im Faden */
.top,:root[data-daypart="nacht"] .top{background:color-mix(in oklab, var(--paper) 90%, transparent);border-bottom:1px solid transparent;transition:border-color var(--d2)}
.top.scrolled{border-bottom-color:var(--line)}

/* Der Tagesfaden */
.top .faden{flex-basis:100%;order:10;display:grid;grid-template-columns:auto minmax(0,1fr) auto minmax(0,auto);align-items:center;gap:12px;border:0;background:none;padding:4px 0 0;margin:0;color:var(--muted);font-size:var(--t-sm);cursor:pointer;text-align:left}
.ftrack{position:relative;height:12px}
.ftrack::before{content:"";position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;background:var(--line);border-radius:1px}
.fdone{position:absolute;left:0;top:50%;height:2px;margin-top:-1px;background:var(--mood);border-radius:1px;transition:width 1.2s var(--var(--ease))}
.fseg{position:absolute;top:50%;height:6px;margin-top:-3px;border-radius:var(--r-hair);background:var(--c);transition:opacity var(--d3)}
.fseg.past{opacity:.32}
.fnow{position:absolute;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--mood);transition:left 1.2s var(--var(--ease))}
.fnow::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:1.5px solid var(--mood);animation:fpulse 2.8s var(--ease) infinite}
@keyframes fpulse{0%{transform:scale(.5);opacity:.9}70%,100%{transform:scale(1.5);opacity:0}}
.faden .fa,.faden .fz{color:var(--faint)}
.faden .flab{color:var(--ink);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:var(--t-sm)}
.faden .flab i{font-style:normal;color:var(--mood-ink)}
.faden:hover .ftrack::before{background:color-mix(in oklab, var(--mood) 30%, var(--line))}
@media (max-width:860px){ .top .faden{grid-template-columns:auto minmax(0,1fr) auto;gap:8px} .faden .flab{grid-column:1 / -1;order:-1;font-size:var(--t-sm)} }

/* Die Stimme: jede Ansicht beginnt mit einem Satz */
.lead{font-family:var(--f-display);font-size:clamp(20px,2.1vw,25px);line-height:1.4;font-weight:400;color:var(--muted);margin:0 0 var(--s3);max-width:54ch;text-wrap:pretty;letter-spacing:-.005em}
.lead b{color:var(--ink);font-weight:500}
.lead b.hot{color:var(--danger)}
.lead .ln{border:0;background:none;padding:0;font:inherit;color:var(--ink);font-weight:500;text-decoration:underline;text-decoration-color:color-mix(in oklab, var(--mood) 55%, transparent);text-decoration-thickness:1.5px;text-underline-offset:4px;cursor:pointer;transition:text-decoration-color var(--d2)}
.lead .ln:hover{text-decoration-color:var(--mood)}
.hero + .lead{margin-top:calc(-1 * var(--s1))}

/* Flach: keine getönten Kästen mehr */
.banner{background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:0 0 12px;margin:0 0 var(--s3);color:var(--muted);font-size:var(--t-md)}
.note{background:none;padding:0;border-radius:0}
.notices{gap:0;margin-bottom:var(--s3)}
.notice,.notice.warn,.notice.sleep{background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:12px 2px;transition:background-color var(--d2)}
.notices > .notice:first-child{border-top:1px solid var(--line)}
button.notice:hover{background:color-mix(in oklab, var(--ink) 3%, transparent)}
.next{background:none;border-radius:0;padding:var(--s2) 2px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:var(--s3)}
.next .sym{border-radius:50%}
.whero{background:none;padding:0;border-radius:0;margin-bottom:var(--s3)}
.whero .lead{margin-bottom:var(--s2)}
.sleepline{display:none}
.tt-cell.free{border:0;background:none;transition:background-color var(--d2)}
.tt-cell.free:hover{background:color-mix(in oklab, var(--accent) 7%, transparent)}
.cards .card{background:none;border-color:transparent;box-shadow:none;transition:background-color var(--d2)}
.cards .card:hover{background:color-mix(in oklab, var(--ink) 4%, transparent)}

/* Eine Etikett-Sprache: Satzschreibung statt Versalien */
.eyebrow,.tag,.group-h h3,.wk-h .wd,.mo-h,.tt-head,.lbl,.f > span,.side-h,.cmd-sec,.next .lbl,.tt-block .ty,.days .wd,.mm .wd,.ym h3{text-transform:none;letter-spacing:0}
.eyebrow,.group-h h3,.side-h,.cmd-sec,.f > span,.tt-head,.next .lbl{font-size:var(--t-sm);font-weight:600}
.tag{font-size:var(--t-xs);font-weight:600;padding:3px 10px}
.wk-h .wd,.days .wd,.mo-h,.mm .wd{font-size:var(--t-xs);font-weight:600}
.hero .eyebrow{color:var(--mood-ink);font-size:var(--t-md)}
.tt-block .ty{font-size:var(--t-xs);font-weight:600}

/* Fühlbare Antworten auf Handlungen */
.btn,.iconbtn,.chip,.seg button,.days button,.cmd-it,.mm-d,.pk-row,.up,.row-item .check{transition:background-color var(--d1) var(--var(--ease)),color var(--d1),transform var(--d1) var(--var(--ease)),border-color var(--d1)}
.btn:active,.iconbtn:active,.chip:active,.days button:active,.mm-d:active,.fab:active{transform:scale(.96)}
.fab{transition:transform var(--d2) var(--var(--ease))}

/* Fenster schließen sich weich */
.sheet.closing{pointer-events:none}
.sheet.closing .scrim{animation:vt-fade-out var(--d2) var(--ease) both}
.sheet.closing .card2{animation:sheet-sink var(--d2) var(--ease) both}
@keyframes sheet-sink{to{opacity:0;transform:translateY(12px) scale(.985)}}
@media (max-width:860px){ .sheet.closing .card2{animation-name:sheet-sink-m} @keyframes sheet-sink-m{to{transform:translateY(60%);opacity:.4}} .sheet.cmdmode.closing .card2{animation-name:sheet-sink} }

/* View Transitions: was bleibt, bleibt stehen; was wechselt, zeigt die Richtung */
@media (prefers-reduced-motion: no-preference){
  :root[data-motion="on"] #main{view-transition-name:main}
  :root[data-motion="on"] .top h1{view-transition-name:ptitle}
  :root[data-motion="on"] .top .faden{view-transition-name:faden}
  :root[data-motion="on"] .nav button[aria-current="page"]{view-transition-name:navpill}
  :root[data-motion="on"] .top .seg button[aria-pressed="true"]{view-transition-name:segpill}
  :root[data-motion="on"] .tabbar button[aria-current="page"] svg{view-transition-name:tabpill}
  ::view-transition-group(*){animation-duration:var(--d3);animation-timing-function:var(--ease)}
  ::view-transition-old(root),::view-transition-new(root){animation-duration:var(--d2)}
  ::view-transition-old(ptitle),::view-transition-new(ptitle){height:100%;width:auto;object-fit:none;object-position:left center;animation-duration:var(--d2)}
  ::view-transition-old(main){animation:var(--d2) var(--ease) both vt-fade-out}
  ::view-transition-new(main){animation:var(--d3) var(--ease) both vt-rise}
  :root[data-dir="next"]::view-transition-old(main){animation:var(--d3) var(--ease) both vt-out-l}
  :root[data-dir="next"]::view-transition-new(main){animation:var(--d3) var(--ease) both vt-in-r}
  :root[data-dir="prev"]::view-transition-old(main){animation:var(--d3) var(--ease) both vt-out-r}
  :root[data-dir="prev"]::view-transition-new(main){animation:var(--d3) var(--ease) both vt-in-l}
  :root[data-dir="out"]::view-transition-old(main){animation:var(--d3) var(--ease) both vt-zo-old}
  :root[data-dir="out"]::view-transition-new(main){animation:var(--d3) var(--ease) both vt-zo-new}
  :root[data-dir="in"]::view-transition-old(main){animation:var(--d3) var(--ease) both vt-zi-old}
  :root[data-dir="in"]::view-transition-new(main){animation:var(--d3) var(--ease) both vt-zi-new}
}
@keyframes vt-fade-out{to{opacity:0}}
@keyframes vt-rise{from{opacity:0;transform:translateY(10px)}}
@keyframes vt-out-l{to{opacity:0;transform:translateX(-40px)}}
@keyframes vt-in-r{from{opacity:0;transform:translateX(40px)}}
@keyframes vt-out-r{to{opacity:0;transform:translateX(40px)}}
@keyframes vt-in-l{from{opacity:0;transform:translateX(-40px)}}
@keyframes vt-zo-old{to{opacity:0;transform:scale(.965)}}
@keyframes vt-zo-new{from{opacity:0;transform:scale(1.03)}}
@keyframes vt-zi-old{to{opacity:0;transform:scale(1.03)}}
@keyframes vt-zi-new{from{opacity:0;transform:scale(.965)}}
@media (max-width:860px){ .tabbar button[aria-current="page"] svg{background:var(--accent-soft);border-radius:var(--r-pill);padding:3px 14px;box-sizing:content-box} }
@media (prefers-reduced-motion: reduce){ .fnow::after{animation:none} .fdone,.fnow{transition:none} }

/* v10 Feinschliff */
.hero .daytxt .mo{display:block;background:none;border:0;border-radius:0;overflow:visible}
.next .cd,.next .cd *{background:none;box-shadow:none}
.wk-h.today .dn{box-shadow:none}
.days button.dtint:not(.sel){background:none}
.days button:not(.sel) .dn{color:var(--dc, var(--ink))}
.days button.today:not(.sel){background:color-mix(in oklab, var(--accent) 9%, transparent)}
@media (max-width:860px){ .hero{align-items:center;column-gap:var(--s2)} .hero .bignum{font-size:var(--t-d3)} }
/* ===== v11 Feinschliff: Bewegung mit Sinn, Komfort ===== */
/* Faden: beim Öffnen zeichnet sich der Tag einmal von links auf */
.faden.intro .fdone{animation:fdraw 1.1s var(--ease) both}
.faden.intro .fseg{transform-origin:left center;animation:fgrow .55s var(--ease) both;animation-delay:calc(.25s + var(--k, 0) * 60ms)}
.faden.intro .fnow{animation:fpop .4s var(--ease) both;animation-delay:.9s}
@keyframes fdraw{from{width:0}}
@keyframes fgrow{from{transform:scaleX(0);opacity:0}}
@keyframes fpop{from{transform:scale(0)}}
/* Jetzt-Linie trägt dieselbe Farbe wie der Faden */
.marker.now{--c:var(--mood)}
.marker.now::after{animation:nowring 2.8s var(--ease) infinite;outline:1.5px solid transparent}
@keyframes nowring{0%{outline-offset:0;outline-color:var(--mood)}70%,100%{outline-offset:7px;outline-color:transparent}}
/* Termine fallen beim Wechsel der Ansicht spaltenweise ein */
main.enter .wk-col .ev,main.enter .wk-col .travel{animation:evin var(--d3) var(--ease) both;animation-delay:calc(.08s + var(--ci, 0) * 35ms)}
@keyframes evin{from{opacity:0;transform:translateY(6px) scale(.98)}}
/* Toasts gehen so, wie sie kommen */
.toast.out{animation:toastout .22s var(--ease) both}
@keyframes toastout{to{opacity:0;transform:translateX(16px)}}
/* Heute-Knopf ruht, wenn Heute schon zu sehen ist */
.pager .btn.here{opacity:.45;pointer-events:none}
.days button.sel .dn,.days button.sel .wd{color:inherit}
.fdone,.fnow,.mm-d.inwk{--mood:var(--mood-ink)}
.fnow::after{border-color:var(--mood-ink)}
.marker.now{--c:var(--mood-ink)}
@keyframes nowring{0%{outline-offset:0;outline-color:var(--mood-ink)}70%,100%{outline-offset:7px;outline-color:transparent}}
/* Tastenkürzel */
.keys{display:grid;grid-template-columns:auto 1fr;gap:10px 18px;align-items:center;margin:0}
.keys dt{display:flex;gap:4px;justify-content:flex-end}
.keys dd{margin:0;color:var(--ink)}
.keys-sec{grid-column:1 / -1;font-size:var(--t-sm);font-weight:600;color:var(--muted);margin-top:8px}
@media (prefers-reduced-motion: reduce){ .faden.intro *,.marker.now::after,main.enter .wk-col .ev{animation:none !important} }
:root[data-motion="off"] .faden.intro *,:root[data-motion="off"] .marker.now::after,:root[data-motion="off"] main.enter .ev,:root[data-motion="off"] .toast{animation:none !important}
/* ===== v13: Titel-Gedächtnis und Überschneidungen ===== */
.mem{display:flex;align-items:center;gap:12px;padding:10px 12px;margin:-2px 0 2px;border-radius:var(--r);background:color-mix(in oklab, var(--accent) 8%, transparent);animation:memin var(--d3) var(--ease) both}
.mem[hidden]{display:none}
.mem-ic{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;background:color-mix(in oklab, var(--c, var(--accent)) 16%, transparent);color:var(--c, var(--accent-ink))}
.mem-ic svg{width:18px;height:18px}
.mem-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.mem-t b{font-size:var(--t-md);font-weight:600}
.mem-t small{font-size:var(--t-sm);color:var(--muted);line-height:1.4}
.mem-a{display:flex;gap:4px;flex:none}
.mem.done{background:color-mix(in oklab, var(--ok) 9%, transparent)}
.mem.done .mem-ic{--c:var(--ok)}
.mem.done .mem-ic svg{stroke-dasharray:30;animation:drawck .4s var(--ease) both}
@keyframes drawck{from{stroke-dashoffset:30}}
@keyframes memin{from{opacity:0;transform:translateY(-6px)}}
.f.flash input,.f.flash select{animation:fieldflash 1.1s var(--ease)}
@keyframes fieldflash{0%,30%{background:color-mix(in oklab, var(--accent) 18%, var(--surface));border-color:var(--accent)}}
.mem-hint{color:var(--accent-ink)}
.ovl{display:flex;flex-direction:column;gap:7px;padding:12px 0 2px;border-top:1px solid var(--line);min-height:20px}
.ovl:empty{display:none}
.ovl > b{font-size:var(--t-md);font-weight:600}
.ovl.bad > b{color:var(--danger)}
.ovl.warn > b{color:var(--warn)}
.ovl .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.ovl.nudge{animation:nudge .42s var(--ease)}
@keyframes nudge{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.ovl .find{animation:memin var(--d2) var(--ease) both}
.ev.clash::after{content:"";position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--danger);box-shadow:0 0 0 2px var(--surface)}
.btn.primary.ack{background:var(--danger);border-color:var(--danger)}
@media (prefers-reduced-motion: reduce){ .mem,.ovl .find,.ovl.nudge,.f.flash input,.f.flash select{animation:none} }
.wk-col.droptarget{background-color:color-mix(in oklab, var(--accent) 7%, transparent)}
.ev.dragging{transition:transform var(--d1) var(--var(--ease));box-shadow:none}
.ev[data-drag]{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.ev.lifted{transform:scale(1.03);transition:transform var(--d1) var(--var(--ease));z-index:7;outline:2px solid var(--c);outline-offset:1px}

/* ===== Handy: echte Wochenansicht statt Liste ===== */
.scroller.mobile{overflow:visible;margin:0 calc(-1 * var(--s1))}
.wk.compact{min-width:0;grid-template-columns:30px repeat(var(--days),minmax(0,1fr))}
.wk.compact .wk-h{padding:6px 0 6px;gap:2px;top:calc(env(safe-area-inset-top,0px) + var(--top-h, 0px))}
.wk.compact .wk-h .wd{font-size:var(--t-2xs)}
.wk.compact .wk-h .dn{font-size:var(--t-lead);padding:1px 5px;border-radius:var(--r-sm)}
.wk.compact .wk-h .wxl{min-height:0;font-size:0;gap:0}
.wk.compact .wk-h .wxl svg{width:16px;height:16px}
.wk.compact .wk-h .bed{font-size:var(--t-2xs);padding:0 4px;gap:1px}
.wk.compact .wk-h .bed svg{display:none}
.wk.compact .wk-all-l{font-size:0}
.wk.compact .wk-all{padding:2px;min-height:22px;gap:2px}
.wk.compact .wk-all .pill{font-size:var(--t-2xs);padding:1px 3px;border-radius:var(--r-xs);white-space:nowrap;overflow:hidden;text-overflow:clip}
.wk.compact .wk-all .pill .mono{display:none}
.wk.compact .wk-times div{font-size:var(--t-2xs);padding-right:4px}
.wk.compact .wk-times .twx{display:none}
.wk.compact .wk-col .ev{left:1px;right:1px;padding:2px 3px;border-radius:var(--r-xs);font-size:var(--t-2xs);line-height:1.2}
.wk.compact .wk-col .ev b{font-size:var(--t-2xs);font-weight:600;white-space:normal;word-break:normal;overflow-wrap:normal;-webkit-hyphens:auto;hyphens:auto;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.wk.compact .wk-col .ev b::before,.wk.compact .wk-col .ev .wm,.wk.compact .wk-col .ev .m{display:none}
.wk.compact .wk-col .ev.short{padding:1px 3px}
.wk.compact .wk-col .ev.clash::after{top:2px;right:2px;width:6px;height:6px}
.wk.compact .wk-col .travel{left:1px;right:1px;font-size:0;padding:0}
.wk.compact .wk-col .marker span{font-size:var(--t-2xs);padding:0 4px;right:1px;top:-9px}
.wk.compact .wk-col .marker.now span{display:none}

@media (max-width:860px){
  .top{gap:8px 10px;align-items:center}
  .top > div:first-child{flex:1 1 auto;min-width:0}
  .top h1{font-size:var(--t-h2)}
  .top .sub{font-size:var(--t-sm)}
  .top .pager{order:1;margin-left:auto}
  .top .seg{order:2;flex:1 1 auto;display:flex;margin-left:0}
  .top .seg button{flex:1;padding:6px 4px}
  .top .grow{display:none}
  .top .topsearch,.top .search{order:3}
  .top .faden{order:10;padding-top:2px}
  .wk.compact .wk-h,.wk.compact .wk-corner{top:var(--top-h, 0px)}
}

/* Live-Verbindungen */
.travel .late,.tl-travel .late{color:var(--danger);font-weight:600}
.route{display:grid;gap:12px}
.route[hidden]{display:none}
.rlab{font-size:var(--t-sm);font-weight:600;color:var(--muted)}
.rfind{display:grid;gap:8px}
.rfind-r{display:flex;gap:8px;align-items:center}
.rfind-r input{flex:1;min-width:0}
.rmanual{display:grid;gap:10px}
.rfind + .rmanual{padding-top:12px;border-top:1px solid var(--line)}
.rleg{display:grid;gap:8px}
.rleg + .rleg{padding-top:10px;border-top:1px solid var(--line)}
.rleg-h{display:flex;justify-content:space-between;align-items:center;font-size:var(--t-sm);font-weight:600;color:var(--muted)}
.rgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.rgrid.r2{grid-template-columns:repeat(2,minmax(0,1fr))}
.rgrid .f{min-width:0}
.rgrid input[data-k="line"]{font-weight:700}
@media (max-width:560px){ .rgrid{grid-template-columns:repeat(2,minmax(0,1fr))} }
.route > small{line-height:1.45}
.rauto{display:flex;flex-wrap:wrap;gap:6px}
.rauto:empty{display:none}
.rhost-h{display:flex;flex-direction:column;gap:2px;padding-top:12px;border-top:1px solid var(--line);margin-bottom:10px}
.rhost-h b{font-size:var(--t-ui)}
.rhost-h small{color:var(--muted);font-size:var(--t-sm)}
.leave .lv-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.lnb{display:inline-block;font-size:var(--t-sm);font-weight:700;padding:1px 7px;border-radius:var(--r-xs);background:var(--lc, var(--ink));color:#fff;line-height:1.35;white-space:nowrap;font-variant-numeric:tabular-nums}
.leave{display:flex;flex-direction:column;gap:4px;padding:12px 0 2px;border-top:1px solid var(--line);animation:memin var(--d2) var(--ease) both}
.leave:empty{display:none}
.leave b{font-size:var(--t-body);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.leave .lv-l{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:var(--t-md)}
.leave small{color:var(--muted);font-size:var(--t-sm);line-height:1.4}
.tleg .tm .ca{color:var(--muted);font-size:var(--t-xs);display:block}
.ps{display:grid;gap:0;border-top:1px solid var(--line)}
.ps-row{display:grid;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.ps-row[hidden]{display:none}
.ps-h{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:28px}
.ps-h b{font-size:var(--t-ui)}
.ps-h .ps-name{all:unset;box-sizing:border-box;flex:1;min-width:0;font-size:var(--t-ui);font-weight:600;border-bottom:1px dashed var(--line);padding:2px 0}
.ps-h .ps-name::placeholder{color:var(--faint);font-weight:400}
.onb .ps{margin-top:var(--s2)}
.tw{display:grid;border-top:1px solid var(--line)}
.tw-row{display:grid;grid-template-columns:52px minmax(0,1fr);align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.tw-k{font-size:var(--t-sm);font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.tw-v{all:unset;box-sizing:border-box;cursor:pointer;font-size:var(--t-body);font-weight:600;display:flex;flex-direction:column;gap:1px;min-width:0;color:var(--ink)}
.tw-v small{font-size:var(--t-sm);font-weight:400;color:var(--muted)}
.tw-v.empty{color:var(--accent-ink)}
.tw-v:focus-visible{outline:2px solid var(--accent-ink);outline-offset:3px;border-radius:var(--r-xs)}
.tw-pick{display:grid;gap:10px;padding:10px 0 12px;border-bottom:1px solid var(--line);animation:memin var(--d2) var(--ease) both}
.tw-pick[hidden]{display:none}
.tw-conn{display:grid;gap:8px;padding-top:12px}
.tw-conn:empty{display:none}
.tw-conn .chip[aria-pressed="true"],.tw-pick .chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.deps{margin-top:var(--s2);border-top:1px solid var(--line)}
.deps:empty{display:none}
.deps-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:12px 0 6px}
.deps-h b{font-size:var(--t-ui)}
.deps-h small{color:var(--muted);font-size:var(--t-sm)}
.dep{display:grid;grid-template-columns:66px auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:var(--t-md)}
.dep-in{font-weight:600;font-variant-numeric:tabular-nums}
.dep-d{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dep-t{font-variant-numeric:tabular-nums;white-space:nowrap}
.dep-t .late{color:var(--danger);font-weight:600}
.dep.x{opacity:.55;text-decoration:line-through}
.xfer .qr-box{display:flex;justify-content:center;padding:var(--s2) 0}
.xfer .qr{width:min(300px, 78vw);height:auto;border-radius:var(--r);animation:memin var(--d2) var(--ease) both}
.xfer .qr-wait{display:grid;place-items:center;align-content:center;gap:14px;min-height:300px}
.qr-spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:qrspin .8s linear infinite}
@keyframes qrspin{to{transform:rotate(360deg)}}
.xfer .qr-box{padding:var(--s2) 0 var(--s1)}
.xcode{display:grid;justify-items:center;gap:2px;margin:2px 0 var(--s2)}
.xcode span{font-size:var(--t-sm);color:var(--muted)}
.xcode b{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:var(--t-h2);letter-spacing:.14em;font-weight:700}
.xget{display:grid;gap:8px;margin-top:var(--s2);padding-top:var(--s2);border-top:1px solid var(--line)}
.xget-l{font-size:var(--t-sm);color:var(--muted);text-align:center}
.xget-r{display:flex;gap:8px;max-width:360px;width:100%;justify-self:center}
.xget-r .btn{flex:none}
.xcode-in.sm{font-size:var(--t-lead);padding:10px;min-width:0;flex:1}
.xcode-in{width:100%;text-align:center;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:var(--t-h2);letter-spacing:.14em;text-transform:uppercase;padding:14px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--paper);color:var(--ink)}
.xfer .qr{width:min(340px, 82vw);box-shadow:none;border-radius:var(--r-lg);padding:0}
.qr-done{display:grid;place-items:center;gap:6px;min-height:280px;text-align:center;animation:memin var(--d2) var(--ease) both}
.qr-done svg{width:54px;height:54px;color:var(--ok, #2e9e5b)}
.qr-done b{font-size:var(--t-h3)}
.qr-done span{color:var(--muted)}
.xfer-steps{margin:0 auto;padding:0;list-style:none;counter-reset:st;display:grid;gap:8px;max-width:340px}
.xfer-steps li{counter-increment:st;display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:baseline;font-size:var(--t-ui)}
.xfer-steps li::before{content:counter(st);font-weight:700;color:var(--accent-ink);font-variant-numeric:tabular-nums}
.xfer-note{text-align:center;color:var(--muted);font-size:var(--t-sm);margin:var(--s2) 0 0}

.sv-list{list-style:none;margin:6px 0 2px;padding:0;display:grid;gap:0}
.sv-list button{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:12px 46px minmax(0,1fr);gap:8px;align-items:center;width:100%;padding:5px 0;font-size:var(--t-md)}
.sv-list button::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--surface);box-shadow:inset 0 0 0 2.5px var(--lc, var(--ink))}
.sv-list button:hover .sv-n{color:var(--accent-ink)}
.sv-t{font-variant-numeric:tabular-nums;color:var(--muted)}
.sv-t .late{color:var(--danger);margin-left:3px;font-weight:600}
.lv-seg{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;font-size:var(--t-sm);color:var(--muted)}
.lv-seg .sg{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.lv-seg .sg-sep{color:var(--faint);font-style:normal}
.lv-back{color:var(--muted)}
.st-hero{margin:-4px 0 12px}
.st-hero img{width:100%;height:190px;object-fit:cover;border-radius:var(--r);display:block;background:var(--sunk);animation:memin var(--d2) var(--ease) both}
.st-hero small{display:block;color:var(--faint);font-size:var(--t-xs);margin-top:4px}
.sheet-back{margin:-4px 0 6px -8px}
.lt-eta{display:grid;gap:2px;padding:4px 0 2px}
.lt-big{font-size:var(--t-h1);font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.05}
.lt-sub{color:var(--muted);font-size:var(--t-md)}
.lt-now{display:grid;gap:2px;padding:12px 0;border-bottom:1px solid var(--line);margin-bottom:4px}
.lt-now b{font-size:var(--t-body)}
.lt-now small{color:var(--muted);font-size:var(--t-md)}
.lt-note{font-size:var(--t-sm);color:var(--accent-ink)}
.privbtn.on{color:var(--accent-ink);background:color-mix(in oklab, var(--accent) 14%, transparent)}
.lpath{padding:12px 0 6px;border-bottom:1px solid var(--line);margin-bottom:10px}
.lp-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
.lp-h small{color:var(--faint);font-size:var(--t-xs)}
.lp{position:relative;display:grid;grid-template-columns:44px 18px minmax(0,1fr) auto;align-items:center;gap:8px;width:100%;padding:7px 2px;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent;border-radius:var(--r-sm);transition:background var(--d1)}
.lp:hover{background:var(--sunk)}
.lp-t{font-size:var(--t-sm);color:var(--muted);font-variant-numeric:tabular-nums}
.lp-d{position:relative;justify-self:center;width:10px;height:10px;border-radius:50%;border:2px solid var(--accent);background:var(--surface);z-index:1}
.lp-d::before{content:"";position:absolute;left:50%;top:-22px;bottom:-22px;width:2px;margin-left:-1px;background:var(--accent);opacity:.35;z-index:-1}
.lp:first-of-type .lp-d::before{top:50%}.lp.end .lp-d::before{bottom:50%}
.lp.past{color:var(--faint)}.lp.past .lp-d{border-color:var(--faint);background:var(--faint)}
.lp.here .lp-d{width:14px;height:14px;background:var(--accent);box-shadow:0 0 0 5px color-mix(in oklab, var(--accent) 22%, transparent);animation:lppulse 2s var(--ease)-in-out infinite}
@keyframes lppulse{50%{box-shadow:0 0 0 9px color-mix(in oklab, var(--accent) 6%, transparent)}}
.lp.here .lp-n{font-weight:700}
.lp-n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lp-me{display:inline-flex;align-items:center;gap:4px;font-size:var(--t-xs);font-weight:700;color:var(--accent-ink);white-space:nowrap}
.lp-me svg{animation:lpnudge 1.4s var(--ease)-in-out infinite}
@keyframes lpnudge{50%{transform:translateX(3px)}}
.lp-mid{display:grid;grid-template-columns:44px 18px minmax(0,1fr);gap:8px;padding:2px 2px}
.lp-mid::before{content:"";grid-column:2;justify-self:center;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px color-mix(in oklab, var(--accent) 20%, transparent);animation:lppulse 2s var(--ease)-in-out infinite}
.lp-mid .lp-me{grid-column:3}
.lp-more{border:0;background:none;color:var(--muted);font:inherit;font-size:var(--t-sm);padding:4px 0 4px 54px;cursor:pointer;text-align:left}
.lp-more:hover{color:var(--accent-ink)}
.lt-k{font-size:var(--t-xs);text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--muted)}
.lt-pace{font-size:var(--t-md);font-weight:600;margin-top:4px}
.lt-pace.ok{color:var(--ok, #2e8b57)}.lt-pace.late{color:var(--danger)}.lt-pace.early{color:var(--accent-ink)}
.lt-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.lt-acts:empty{display:none}
.lt-pick{display:grid;gap:4px;padding:12px 0;border-bottom:1px solid var(--line);animation:memin var(--d2) var(--ease) both}
.lt-pick small{color:var(--muted);font-size:var(--t-sm)}
.lt-opts{display:grid;gap:2px;margin-top:6px}
.lt-opts button{display:flex;align-items:center;gap:12px;padding:10px 4px;border:0;border-bottom:1px solid var(--line);background:none;color:inherit;text-align:left;cursor:pointer;font:inherit}
.lt-opts button:last-child{border-bottom:0}
.lt-opts button:hover b{color:var(--accent-ink)}
.lt-opts button span small{display:block}
details.sub{border-bottom:1px solid var(--line)}
details.sub > summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0}
details.sub > summary::-webkit-details-marker{display:none}
details.sub > summary b{display:block;font-size:var(--t-ui);font-weight:500}
details.sub > summary small{display:block;color:var(--muted);font-size:var(--t-sm)}
details.sub > summary svg{color:var(--faint);transition:transform var(--d2) var(--var(--ease))}
details.sub[open] > summary svg{transform:rotate(90deg)}
.settings.acc{display:block;max-width:760px;border-top:1px solid var(--line)}
details.sx{border-bottom:1px solid var(--line)}
details.sx > summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:30px minmax(0,1fr) 18px;gap:12px;align-items:center;padding:15px 2px;-webkit-tap-highlight-color:transparent}
details.sx > summary::-webkit-details-marker{display:none}
details.sx > summary:hover .sx-t b{color:var(--accent-ink)}
.sx-ic{display:grid;place-items:center;width:30px;height:30px;border-radius:var(--r-sm);background:var(--sunk);color:var(--accent-ink)}
.sx-t b{display:block;font-size:var(--t-body);font-weight:600;transition:color var(--d1)}
.sx-t small{display:block;color:var(--muted);font-size:var(--t-sm);margin-top:1px}
.sx-chev{color:var(--faint);display:grid;place-items:center;transition:transform var(--d2) var(--var(--ease))}
details.sx[open] .sx-chev{transform:rotate(90deg)}
details.sx[open] > summary .sx-t b{color:var(--accent-ink)}
.sx-body{padding:0 2px 20px 42px;animation:memin var(--d2) var(--ease) both}
.sx-tools{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-start;margin:0 0 10px}
@media (max-width:560px){ .sx-body{padding-left:2px} }
.stop-sheet{position:relative;isolation:isolate}
.st-bg{position:absolute;left:-28px;right:-28px;top:-28px;height:460px;z-index:-1;pointer-events:none;background:radial-gradient(60% 60% at 30% 30%, var(--c1, var(--accent)) 0, transparent 70%),radial-gradient(50% 55% at 75% 40%, var(--c2, var(--c1, var(--accent))) 0, transparent 70%);filter:blur(var(--blur-3)) saturate(1.4);opacity:.42;-webkit-mask-image:linear-gradient(#000 45%, transparent);mask-image:linear-gradient(#000 45%, transparent)}
.st-bg.img{background-size:cover;background-position:center;filter:blur(var(--blur-3)) saturate(1.6) brightness(.95);opacity:.55;transform:scale(1.15)}
.st-hero{position:relative;height:230px;border-radius:var(--r-lg);overflow:hidden;margin:0 0 14px;background:var(--sunk);animation:memin var(--d2) var(--ease) both}
.st-photo{position:absolute;inset:0;background-size:cover;background-position:center;transition:opacity var(--d3) var(--var(--ease))}
.st-hero.noimg .st-photo{background:radial-gradient(70% 90% at 20% 20%, var(--c1, var(--accent)) 0, transparent 65%),radial-gradient(60% 80% at 85% 70%, var(--c2, var(--c1, var(--accent))) 0, transparent 65%),var(--sunk);filter:blur(var(--blur-2)) saturate(1.3);opacity:.75;transform:scale(1.2)}
.st-hero.img .st-photo{animation:stzoom 14s var(--ease) both}
@keyframes stzoom{from{transform:scale(1.08)}to{transform:scale(1)}}
.st-top{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:center;z-index:2}
.st-top .iconbtn,.st-top .sheet-back{background:color-mix(in oklab, var(--surface) 45%, transparent);-webkit-backdrop-filter:blur(var(--blur-1)) saturate(1.4);backdrop-filter:blur(var(--blur-1)) saturate(1.4);border-radius:var(--r-pill);margin:0;color:var(--ink)}
.st-glass{position:absolute;left:12px;right:12px;bottom:12px;z-index:2;padding:12px 14px 13px;border-radius:var(--r);background:color-mix(in oklab, var(--surface) 55%, transparent);-webkit-backdrop-filter:blur(var(--blur-2)) saturate(1.5);backdrop-filter:blur(var(--blur-2)) saturate(1.5);border:1px solid color-mix(in oklab, #fff 16%, transparent)}
.st-glass small{display:block;text-transform:uppercase;letter-spacing:.09em;font-size:var(--t-2xs);font-weight:600;color:var(--muted)}
.st-glass b{display:block;font-family:var(--f-display);font-size:var(--t-h3);font-weight:500;line-height:1.15;margin-top:2px}
.st-lines{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.st-lines:empty{display:none}
.st-map{height:150px;border-radius:var(--r-lg);margin-top:0}
.st-deps{margin-top:14px;border-top:0;border-radius:var(--r-lg);padding:2px 14px 4px;background:color-mix(in oklab, var(--surface) 62%, transparent);-webkit-backdrop-filter:blur(var(--blur-1));backdrop-filter:blur(var(--blur-1));border:1px solid var(--line)}
.st-deps .dep:last-child{border-bottom:0}
.st-credit{display:block;color:var(--faint);font-size:var(--t-xs);margin-top:10px;text-align:center}
.st-credit:empty{display:none}
.tmap .leaflet-container,.tmap{cursor:default}
.trip-tol{display:flex;gap:8px;align-items:flex-start;color:var(--muted);font-size:var(--t-sm);margin:2px 0 10px}
.trip-tol svg{flex:none;margin-top:2px;color:var(--accent-ink)}
.dl-list{display:flex;flex-wrap:wrap;gap:6px 14px;margin:4px 0 2px;font-size:var(--t-sm);color:var(--muted)}
.dl-list span{display:inline-flex;gap:6px;align-items:center}
.vibchips{display:flex;flex-wrap:wrap;gap:6px}
.vibchips label{display:inline-flex;position:relative}
.vibchips input{position:absolute;opacity:0;pointer-events:none}
.vibchips span{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:var(--r-pill);padding:6px 12px 6px 10px;font-size:var(--t-sm);color:var(--muted);cursor:pointer;transition:border-color var(--d1),background var(--d1),color var(--d1)}
.vibchips input:checked + span{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.vibchips input:focus-visible + span{outline:2px solid var(--accent-ink);outline-offset:2px}
.vg{position:relative;display:inline-block;width:30px;height:10px;border-radius:var(--r-hair);background:color-mix(in oklab, currentColor 12%, transparent);overflow:hidden}
.vg i{position:absolute;top:2px;bottom:2px;border-radius:var(--r-hair);background:currentColor}
.vg-off{background:none;border:1px dashed color-mix(in oklab, currentColor 45%, transparent)}
.vibset{margin:10px 0}
.apk-box{display:grid;gap:6px;padding:14px 0 16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:var(--s2)}
.apk-box b{font-size:var(--t-body)}
.apk-box span{color:var(--muted);font-size:var(--t-md)}
.apk-box .btn{justify-self:start;margin-top:4px}
.vh-step{display:grid;gap:10px;padding:14px 0;border-top:1px solid var(--line)}
.vh-h{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.vh-n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:var(--t-sm);font-weight:700;background:var(--sunk);color:var(--muted)}
.vh-step.ok .vh-n{background:color-mix(in oklab, var(--ok, #2e9e5b) 18%, transparent);color:var(--ok, #2e9e5b)}
.vh-step.no .vh-n{background:color-mix(in oklab, var(--danger) 16%, transparent);color:var(--danger)}
.vh-h b{display:block;font-size:var(--t-ui)}
.vh-h small{color:var(--muted);font-size:var(--t-sm);line-height:1.4}
.vh-a{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-left:38px}
.vh-q{display:inline-flex;gap:6px;align-items:center;margin-left:auto;font-size:var(--t-md);color:var(--muted)}
.vh-fix{margin:0 0 0 38px;font-size:var(--t-md);line-height:1.5;color:var(--ink);animation:memin var(--d2) var(--ease) both}
.vh-q2{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:0 0 12px 38px;font-size:var(--t-md)}
.vh-q2 span{width:100%;color:var(--muted)}
.vh-list{display:grid;gap:0;border-top:1px solid var(--line)}
.vh-row{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;padding:11px 0;border-bottom:1px solid var(--line)}
.vh-row svg{margin-top:2px}
.vh-row.ok svg{color:var(--ok, #2e9e5b)}
.vh-row.no svg{color:var(--danger)}
.vh-row b{display:block;font-size:var(--t-ui)}
.vh-row small{color:var(--muted);font-size:var(--t-sm);line-height:1.4}
.vh-steps{margin:var(--s2) 0 0;padding-left:20px;display:grid;gap:10px;font-size:var(--t-md);line-height:1.45}
.vh-steps b{font-weight:600}
.trip{display:flex;flex-direction:column;gap:0;margin-top:var(--s2);border-top:1px solid var(--line)}
.trip-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:12px 0 6px}
.trip-h b{font-size:var(--t-ui)}
.trip-h small{color:var(--muted);font-size:var(--t-sm)}
.tleg{display:grid;grid-template-columns:52px var(--lw, 40px) minmax(0,1fr);gap:10px;align-items:start;padding:8px 0;border-bottom:1px solid var(--line)}
.tleg .tm{font-variant-numeric:tabular-nums;font-size:var(--t-md);line-height:1.3}
.tleg .tm s{color:var(--faint);font-size:var(--t-xs);display:block}
.tleg .tm .late{color:var(--danger);font-size:var(--t-xs);display:block;font-weight:600}
.tleg .ln{justify-self:start;font-size:var(--t-sm);font-weight:700;padding:2px 7px;border-radius:var(--r-xs);background:var(--lc, var(--ink));color:#fff;line-height:1.3;white-space:nowrap}
.tleg .ln.walk{background:none;color:var(--muted);font-weight:500;padding:2px 0}
.tleg .tx{font-size:var(--t-md);line-height:1.35;min-width:0}
.tleg .tx small{display:block;color:var(--muted);font-size:var(--t-sm)}
.tleg.x .tx,.tleg.x .tm{opacity:.55;text-decoration:line-through}
.trip-alt{display:flex;flex-wrap:wrap;gap:6px;padding-top:10px}

/* ===== Schlafanalyse ===== */
.sl-head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--s3) var(--s4);align-items:center;margin-bottom:var(--s4)}
.sl-score{position:relative;width:132px;height:132px}
.sl-score svg{width:132px;height:132px;transform:rotate(-90deg)}
.sl-score .bg{fill:none;stroke:var(--line);stroke-width:9}
.sl-score .fg{fill:none;stroke:var(--sleep);stroke-width:9;stroke-linecap:round;transition:stroke-dasharray 1s var(--var(--ease))}
.sl-score .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.sl-score .num b{font-family:var(--f-display);font-size:var(--t-d1);font-weight:300;line-height:1}
.sl-score .num small{font-size:var(--t-sm);color:var(--muted)}
.sl-parts{display:flex;flex-direction:column;gap:9px;min-width:0}
.sl-part{display:grid;grid-template-columns:minmax(130px,170px) minmax(0,1fr) 36px;gap:10px;align-items:center;font-size:var(--t-md)}
.sl-part i{height:6px;border-radius:var(--r-hair);background:var(--line);position:relative;overflow:hidden}
.sl-part i::after{content:"";position:absolute;inset:0 auto 0 0;width:var(--v);background:var(--pc, var(--sleep));border-radius:var(--r-hair)}
.sl-part b{font-variant-numeric:tabular-nums;text-align:right;font-weight:600}
.sl-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s3);margin:0 0 var(--s4);padding:var(--s3) 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.sl-kpi{display:flex;flex-direction:column;gap:2px;min-width:0}
.sl-kpi small{font-size:var(--t-sm);color:var(--muted)}
.sl-kpi b{font-family:var(--f-display);font-size:var(--t-h2);font-weight:400;line-height:1.1;font-variant-numeric:tabular-nums}
.sl-kpi span{font-size:var(--t-sm);color:var(--muted)}
.sl-kpi span.bad{color:var(--danger)} .sl-kpi span.good{color:var(--ok)}
.sl-chart{width:100%;height:auto;display:block}
.sl-chart text{fill:var(--muted);font-family:var(--f-body)}
.sl-chart .grid{stroke:var(--line);stroke-width:1}
.sl-chart .plan{fill:none;stroke:color-mix(in oklab, var(--sleep) 55%, transparent);stroke-width:1.2;stroke-dasharray:3 3}
.sl-chart .act{fill:var(--sleep)}
.sl-chart .mid{fill:var(--paper);stroke:var(--sleep);stroke-width:1.5}
.sl-chart .we{fill:color-mix(in oklab, var(--sleep) 7%, transparent)}
.sl-chart .need{stroke:var(--ink);stroke-width:1;stroke-dasharray:4 4;opacity:.55}
.sl-chart .bar{fill:color-mix(in oklab, var(--sleep) 70%, transparent)}
.sl-chart .bar.short{fill:color-mix(in oklab, var(--danger) 60%, transparent)}
.sl-chart .fut{fill:none;stroke:color-mix(in oklab, var(--sleep) 60%, transparent);stroke-width:1.2;stroke-dasharray:3 3}
.sl-sec{margin:var(--s4) 0 var(--s2);display:flex;align-items:baseline;justify-content:space-between;gap:8px 10px;flex-wrap:wrap}
.sl-sec h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:var(--fs-l, 22px)}
.sl-sec small{color:var(--muted);font-size:var(--t-sm)}
.chrono{position:relative;height:34px;margin:6px 0 4px}
.chrono .track{position:absolute;left:0;right:0;top:14px;height:6px;border-radius:var(--r-hair);background:var(--line)}
.chrono .track::before,.chrono .track::after{content:"";position:absolute;top:-4px;width:1px;height:14px;background:var(--faint)}
.chrono .track::before{left:46%}.chrono .track::after{left:62%}
.chrono .pin{background:var(--sleep)!important;width:12px!important;height:12px!important;border-radius:50%!important;top:11px!important;margin-left:-6px!important}
.chrono .pin{position:absolute;top:6px;width:4px;height:22px;margin-left:-2px;border-radius:var(--r-hair);background:var(--ink)}
.chrono-l{display:flex;justify-content:space-between;font-size:var(--t-xs);color:var(--muted)}
.sl-ins{display:flex;flex-direction:column}
.sl-ins .it{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.sl-ins .it:first-child{border-top:1px solid var(--line)}
.sl-ins .it svg{width:18px;height:18px;color:var(--sleep);margin-top:2px}
.sl-ins .it.warn svg{color:var(--warn)} .sl-ins .it.good svg{color:var(--ok)}
.sl-ins b{font-weight:600}
.sl-ins small{display:block;color:var(--muted);font-size:var(--t-md);margin-top:2px;line-height:1.45}
.sl-tags{display:grid;grid-template-columns:minmax(0,1fr) 120px 48px;gap:6px 12px;align-items:center;font-size:var(--t-md)}
.sl-tags i{height:6px;border-radius:var(--r-hair);background:var(--line);position:relative}
.sl-tags i::after{content:"";position:absolute;top:-3px;width:2px;height:12px;left:var(--z);background:var(--muted)}
.sl-tags i em{position:absolute;top:0;height:6px;border-radius:var(--r-hair);left:min(var(--z),var(--p));width:calc(max(var(--z),var(--p)) - min(var(--z),var(--p)));background:var(--pc)}
.sl-tags b{text-align:right;font-variant-numeric:tabular-nums}
.sl-log{display:flex;flex-direction:column}
.sl-log button{display:grid;grid-template-columns:90px minmax(0,1fr) auto;gap:10px;align-items:center;border:0;background:none;text-align:left;padding:10px 2px;border-bottom:1px solid var(--line);color:var(--ink);font-size:var(--t-md)}
.sl-log button:hover{background:color-mix(in oklab, var(--ink) 3%, transparent)}

@media (max-width:860px){ .sl-sec .seg{flex-basis:100%;display:flex} .sl-sec .seg button{flex:1} .sl-head{grid-template-columns:1fr;justify-items:center} .sl-parts{width:100%} .sl-kpis{grid-template-columns:repeat(2,minmax(0,1fr))} .sl-tags{grid-template-columns:minmax(0,1fr) 80px 44px} }

/* Schlaf, ruhige Fassung */
.sx-hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--s4);align-items:center;margin:0 0 var(--s4)}
.sx-score{display:flex;flex-direction:column;align-items:flex-start;min-width:96px}
