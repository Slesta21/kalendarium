.sx-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s3);padding:var(--s3) 0;margin-bottom:var(--s3);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.sx-stat{display:flex;flex-direction:column;gap:2px;min-width:0}

.sx-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:var(--s4) 0 var(--s2)}

.sx-h .seg button{padding:5px 12px}
.sl-chart .act{fill:var(--sleep)}
.sl-chart .plan{fill:none;stroke:color-mix(in oklab, var(--sleep) 45%, transparent);stroke-width:1.2;stroke-dasharray:none}
.sl-chart .fut{fill:color-mix(in oklab, var(--sleep) 10%, transparent);stroke:color-mix(in oklab, var(--sleep) 45%, transparent);stroke-width:1.2;stroke-dasharray:4 3}

.sx-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:var(--t-sm);color:var(--muted);margin-top:6px}

.sx-legend i{width:16px;height:8px;border-radius:var(--r-xs);display:inline-block}
.sx-legend i.a{background:var(--sleep)} .sx-legend i.p{border:1.2px solid color-mix(in oklab, var(--sleep) 45%, transparent)} .sx-legend i.w{background:color-mix(in oklab, var(--sleep) 9%, transparent);border-radius:var(--r-hair)}
.sx-log{display:flex;flex-direction:column}
.sx-log button{display:grid;grid-template-columns:minmax(80px,110px) minmax(0,1fr) auto auto;gap:14px;align-items:center;border:0;background:none;text-align:left;padding:11px 2px;border-bottom:1px solid var(--line);color:var(--ink);font-size:var(--t-md);font-variant-numeric:tabular-nums}
.sx-log button:hover{background:color-mix(in oklab, var(--ink) 3%, transparent)}
.sx-log .d{color:var(--muted)}
.sx-log .q{display:flex;gap:3px}.sx-log .q i{width:6px;height:6px;border-radius:50%;background:var(--line)}.sx-log .q i.on{background:var(--sleep)}
.sx-more{margin-top:var(--s3)}

.sx-parts{display:flex;flex-direction:column;gap:8px;margin:6px 0 var(--s2)}

@media (max-width:860px){ .sx-hero{grid-template-columns:1fr;gap:var(--s2)} .sx-score{flex-direction:row;align-items:baseline;gap:12px} .sx-score b{font-size:var(--t-d2)} .sx-stat b{font-size:var(--t-h3)} .sx-stats{gap:var(--s2)} .sx-log button{grid-template-columns:96px minmax(0,1fr) auto;gap:8px;white-space:nowrap} .sx-log .q{display:none} .sx-parts div{grid-template-columns:120px minmax(0,1fr) 30px} }

/* =====================================================================
   §0 GRUNDLAGE · FADEN-SYSTEM (v30)
   Eine Grammatik für alle Bereiche, jeder Bereich mit eigenem Ton.
   1 Fläche statt Kasten   Inhalte liegen auf Papier, gegliedert durch
                           Raum und Haarlinien. Keine Rahmen um Gruppen.
   2 Tiefe nur durch Glas  Was schwebt (Leisten, Fenster, Meldungen,
                           Overlays auf Bildern und Karten), ist unscharf
                           hinterlegt. Keine Schatten, keine Hell-Dunkel-
                           Verläufe, kein Anheben.
   3 Ein Faden             Zeit ist eine 2-px-Linie mit Ring-Punkten,
                           „jetzt“ ein gefüllter, atmender Punkt.
   4 Ein Ton je Bereich    --zone (aus der Kategorie-Palette, OKLCH L .55)
                           färbt Titel-Kursive, aktive Navigation,
                           gewählte Chips und den weichen Schein oben.
                           Handlungen bleiben in der Akzentfarbe.
   5 Drei Schriften        Serif = Stimme, Titel, große Zahlen.
                           Sans = alles Bedienbare. Mono nur für Codes.
                           Zeiten immer mit tabellarischen Ziffern.
   6 Etiketten             Satzschreibung, nie Versalien, nie Sperrung.
   7 Eine Bewegung         steigen + einblenden; drei Dauern, eine Kurve.
   ===================================================================== */
:root{
  --t-2xs:10.5px; --t-xs:12px; --t-sm:13px; --t-md:14px; --t-ui:15px; --t-body:16px; --t-lead:19px;
  --t-h3:23px; --t-h2:26px; --t-h1:34px; --t-d1:46px; --t-d2:60px; --t-d3:80px; --t-d4:96px;
  --lh-tight:1.15; --lh:1.5;
  --fs-xs:var(--t-xs); --fs-s:var(--t-md); --fs-m:var(--t-body); --fs-l:var(--t-h3); --fs-xl:var(--t-h1);
  --s0:4px; --s1h:12px;
  --r-hair:3px; --r-xs:6px; --r-sm:10px; --r:14px; --r-lg:20px; --r-pill:999px; --r-ev:12px;
  --blur-1:14px; --blur-2:22px; --blur-3:44px;
  --glass:color-mix(in oklab, var(--surface) 62%, transparent);
  --glass-strong:color-mix(in oklab, var(--surface) 86%, transparent);
  --glass-bar:color-mix(in oklab, var(--paper) 74%, transparent);
  --glass-line:color-mix(in oklab, var(--ink) 9%, transparent);
  --shadow:none; --on-accent:#fff; --d-slow:1.2s;
  --zone:var(--accent);
  --zone-ink:color-mix(in oklab, var(--zone) 88%, var(--ink));
  --zone-soft:color-mix(in oklab, var(--zone) 12%, var(--surface));
  --glow:.12;
}
:root[data-zone="aufgaben"]{--zone:#A35C3A}
:root[data-zone="stundenplan"]{--zone:#007F9C}
:root[data-zone="schlaf"]{--zone:var(--sleep)}
:root[data-zone="wetter"]{--zone:#576EAF}
:root[data-zone="links"]{--zone:#895E9C}
:root[data-zone="einstellungen"]{--zone:#6B727E}
:root[data-zone="suche"]{--zone:var(--accent)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --zone-ink:color-mix(in oklab, var(--zone) 58%, white);
  --zone-soft:color-mix(in oklab, var(--zone) 24%, var(--surface));
  --glass-line:color-mix(in oklab, white 9%, transparent);
  --glow:.2; } }
:root[data-theme="dark"]{
  --zone-ink:color-mix(in oklab, var(--zone) 58%, white);
  --zone-soft:color-mix(in oklab, var(--zone) 24%, var(--surface));
  --glass-line:color-mix(in oklab, white 9%, transparent);
  --glow:.2; }
:root[data-radius="crisp"]{--r-xs:3px;--r-sm:5px;--r:6px;--r-lg:8px;--r-ev:5px}
:root[data-radius="round"]{--r-xs:8px;--r-sm:14px;--r:22px;--r-lg:28px;--r-ev:18px}

/* 2 Glas: alles, was schwebt */
.glass{background:var(--glass);-webkit-backdrop-filter:blur(var(--blur-2)) saturate(1.4);backdrop-filter:blur(var(--blur-2)) saturate(1.4);border:1px solid var(--glass-line)}
.top,:root[data-daypart="nacht"] .top{background:var(--glass-bar);-webkit-backdrop-filter:blur(var(--blur-1)) saturate(1.4);backdrop-filter:blur(var(--blur-1)) saturate(1.4)}
@media (max-width:860px){ .tabbar{background:var(--glass-bar);-webkit-backdrop-filter:blur(var(--blur-2)) saturate(1.4);backdrop-filter:blur(var(--blur-2)) saturate(1.4);border-top:1px solid var(--glass-line)} }
.sheet .scrim{background:color-mix(in oklab, var(--paper) 30%, rgb(8 10 20 / .38));-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.sheet .card2{background:var(--glass-strong);-webkit-backdrop-filter:blur(var(--blur-2)) saturate(1.3);backdrop-filter:blur(var(--blur-2)) saturate(1.3);border:1px solid var(--glass-line);box-shadow:none;border-radius:var(--r-lg)}
@media (max-width:860px){ .sheet .card2{border-radius:var(--r-lg) var(--r-lg) 0 0;border-bottom:0} }
.sheet.cmdmode .card2{border:1px solid var(--glass-line)}
.toast,.toast.rem{background:var(--glass-strong);color:var(--ink);-webkit-backdrop-filter:blur(var(--blur-2)) saturate(1.4);backdrop-filter:blur(var(--blur-2)) saturate(1.4);border:1px solid var(--glass-line);box-shadow:none;border-radius:var(--r)}
.toast small{color:var(--muted);opacity:1}
.toast > span:first-child{color:var(--zone-ink)}
.focusbar{box-shadow:none}
.st-glass,.st-top .iconbtn,.st-top .sheet-back{background:var(--glass);border-color:var(--glass-line)}

/* 1 Keine Schatten, kein Anheben */
.fab,.tt-block,.ev,.ev.solid,.nav button,.seg button,.wchip,.wday,.wk-h.today .dn,.marker.now::before{box-shadow:none}
.fab{background:var(--accent);color:var(--on-accent)}
.btn.primary{color:var(--on-accent)}

/* Kopfzeile am Handy: Titel, Auge und Blättern in einer Zeile, darunter Ansicht und Suche */
@media (max-width:860px){
  .top > div:first-child{flex:1 1 0;min-width:0}
  .top h1,.top .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
}
/* 4 Bereichston */
.top h1 i{color:var(--zone-ink)}
.nav button[aria-current="page"]{background:var(--zone-soft);color:var(--ink)}
.nav button[aria-current="page"] svg{color:var(--zone-ink)}
@media (max-width:860px){
  .tabbar button[aria-current="page"]{color:var(--zone-ink)}
  .tabbar button[aria-current="page"] svg{background:var(--zone-soft)}
}
.chip[aria-pressed="true"]{background:var(--zone-soft);color:var(--zone-ink);border-color:transparent}
.sx-ic{color:var(--zone-ink);background:var(--zone-soft)}
details.sx[open] > summary .sx-t b,details.sx > summary:hover .sx-t b{color:var(--zone-ink)}
.col{position:relative;isolation:isolate;overflow-x:clip}
.col::before{content:"";position:absolute;z-index:-1;pointer-events:none;top:-140px;right:-60px;width:min(620px,80vw);height:360px;border-radius:50%;background:var(--zone);opacity:var(--glow);filter:blur(var(--blur-3)) saturate(1.2);transition:background-color var(--d3) var(--ease)}
.col::after{content:"";position:absolute;z-index:-1;pointer-events:none;top:-80px;left:12%;width:min(380px,50vw);height:220px;border-radius:50%;background:var(--mood);opacity:calc(var(--glow) * .55);filter:blur(var(--blur-3))}
@media (prefers-reduced-motion: reduce){ .col::before{transition:none} }

/* 6 Etiketten: Satzschreibung */
.eyebrow,.tag,.group-h h3,.wxnow .city,.next .lbl,.days .wd,.wk-h .wd,.mo-h,.f > span,.detail .wxgrid small,.tt-head,.tt-block .ty,.layers .lbl,.sky .lab b,.mm .wd,.side-h,.cmd-sec,.tw-k,.lt-k,.st-glass small{text-transform:none;letter-spacing:0}
.tw-k,.lt-k,.st-glass small,.layers .lbl,.wxnow .city{font-size:var(--t-sm);font-weight:600;color:var(--muted)}

/* 3 Der Faden als gemeinsame Form: Linien 2 px, Ringe, „jetzt“ gefüllt */
.lp-d::before{width:2px}
.tleg .ln{border-radius:var(--r-pill)}

/* Zeilen: gleiche Tippfläche überall */
.menu button,.listrow,.lt-opts button,.lp{min-height:44px}

/* 7 Bewegung: Fenster und Meldungen steigen gleich */
.toast{animation:rise var(--d2) var(--ease)}

/* =====================================================================
   §B FARBBLÖCKE (v32) · flach, mutig, klar
   Jeder Bereich hat eine kräftige Vollfarbe. Oben steht sie als großer
   Block mit Titel, Datum und Faden in Weiß. Darunter liegen ruhige
   Kacheln ohne Rand und ohne Schatten in einem festen Raster.
   Schrift: Bricolage Grotesque fett für Titel und Zahlen,
   Instrument Sans für alles Bedienbare.
   ===================================================================== */
@font-face{font-family:"Kal Display";src:url("fonts/BricolageGrotesque-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Kal Display";src:url("fonts/BricolageGrotesque-Medium.woff2") format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Kal Display";src:url("fonts/BricolageGrotesque-SemiBold.woff2") format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Kal Display";src:url("fonts/BricolageGrotesque-Bold.woff2") format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Kal Display";src:url("fonts/BricolageGrotesque-ExtraBold.woff2") format("woff2");font-weight:800;font-display:swap}
@font-face{font-family:"Kal Sans";src:url("fonts/InstrumentSans-Variable.woff2") format("woff2");font-weight:400 700;font-stretch:75% 100%;font-display:swap}

:root{
  --f-display:"Kal Display", "Bricolage Grotesque", "Kal Sans", system-ui, sans-serif;
  --f-body:"Kal Sans", "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:var(--f-body);
  --paper:#F3F3F0; --tile:#FFFFFF; --tile-2:#E9E9E5; --ink:#111113; --muted:#55555C; --faint:#8C8C93;
  --line:#E4E4DF; --sunk:#E9E9E5; --surface:#FFFFFF; --raised:#FFFFFF;
  --zone:#2547F4; --on-zone:#FFFFFF;
  --zone-ink:color-mix(in oklab, var(--zone) 82%, var(--ink));
  --zone-soft:color-mix(in oklab, var(--zone) 13%, var(--tile));
  --r-tile:20px; --r:14px; --r-sm:10px; --r-lg:20px; --r-ev:12px;
  --accent-soft:color-mix(in oklab, var(--zone) 13%, var(--tile));
  --glass-strong:var(--tile); --glass-line:transparent; --shadow:none;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0B0B0C; --tile:#18181B; --tile-2:#232327; --ink:#F4F4F1; --muted:#A6A6AE; --faint:#6E6E76;
  --line:#26262A; --sunk:#232327; --surface:#18181B; --raised:#232327;
  --zone-ink:color-mix(in oklab, var(--zone) 62%, white);
  --zone-soft:color-mix(in oklab, var(--zone) 22%, var(--tile));
  --accent-soft:color-mix(in oklab, var(--zone) 22%, var(--tile));
  --glass-strong:var(--tile); color-scheme:dark; } }
:root[data-theme="dark"]{
  --paper:#0B0B0C; --tile:#18181B; --tile-2:#232327; --ink:#F4F4F1; --muted:#A6A6AE; --faint:#6E6E76;
  --line:#26262A; --sunk:#232327; --surface:#18181B; --raised:#232327;
  --zone-ink:color-mix(in oklab, var(--zone) 62%, white);
  --zone-soft:color-mix(in oklab, var(--zone) 22%, var(--tile));
  --accent-soft:color-mix(in oklab, var(--zone) 22%, var(--tile));
  --glass-strong:var(--tile); color-scheme:dark; }
/* Bereichsfarben */
:root[data-zone="kalender"],:root[data-zone="suche"]{--zone:#2547F4;--on-zone:#fff}
:root[data-zone="aufgaben"]{--zone:#D7381C;--on-zone:#fff}
:root[data-zone="stundenplan"]{--zone:#0E8550;--on-zone:#fff}
:root[data-zone="schlaf"]{--zone:#6B4BEF;--on-zone:#fff}
:root[data-zone="wetter"]{--zone:#FFC21A;--on-zone:#111113}
:root[data-zone="links"]{--zone:#CC2E77;--on-zone:#fff}
:root[data-zone="einstellungen"]{--zone:#2B2B30;--on-zone:#fff}

html,body{background:var(--paper)}
body{font-family:var(--f-body)}
.col::before,.col::after{display:none}

/* --- Der Kopf ist ein Farbblock --- */
.top,:root[data-daypart="nacht"] .top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--zone);color:var(--on-zone);-webkit-backdrop-filter:none;backdrop-filter:none;border:0;margin:12px 12px 0;border-radius:28px;padding:22px 28px 18px;transition:background-color var(--d3) var(--ease)}
.top.scrolled{border:0}
.top h1{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,4vw,52px);letter-spacing:-.04em;line-height:.95;color:var(--on-zone)}
.top h1 i{font-style:normal;font-weight:800;color:inherit;opacity:.55}
.top .sub{color:var(--on-zone);opacity:.75;font-weight:500}
.top .iconbtn{color:var(--on-zone)}
.top .iconbtn:hover{background:color-mix(in oklab, var(--on-zone) 16%, transparent);color:var(--on-zone)}
.top .seg{background:color-mix(in oklab, var(--on-zone) 16%, transparent);border:0;padding:3px}
.top .seg button{color:var(--on-zone);opacity:.85}
.top .seg button[aria-pressed="true"]{background:var(--on-zone);color:var(--zone);opacity:1}
.top .pager .btn{background:color-mix(in oklab, var(--on-zone) 16%, transparent);color:var(--on-zone);border:0}
.top .topcmd{background:color-mix(in oklab, var(--on-zone) 16%, transparent);color:var(--on-zone)}
.top .topcmd kbd{background:color-mix(in oklab, var(--on-zone) 18%, transparent);color:var(--on-zone);border:0}
.top .search input{background:color-mix(in oklab, var(--on-zone) 16%, transparent);color:var(--on-zone);border:0}
.privbtn.on{background:var(--on-zone);color:var(--zone)}
/* Faden im Block: weiß */
.top .faden{color:var(--on-zone)}
.faden .fa,.faden .fz{color:var(--on-zone);opacity:.7}
.faden .flab{color:var(--on-zone);font-weight:600}
.faden .flab i{color:var(--on-zone);opacity:.75}
.ftrack{height:14px}
.ftrack::before{height:4px;margin-top:-2px;border-radius:2px;background:color-mix(in oklab, var(--on-zone) 22%, transparent)}
.fdone{height:4px;margin-top:-2px;border-radius:2px;background:var(--on-zone)}
.fseg{height:10px;margin-top:-5px;border-radius:5px;background:color-mix(in oklab, var(--on-zone) 55%, transparent)!important;opacity:1}
.fseg.past{opacity:.45}
.fnow{width:14px;height:14px;margin:-7px 0 0 -7px;background:var(--zone);border:3px solid var(--on-zone);box-sizing:border-box}
.fnow::after{border-color:var(--on-zone)}
.faden:hover .ftrack::before{background:color-mix(in oklab, var(--on-zone) 32%, transparent)}
main{padding-top:20px}
@media (max-width:860px){
  .top,:root[data-daypart="nacht"] .top{margin:8px 8px 0;border-radius:24px;padding:14px 16px 12px}
  .top h1{font-size:28px}
  .top .pager .btn.here{display:none}
  .top .pager{gap:2px}
  .top .seg{flex:1 1 calc(100% - 56px);display:flex}
  .top .seg button{flex:1}
}

/* --- Kacheln: die Grundfläche --- */
.panel,.w-right,.hero,.next,.notices,.scroller,.mo:has(> .mo-d),.yr,.cards,.sx-hero,.sx-stats,.sx-tips,.settings.acc details.sx,.lpath,.st-deps,.deps,.trip,.leave,.tw,.sem,.citychips ~ .note{
  background:var(--tile);border:0;border-radius:var(--r-tile);-webkit-backdrop-filter:none;backdrop-filter:none}
.panel{padding:20px 22px}
.w-right{padding:20px;max-height:calc(100vh - 160px)}
.w-right .panel{background:none;padding:0}
.notices{padding:4px 20px;margin-bottom:var(--s3)}
.notices > .notice:first-child{border-top:0}.notices > .notice:last-child{border-bottom:0}
.next{padding:20px 22px;border:0;background:var(--zone-soft)}
.hero{padding:24px 26px}
.scroller{padding:6px}
.mo:has(> .mo-d){gap:4px;padding:8px;background:var(--tile)}
.mo-h{background:none;font-weight:600}
.mo-d{background:var(--paper);border-radius:12px}
.mo-d:hover{background:var(--tile-2)}
.mo-d.today{background:var(--zone);color:var(--on-zone)}
.mo-d.today .n .d{background:none;color:var(--on-zone)}
.yr{padding:18px}
.deps,.st-deps,.trip,.leave{padding:14px 18px}
.lpath{padding:14px 16px 8px}
.tw{padding:6px 16px}
.banner{border-bottom:0;padding:0 4px 8px}
.row-item,.listrow{border-color:var(--line)}
.panel > .row-item:first-child,.panel > .listrow:first-child{border-top:0}

/* --- Schrift: fett und groß --- */
.lead{font-family:var(--f-display);font-weight:500;font-size:clamp(20px,2vw,26px);letter-spacing:-.025em;line-height:1.25;color:var(--muted)}
.lead b{font-weight:800;color:var(--ink)}
.lead .ln{text-decoration-color:var(--zone)}
.hero .bignum{font-family:var(--f-display);font-weight:800;font-size:clamp(96px,11vw,140px);letter-spacing:-.06em;line-height:.85;color:var(--zone)}
.hero .daytxt .wd{font-family:var(--f-display);font-weight:800;letter-spacing:-.035em}
.hero .eyebrow{color:var(--zone-ink)}
.sheet h2,.panel-h h2,.h2,.sx-h h2,.group-h h3,.toolbar .h2{font-family:var(--f-display);font-weight:800;letter-spacing:-.03em;color:var(--ink)}
.group-h h3{font-size:var(--t-lead)}
.wk-h .dn,.mo-d .n .d,.days .dn,.whero-t b,.stat .big,.detail .big,.wxhero .t,.wxnow .t,.sx-score b,.lt-big,.next .t,.sx-stat b{font-family:var(--f-display);font-weight:800;letter-spacing:-.035em}
.next .cd{font-family:var(--f-display);font-weight:800;letter-spacing:-.04em;color:var(--zone-ink)}
.next .cd small,.next small{font-family:var(--f-body);letter-spacing:0;font-weight:500}
.brand b{font-family:var(--f-display);font-style:normal;font-weight:800;letter-spacing:-.045em;font-size:26px}
.brand b::after{content:"";display:inline-block;width:8px;height:8px;margin-left:3px;border-radius:2px;background:var(--zone);transition:background-color var(--d3)}

/* --- Navigation: flach, aktive Kachel in Bereichsfarbe --- */
.rail{background:none;border:0}
.nav button{border-radius:14px;padding:10px 12px;font-size:var(--t-md);white-space:nowrap}
.nav button:hover{background:var(--tile)}
.nav button[aria-current="page"]{background:var(--zone);color:var(--on-zone)}
.nav button[aria-current="page"] svg{color:var(--on-zone)}
.railwx{background:var(--tile);border:0;border-radius:var(--r-tile)}
@media (max-width:860px){
  .tabbar{background:var(--tile);-webkit-backdrop-filter:none;backdrop-filter:none;border-top:0;border-radius:22px 22px 0 0;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar button{color:var(--muted)}
  .tabbar button[aria-current="page"]{color:var(--ink)}
  .tabbar button[aria-current="page"] svg{background:var(--zone);color:var(--on-zone);border-radius:12px;padding:4px 16px}
  .panel,.hero,.notices,.next{border-radius:18px}
  .hero{padding:18px}
}

/* --- Knöpfe, Chips, Segmente --- */
.btn{border-radius:14px;border:0;background:var(--tile);font-weight:600;padding:10px 16px}
.btn:hover{background:var(--tile-2);border:0}
.btn.primary{background:var(--zone);color:var(--on-zone)}
.btn.primary:hover{filter:none;background:color-mix(in oklab, var(--zone) 88%, var(--ink))}
.btn.ghost{background:none}
.btn.ghost:hover{background:var(--tile)}
.btn.sm{padding:7px 12px;border-radius:12px}
.iconbtn{border-radius:12px}
.iconbtn:hover{background:var(--tile)}
.fab{width:60px;height:60px;border-radius:20px;background:var(--zone);color:var(--on-zone);box-shadow:none}
.chip{border-radius:12px;background:var(--tile);border:0;color:var(--ink);padding:7px 13px}
.chip[aria-pressed="true"]{background:var(--zone);color:var(--on-zone)}
.seg{border-radius:14px;background:var(--tile);border:0;padding:3px}
.seg button{border-radius:11px}
.seg button[aria-pressed="true"]{background:var(--zone);color:var(--on-zone)}
.tag{border-radius:8px;background:var(--tile-2);border:0}
.lnb{border-radius:8px}

/* --- Termine und Raster: Vollfarbe, Schrift weiß --- */
.ev{border-radius:var(--r-ev);background:var(--c);color:#fff;border:0;-webkit-backdrop-filter:none;backdrop-filter:none}
.ev .m,.ev small{color:rgb(255 255 255 / .82)}
.ev b::before{background:#fff}
.ev:hover{background:color-mix(in oklab, var(--c) 86%, black)}
.ev.solid{background:var(--c)}
.tt-block{border-radius:14px;background:var(--c)}
.days button{border-radius:16px;background:var(--tile);border:0}
.days button.sel{background:var(--zone);color:var(--on-zone)}
.days button.sel .wd,.days button.sel .tmp,.days button.sel .bed{color:inherit}
.wk-h.today .dn{background:var(--zone);color:var(--on-zone)}
.wk{background:var(--tile)}

/* --- Fenster und Meldungen: volle Kacheln --- */
.sheet .scrim{background:rgb(10 10 12 / .5);-webkit-backdrop-filter:none;backdrop-filter:none}
.sheet .card2{background:var(--tile);border:0;border-radius:28px;-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:none}
@media (max-width:860px){ .sheet .card2{border-radius:28px 28px 0 0}
  .sheet .card2::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:var(--line);margin:-8px auto 14px} }
.sheet h2{font-size:clamp(26px,3vw,32px)}
.toast,.toast.rem{background:var(--ink);color:var(--paper);border:0;border-radius:18px;-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:none}
.toast small{color:color-mix(in oklab, var(--paper) 75%, transparent)}
.toast > span:first-child{color:var(--zone)}
.toast .act .btn{color:var(--paper)!important}
.f input,.f select,.f textarea,.rfind-r input,.search input{background:var(--paper);border:0;border-radius:12px}
.sheet .f input,.sheet .f select,.sheet .f textarea,.sheet .rfind-r input{background:var(--tile-2)}
.f input:focus,.f select:focus,.f textarea:focus,.rfind-r input:focus{outline:2px solid var(--zone);outline-offset:0}
.settings.acc{border-top:0;display:flex;flex-direction:column;gap:8px;max-width:820px}
.settings.acc details.sx{display:block;width:100%;box-sizing:border-box;border-bottom:0;padding:0 18px}
.sx-ic{border-radius:10px;background:var(--zone);color:var(--on-zone)}
details.sx[open] > summary .sx-t b,details.sx > summary:hover .sx-t b{color:var(--ink)}
.tmap{border-radius:var(--r-tile)}
.st-hero{border-radius:var(--r-tile)}
.st-glass{background:var(--tile);-webkit-backdrop-filter:none;backdrop-filter:none;border:0}
.st-top .iconbtn,.st-top .sheet-back{background:var(--tile);-webkit-backdrop-filter:none;backdrop-filter:none;border:0}
.st-bg{display:none}
.st-deps{border:0}

/* --- Bewegung: Kacheln schieben sich herein --- */
main.enter > *{animation:tilein .38s cubic-bezier(.2,.8,.2,1) both}
@keyframes tilein{from{opacity:0;transform:translateY(14px)}}
@media (prefers-reduced-motion: reduce){ main.enter > *{animation:none} }
/* In Fenstern und Kacheln heben sich Knöpfe und Chips eine Stufe ab */
.sheet .btn:not(.primary):not(.ghost),.sheet .chip:not([aria-pressed="true"]),.panel .btn:not(.primary):not(.ghost),.panel .chip:not([aria-pressed="true"]),.w-right .btn:not(.primary):not(.ghost){background:var(--tile-2)}
/* --- Flüssige Übergänge (v32.1): Kopfblock wandert als eigene Ebene,
   Inhalt gleitet in Tab-Richtung, Tag/Woche/Monat/Jahr zoomen leicht --- */
:root[data-motion="on"] .top{view-transition-name:topblock}
::view-transition-group(*){animation-duration:.44s;animation-timing-function:cubic-bezier(.22,1,.36,1)}
::view-transition-old(root),::view-transition-new(root){animation-duration:.3s}
::view-transition-old(topblock),::view-transition-new(topblock){height:100%;animation-duration:.4s;animation-timing-function:cubic-bezier(.22,1,.36,1)}
::view-transition-old(main){animation:.2s cubic-bezier(.4,0,1,1) both vt-fade-out}
::view-transition-new(main){animation:.44s cubic-bezier(.22,1,.36,1) both vt-rise}
:root[data-dir="tab-next"]::view-transition-old(main){animation:.22s cubic-bezier(.4,0,1,1) both vt2-out-l}
:root[data-dir="tab-next"]::view-transition-new(main){animation:.48s cubic-bezier(.22,1,.36,1) .04s both vt2-in-r}
:root[data-dir="tab-prev"]::view-transition-old(main){animation:.22s cubic-bezier(.4,0,1,1) both vt2-out-r}
:root[data-dir="tab-prev"]::view-transition-new(main){animation:.48s cubic-bezier(.22,1,.36,1) .04s both vt2-in-l}
:root[data-dir="next"]::view-transition-old(main){animation:.24s cubic-bezier(.4,0,1,1) both vt2-out-l}
:root[data-dir="next"]::view-transition-new(main){animation:.44s cubic-bezier(.22,1,.36,1) both vt2-in-r}
:root[data-dir="prev"]::view-transition-old(main){animation:.24s cubic-bezier(.4,0,1,1) both vt2-out-r}
:root[data-dir="prev"]::view-transition-new(main){animation:.44s cubic-bezier(.22,1,.36,1) both vt2-in-l}
:root[data-dir="out"]::view-transition-old(main){animation:.22s cubic-bezier(.4,0,1,1) both vt2-zo-old}
:root[data-dir="out"]::view-transition-new(main){animation:.46s cubic-bezier(.22,1,.36,1) .03s both vt2-zo-new}
:root[data-dir="in"]::view-transition-old(main){animation:.22s cubic-bezier(.4,0,1,1) both vt2-zi-old}
:root[data-dir="in"]::view-transition-new(main){animation:.46s cubic-bezier(.22,1,.36,1) .03s both vt2-zi-new}
@keyframes vt2-out-l{to{opacity:0;transform:translateX(-28px)}}
@keyframes vt2-out-r{to{opacity:0;transform:translateX(28px)}}
@keyframes vt2-in-r{from{opacity:0;transform:translateX(36px)}}
@keyframes vt2-in-l{from{opacity:0;transform:translateX(-36px)}}
@keyframes vt2-zo-old{to{opacity:0;transform:scale(.985)}}
@keyframes vt2-zo-new{from{opacity:0;transform:scale(1.015)}}
@keyframes vt2-zi-old{to{opacity:0;transform:scale(1.015)}}
@keyframes vt2-zi-new{from{opacity:0;transform:scale(.985)}}
::view-transition-old(segpill),::view-transition-new(segpill),::view-transition-old(navpill),::view-transition-new(navpill),::view-transition-old(tabpill),::view-transition-new(tabpill){animation-duration:.4s}
@media (prefers-reduced-motion: reduce){ ::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important} }
/* §S2 Schlaf (v35) · Kacheln in Violett, flach */
.sl2{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}
.sl2 > *{grid-column:span 12;min-width:0;animation:tilein .42s cubic-bezier(.2,.8,.2,1) both}
.sl2 > :nth-child(2){animation-delay:.03s}.sl2 > :nth-child(3){animation-delay:.06s}.sl2 > :nth-child(4){animation-delay:.08s}.sl2 > :nth-child(5){animation-delay:.1s}.sl2 > :nth-child(6){animation-delay:.12s}.sl2 > :nth-child(n+7){animation-delay:.14s}
@media (prefers-reduced-motion: reduce){ .sl2 > *{animation:none} }
.sl2-tile{background:var(--tile);border-radius:var(--r-tile);padding:20px 22px}
.sl2-hero{grid-column:span 7}.sl2-night{grid-column:span 5}.sl2-kpi{grid-column:span 3}.sl2-half{grid-column:span 6}
.sl2-hero .sc{display:flex;align-items:flex-end;gap:14px}
.sl2-hero .sc > b{font-family:var(--f-display);font-weight:800;font-size:clamp(72px,9vw,104px);line-height:.82;letter-spacing:-.055em;color:var(--zone-ink);font-variant-numeric:tabular-nums}
.sl2-hero .sc span{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.02em;line-height:1.1;padding-bottom:4px}
.sl2-hero .sc span small{display:block;font-family:var(--f-body);font-weight:500;font-size:13px;letter-spacing:0;color:var(--muted)}
.sl2-hero p{font-family:var(--f-display);font-weight:500;font-size:20px;line-height:1.3;letter-spacing:-.015em;margin:16px 0 18px;text-wrap:pretty}
.sl2-hero p b{font-weight:800}
.sl2-parts{display:grid;gap:8px}
.sl2-parts div{display:grid;grid-template-columns:minmax(110px,150px) minmax(0,1fr) 28px;gap:12px;align-items:center;font-size:14px}
.sl2-parts span{color:var(--muted)}
.sl2-parts i{height:8px;border-radius:4px;background:var(--tile-2);overflow:hidden}
.sl2-parts em{display:block;height:100%;background:var(--zone);border-radius:4px;transform-origin:left;animation:sl2grow .8s cubic-bezier(.2,.8,.2,1) .15s both}
@keyframes sl2grow{from{transform:scaleX(0)}}
.sl2-parts b{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.sl2-night{background:var(--zone-soft);display:flex;flex-direction:column;gap:8px}
.sl2-night .lbl{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--zone-ink)}
.sl2-night .lbl svg{width:18px;height:18px}
.sl2-night .tt{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:clamp(44px,5.4vw,60px);letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums;margin:6px 0 2px}
.sl2-night .tt i{display:grid;color:var(--zone-ink)}.sl2-night .tt i svg{width:26px;height:26px}
.sl2-night small{color:var(--muted);font-size:14px;line-height:1.45}
.sl2-night .act{margin-top:auto;display:flex;gap:8px;flex-wrap:wrap;padding-top:12px}
.sl2-night .btn{background:var(--tile)}.sl2-night .btn.primary{background:var(--zone);color:var(--on-zone)}.sl2-night .btn.ghost{background:none}
.sl2-kpi{background:var(--tile);border-radius:var(--r-tile);padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.sl2-kpi > span{font-size:13px;color:var(--muted);font-weight:600}
.sl2-kpi > b{font-family:var(--f-display);font-weight:800;font-size:30px;letter-spacing:-.035em;line-height:1.05;font-variant-numeric:tabular-nums}
.sl2-kpi .m{display:block;height:6px;border-radius:3px;background:var(--tile-2);overflow:hidden;margin:6px 0 2px}
.sl2-kpi .m em{display:block;height:100%;background:var(--zone);border-radius:3px;transform-origin:left;animation:sl2grow .8s cubic-bezier(.2,.8,.2,1) .2s both}
.sl2-kpi small{font-size:13px;color:var(--muted);line-height:1.35}
.sl2 .bad{color:var(--danger)}.sl2 small.good{color:var(--ok)}
.sl2-h{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;margin:0 0 12px}
.sl2-h h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:-.03em;color:var(--ink)}
.sl2-h small{color:var(--muted);font-size:13px}
.sl2-pat{display:grid;grid-template-columns:38px minmax(0,1fr) 200px;gap:14px;align-items:start;padding:14px 0;border-top:1px solid var(--line)}
.sl2-pat .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--tile-2);color:var(--ink)}
.sl2-pat.warn .ic{background:var(--zone);color:var(--on-zone)}
.sl2-pat.good .ic{background:color-mix(in oklab, var(--ok) 16%, var(--tile));color:var(--ok)}
.sl2-pat .ic svg{width:19px;height:19px}
.sl2-pat .tx b{display:block;font-weight:700;font-size:16px;line-height:1.3}
.sl2-pat .tx small{display:block;color:var(--muted);font-size:14px;line-height:1.5;margin-top:3px;text-wrap:pretty}
.sl2-pat .pa{margin-top:10px}
.sl2-pat .vzw{padding-top:2px}
.vz{width:200px;height:auto;display:block;overflow:visible}
.vz text{font-size:8px;fill:var(--faint);font-family:var(--f-body);font-variant-numeric:tabular-nums}
.vz .ok,.vz .hi,.vz .in{fill:var(--zone)}
.vz .mu{fill:color-mix(in oklab, var(--zone) 28%, var(--tile-2))}
.vz .lo,.vz .off{fill:color-mix(in oklab, var(--danger) 75%, var(--tile))}
.vz .nd{stroke:var(--ink);stroke-width:1;stroke-dasharray:3 3;opacity:.45}
.vz .band{fill:var(--zone-soft)}
.vz .jl{stroke:var(--zone);stroke-width:3;stroke-linecap:round;opacity:.35}
.vz .wd{fill:var(--ink)}.vz .fr{fill:var(--zone)}
.sl2-more{border-top:1px solid var(--line)}
.sl2-more > summary{list-style:none;cursor:pointer;padding:14px 0 2px;font-weight:700;color:var(--zone-ink)}
.sl2-more > summary::-webkit-details-marker{display:none}
.sl2-more[open] > summary{padding-bottom:4px}
.sl2 .sl-chart .act{fill:var(--zone)}
.sl2 .sl-chart .lat{fill:color-mix(in oklab, var(--zone) 28%, var(--tile-2))}
.sl2 .sl-chart .plan,.sl2 .sl-chart .fut{stroke:color-mix(in oklab, var(--zone) 60%, transparent)}
.sl2 .sl-chart .we{fill:color-mix(in oklab, var(--zone) 6%, transparent)}
.sl2 .sl-chart .bar{fill:var(--zone)}
.sl2 .sl-chart .bar.short{fill:color-mix(in oklab, var(--danger) 75%, var(--tile))}
.sl2 .sl-chart .shortt{fill:var(--danger)}
.sl2 .sx-legend i.a{background:var(--zone)}
.sl2-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;text-align:center}
.sl2-week .c{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.sl2-week .d{font-size:13px;font-weight:700;color:var(--muted)}.sl2-week .we .d{color:var(--zone-ink)}
.sl2-week .bar{width:100%;max-width:36px;height:96px;background:var(--tile-2);border-radius:10px;display:flex;align-items:flex-end;overflow:hidden}
.sl2-week .bar i{display:block;width:100%;background:var(--zone);border-radius:10px;transform-origin:bottom;animation:sl2up .7s cubic-bezier(.2,.8,.2,1) .15s both}
.sl2-week .bar i.lo{background:color-mix(in oklab, var(--danger) 75%, var(--tile))}
@keyframes sl2up{from{transform:scaleY(0)}}
.sl2-week b{font-size:13px;font-variant-numeric:tabular-nums}
.sl2-week small{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.sl2-note{font-size:12px;color:var(--faint);margin:12px 0 0}
.sl2-chrono > b{display:block;font-family:var(--f-display);font-weight:800;font-size:28px;letter-spacing:-.035em;line-height:1.1}
.sl2-chrono > small{display:block;color:var(--muted);font-size:14px;margin:4px 0 18px}
.sl2-chrono .scale{position:relative;height:10px;border-radius:5px;background:var(--tile-2)}
.sl2-chrono .scale i{position:absolute;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:var(--zone);box-shadow:0 0 0 4px var(--tile)}
.sl2-chrono .lbls{display:flex;justify-content:space-between;font-size:12px;color:var(--faint);margin-top:10px}
.sl2-jl{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0 0;padding-top:14px;border-top:1px solid var(--line)}
.sl2-jl span{color:var(--muted);font-size:14px}.sl2-jl b{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.03em}
.sl2-log > button{display:grid;grid-template-columns:minmax(84px,auto) minmax(0,1fr) auto auto;gap:14px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:12px 4px;border-top:1px solid var(--line);color:var(--ink);font:inherit;cursor:pointer;border-radius:0}
.sl2-log > button:hover,.sl2-log details > button:hover{background:color-mix(in oklab, var(--ink) 3%, transparent)}
.sl2-log details > button{display:grid;grid-template-columns:minmax(84px,auto) minmax(0,1fr) auto auto;gap:14px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:12px 4px;border-top:1px solid var(--line);color:var(--ink);font:inherit;cursor:pointer}
.sl2-log .dt{font-weight:600}
.sl2-log .tm{font-variant-numeric:tabular-nums}.sl2-log .tm small{display:block;color:var(--muted);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sl2-log b{font-variant-numeric:tabular-nums}.sl2-log b.lo{color:var(--danger)}
.sl2-log .q{display:flex;gap:3px}.sl2-log .q i{width:7px;height:7px;border-radius:50%;background:var(--tile-2)}.sl2-log .q i.on{background:var(--zone)}

/* v43: Wachheit im Arbeitsblock: je wacher, desto kräftiger */

.lt-shift{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;font-weight:600;color:var(--zone-ink);margin-top:6px}.lt-shift svg{width:14px;height:14px}

/* ================= §B BAUKASTEN (v52) ================= */

/* 1 · Kapitel */

main .kap-sep.over,main .kap-sep.over > svg{color:var(--danger)}
/* 3 · Karte, Karten-Kopf, Zeile, Wert */

/* Umgewandelte Karten: Inhalt ohne doppelten Kopf */

/* Hinweise unter „Jetzt“ */

.fit-r .krow-ic svg{width:17px;height:17px}
.fit-r .krow-t{flex:1;min-width:0}.fit-r .krow-t b{display:block}.fit-r .krow-t small{display:block;font-size:13px;color:var(--muted);margin-top:2px}

<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js', {updateViaCache:'none'}).then(r => { r.update().catch(() => {}); document.addEventListener('visibilitychange', () => { if (!document.hidden) r.update().catch(() => {}); }); }).catch(() => {}));
  let reloaded = false;
  const hadCtl = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (reloaded || !hadCtl) return; reloaded = true; try { sessionStorage.setItem('kal-updated', '1'); } catch {} if (!document.querySelector('#sheet:not([hidden])')) location.reload(); });
}
window.addEventListener('load', () => { try { if (sessionStorage.getItem('kal-updated')) { sessionStorage.removeItem('kal-updated'); setTimeout(() => toast('App aktualisiert', 'Version ' + APP_VERSION), 1200); } } catch {} });
</script>
