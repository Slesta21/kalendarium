    ${s.sleep.on && (wake || bed) ? `<button class="pk-sleep" data-act="sleepInfo" data-date="${ymd(addDays(d,1))}">${wake ? `<span>${ic('sonne')}Auf <b>${hm(wake.wake)}</b></span>` : ''}${plan.firstDepart ? `<span>${ic('weg')}Los <b>${hm(plan.firstDepart)}</b></span>` : ''}${bed ? `<span>${ic('mond')}Bett <b>${hm(bed.bed)}</b></span>` : ''}</button>` : ''}
    ${plan.warnings.length ? `<div class="notices">${plan.warnings.map(x => `<div class="notice warn">${ic('weg')}<span>${esc(x)}</span></div>`).join('')}</div>` : ''}
    <section><div class="mm-h"><h3 class="side-h" style="margin:0">Ablauf</h3><span class="nv"><button data-act="newEvent" data-date="${ymd(d)}" aria-label="Termin an diesem Tag">${ic('plus')}</button><button data-act="openDay" data-date="${ymd(d)}" aria-label="Tag öffnen">${ic('weiter')}</button></span></div>
      <div class="pk-list">${rows.length ? rows.map(r => r.html).join('') : emptyArt('frei', 'Ein freier Tag.', 'Nichts geplant.')}</div></section>
    ${todos.length ? `<section><h3 class="side-h">${today ? 'Heute erledigen' : 'To-dos'}</h3>${todos.slice(0, 6).map(todoRow).join('')}</section>` : ''}
    ${chatPanel()}`;
}

/* ---------- Befehlsleiste ---------- */
function quickAdd(text){ const f = document.createElement('form'); f.innerHTML = '<input id="quickInput">'; f.querySelector('input').value = text; SAVE.quick(f); }
function cmdItems(q){
  q = String(q || '').trim(); const ql = q.toLowerCase(), out = [];
  const has = (...xs) => !ql || xs.some(x => String(x || '').toLowerCase().includes(ql));
  const add = (sec, label, sub, icon, run, color) => out.push({sec, label, sub, icon, run, color});
  let todoSug = null;
  if (q.length >= 3) {
    const p = parseQuick(q);
    if (p.title && (p.date || p.time || p.kind === 'deadline')) {
      const when = `${p.date ? dayLabel(p.date) : p.kind === 'deadline' ? 'in 7 Tagen' : 'heute'}${p.time ? ' · ' + p.time + (p.end ? '–' + p.end : '') : ''}`;
      add('Eintragen', `Prüfen: ${p.title}`, `${when} · Überschneidungen, Wege, Schlaf, Wetter`, 'sprechblase', () => { ui.view = 'kalender'; ui.search = ''; if (isWide()) { ui.mode = 'woche'; if (p.date) { ui.cursor = startOfDay(p.date); ui.peek = ymd(p.date); } } else { ui.mode = 'tag'; ui.cursor = startOfDay(new Date()); } runChat(q); });
      const mq = p.kind !== 'deadline' ? titleMemory(p.title) : null;
      add('Eintragen', `Eintragen: ${p.title}`, `${{deadline:'Frist', event:'Termin', todo:'To-do'}[p.kind === 'todo' && mq ? 'event' : p.kind]} · ${when}${mq ? ' · wie beim letzten Mal: ' + memSummary(mq) : ''}`, 'plus', () => quickAdd(q));
    } else if (p.title) todoSug = () => add('Eintragen', `Als To-do: ${p.title}`, 'Ohne Datum', 'plus', () => quickAdd(q));
  }
  if (ql.length >= 2) {
    const t0 = startOfDay(new Date()); let n = 0; const lim = () => n++ < 10;
    for (const d of state.deadlines) if (has(d.title, d.notes) && lim()) add('Fristen', d.title, `${d.done ? 'erledigt · ' : ''}${dayLabel(parseYMD(d.date))} ${d.time || '23:59'}`, catById(d.catId).symbol, () => DETAIL.deadline(d.id), catById(d.catId).color);
    for (const e of state.events) if (has(e.title, e.location, e.notes) && lim()) add('Termine', e.title, `${dayLabel(parseYMD(e.date))}${e.allDay ? '' : ' · ' + e.start}${e.repeat && e.repeat.freq !== 'none' ? ' · wiederholt' : ''}`, catById(e.catId).symbol, () => ACTIONS.detail({dataset:{kind:'event', id:e.id, date:e.date}}), catById(e.catId).color);
    for (const c of state.courses) if (has(c.title, c.short, c.room, c.lecturer) && lim()) add('Stundenplan', c.title, `${WD_SHORT[(+c.day||1)-1]} ${c.start}–${c.end}${c.room ? ' · ' + c.room : ''}`, catById(c.catId).symbol, () => { const x = addDays(startOfWeek(t0, 1), (+c.day||1) - 1); ACTIONS.detail({dataset:{kind:'course', id:c.id, date:ymd(x < t0 ? addDays(x, 7) : x)}}); }, catById(c.catId).color);
    for (const t of state.todos) if (has(t.text) && lim()) add('To-dos', t.text, t.done ? 'erledigt' : t.date ? dayLabel(parseYMD(t.date)) : 'offen', 'haken', () => { ui.view = 'aufgaben'; ui.search = ''; render(); });
    for (const l of state.links) if (has(l.title, l.url) && lim()) add('Links', l.title || l.url, l.url, 'extern', () => window.open(l.url, '_blank', 'noopener'));
  }
  const view = (id, mode) => () => { ui.view = id; ui.search = ''; if (mode) { ui.mode = mode; } if (mode === 'tag') ui.cursor = startOfDay(new Date()); render(); window.scrollTo({top:0}); };
  const acts = [
    ['Neu anlegen', 'Termin, Frist oder To-do', 'plus', () => ACTIONS.add()],
    ['Heute', 'Tagesansicht von heute', 'heute', view('kalender', 'tag')],
    ...MODES_CAL.map(([k,l]) => [`Kalender · ${l}`, 'Ansicht', k, view('kalender', k)]),
    ...NAV.filter(x => !x.sep && x.id !== 'kalender').map(x => [x.label, 'Bereich', x.id, view(x.id)]),
    ['Hell oder dunkel', 'Darstellung wechseln', 'mond', () => { const dark = document.documentElement.getAttribute('data-theme') === 'dark' || (!document.documentElement.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches); state.settings.theme = dark ? 'light' : 'dark'; applyTheme(); commit(); }],
    ...state.settings.weather.cities.map(c => [`Wetter für ${c.name}`, 'Stadt wechseln', 'wetter', () => { state.settings.weather.active = c.key; WX.watch(c.key); ui.view = 'wetter'; commit(); }]),
    ['Einrichtung', 'Name, Weg zur Uni, Schlafrhythmus', 'einstellungen', () => onboard(1)]
  ];
  let k = 0;
  for (const a of acts) if (has(a[0], a[1]) && (ql || k++ < 9)) add(ql ? 'Befehle' : 'Springen', ...a);
  if (todoSug) todoSug();
  if (q) add('Suche', `Alle Treffer für „${q}“`, 'Volle Suche öffnen', 'suche', () => { ui.search = q; ui._sf = true; render(); ui._sf = false; });
  return out;
}
function openCmd(){
  ui._cmdSel = 0;
  openSheet(`<div class="cmdk"><label class="cmd-in">${ic('suche')}<input id="cmdInput" autocomplete="off" spellcheck="false" enterkeyhint="go" placeholder="Suchen, springen oder eintragen" aria-label="Befehl"><kbd>Esc</kbd></label>
    <div class="cmd-list" id="cmdList" role="listbox"></div>
    <div class="cmd-foot"><span><kbd>↑</kbd> <kbd>↓</kbd> wählen</span><span><kbd>Enter</kbd> ausführen</span><span class="grow"></span><span>z. B. „Kino Freitag 20 Uhr“</span></div></div>`, {cmd:true});
  sheet.el.classList.add('cmdmode'); cmdUpdate();
  setTimeout(() => document.getElementById('cmdInput')?.focus(), 20);
}
function cmdUpdate(){
  const inp = document.getElementById('cmdInput'), list = document.getElementById('cmdList'); if (!list) return;
  ui._cmd = cmdItems(inp ? inp.value : '');
  if (ui._cmdSel >= ui._cmd.length) ui._cmdSel = 0;
  let sec = '';
  list.innerHTML = ui._cmd.length ? ui._cmd.map((it, i) => {
    const h = it.sec !== sec ? `<div class="cmd-sec">${esc(it.sec)}</div>` : ''; sec = it.sec;
    return `${h}<button class="cmd-it${i === ui._cmdSel ? ' on' : ''}" data-act="cmdRun" data-i="${i}" role="option" aria-selected="${i === ui._cmdSel}"${it.color ? ` style="--c:${it.color}"` : ''}><span class="ic">${sy(it.icon)}</span><span class="tx"><b>${esc(it.label)}</b><small>${esc(it.sub || '')}</small></span><span class="go">${ic('weiter','s')}</span></button>`;
  }).join('') : `<div class="cmd-empty">Nichts gefunden. Schreib einen Termin wie „Lernen Donnerstag 14–16“.</div>`;
}
function cmdMark(){
  document.querySelectorAll('#cmdList .cmd-it').forEach((b, i) => { const on = i === ui._cmdSel; b.classList.toggle('on', on); b.setAttribute('aria-selected', on); if (on) b.scrollIntoView({block:'nearest'}); });
}
function cmdRun(i){ const it = ui._cmd[i]; if (!it) return; closeSheet(); it.run(); }

/* ---------- Einrichtung beim ersten Start ---------- */
function onbHtml(step){
  const s = state.settings, up = state.places.find(x => x.id === 'uni') || {};
  const dots = [1,2,3].map(i => `<i class="${i <= step ? 'on' : ''}"></i>`).join('');
  let body = '';
  if (step === 1) body = `<div class="art">${ic('sonne')}</div><span class="eyebrow">Willkommen bei Kalendarium</span><h2>Wie heißt du?</h2>
      <p class="lead">Drei kurze Fragen, dann plant der Kalender Wege, Puffer und Schlaf für dich.</p>
      <label class="f"><span>Vorname</span><input name="name" class="title" value="${esc(s.name || '')}" autocomplete="given-name" placeholder="Dein Name"></label>`;
  if (step === 2) body = `<div class="art">${ic('weg')}</div><span class="eyebrow">Schritt 2 von 3</span><h2>Dein Weg zur Uni</h2>
      <p class="lead">Einmal eintragen. Danach rechnet der Kalender Losgehzeit, Puffer und Heimweg selbst aus, hin und zurück gleich.</p>
      <label class="f"><span>Ort</span><input name="uniName" value="${esc(up.name || 'TU Berlin')}" placeholder="z. B. TU Berlin"></label>
      <div class="frow"><label class="f"><span>Minuten von zuhause</span><input name="minutes" type="number" min="1" max="240" inputmode="numeric" value="${+up.minutes || 30}"></label>
      <label class="f"><span>Unterwegs mit</span><select name="mode">${Object.entries(MODES).map(([k,l]) => `<option value="${k}" ${(up.mode || 'oepnv') === k ? 'selected' : ''}>${l}</option>`).join('')}</select></label></div>`;
  if (step === 3) body = `<div class="art">${ic('mond')}</div><span class="eyebrow">Schritt 3 von 3</span><h2>Dein Schlafrhythmus</h2>
      <p class="lead">Daraus berechnet der Kalender jeden Abend, wann du ins Bett solltest, passend zum nächsten Morgen.</p>
      <div class="frow"><label class="f"><span>Aufstehen unter der Woche</span><input name="wakeWeek" type="time" value="${esc(s.sleep.wakeWeek)}"></label>
      <label class="f"><span>Aufstehen am Wochenende</span><input name="wakeWeekend" type="time" value="${esc(s.sleep.wakeWeekend)}"></label></div>
      <label class="f"><span>Gewünschter Schlaf (Stunden)</span><input name="hours" type="number" min="5" max="11" step="0.5" value="${+s.sleep.hours || 8}"></label>
      ${hasExamples() ? `<label class="inline-check" style="margin-top:6px"><input type="checkbox" name="keepEx"> Beispieleinträge behalten</label>` : ''}`;
  return `<form class="onb" data-form="onb" data-step="${step}">
    <div class="onb-top"><div class="onb-dots" aria-label="Schritt ${step} von 3">${dots}</div><button class="btn ghost sm" type="button" data-act="onbSkip">Überspringen</button></div>
    ${body}
    <div class="sheet-foot">${step > 1 ? `<button class="btn ghost" type="button" data-act="onbBack" data-step="${step}">Zurück</button>` : ''}<div class="r"><button class="btn primary" type="submit">${step === 3 ? 'Fertig' : 'Weiter'}</button></div></div></form>`;
}
function onboard(step){ openSheet(onbHtml(step), {onb:true}); sheet.el.classList.add('onbmode'); }
function maybeOnboard(){
  if (!state || ui._onbShown || state.settings.onboarded || !Store.fromExample || !sheet.el || !sheet.el.hidden) return;
  ui._onbShown = true; onboard(1);
}

function bindEvents(){
  document.addEventListener('click', ev => {
    Reminders.unlock();
    const sb = ev.target.closest('button[type=submit]'), sf = sb && sb.closest('form[data-form]');
    if (sf) { ev.preventDefault(); submitForm(sf); return; }
    const el = ev.target.closest('[data-act]'); if (!el || el.tagName === 'A') return;
    const fn = ACTIONS[el.dataset.act]; if (!fn) return;
    if (el.type === 'checkbox') { fn(el, ev); return; }
    ev.preventDefault(); fn(el, ev);
  });
  document.addEventListener('submit', ev => { const f = ev.target.closest('form[data-form]'); if (!f) return; ev.preventDefault(); submitForm(f); });
  document.addEventListener('input', ev => {
    const t = ev.target;
    if (t.id === 'cmdInput') { ui._cmdSel = 0; cmdUpdate(); return; }
    if (t.form && t.form.dataset.form === 'event') {
      if (t.name === 'title') memUpdate(t.form);
      if (['date','start','end','allDay','placeId','catId'].includes(t.name)) ovlSchedule(t.form);
    }
    if (t.id === 'searchInput') { ui.search = t.value; ui._sf = true; render(); ui._sf = false; return; }
    if (t.id === 'quickInput') {
      const p = parseQuick(t.value), prev = document.getElementById('quickPrev');
      if (!t.value.trim()) { prev.innerHTML = '<span>Ohne Uhrzeit wird es ein To-do. <b>!</b> Frist · <b>#</b> Kategorie · <b>@</b> Ort</span>'; return; }
      const d = p.date || (p.kind === 'deadline' ? addDays(new Date(),7) : p.kind === 'event' ? new Date() : null);
      prev.innerHTML = `<span><b>${{deadline:'Frist', event:'Termin', todo:'To-do'}[p.kind]}</b></span><span>${esc(p.title||'…')}</span>${d?`<span class="num">${dayLabel(d)}${p.time?' · '+p.time+(p.end?'–'+p.end:''):(p.kind==='deadline'?' · 23:59':'')}</span>`:''}${p.cat?`<span>${esc(p.cat.name)}</span>`:''}${p.place?`<span>${esc(p.place.name)}</span>`:''}${p.prio?`<span>Priorität ${p.prio}</span>`:''}`;
      { const mq = p.kind !== 'deadline' && titleMemory(p.title); if (mq) prev.insertAdjacentHTML('beforeend', `<span class="mem-hint">wie beim letzten Mal: ${esc(memSummary(mq))}</span>`); }
    }
    if (t.name === 'allDay') t.closest('form').querySelectorAll('[data-time]').forEach(r => r.hidden = t.checked);
    if (t.matches && t.matches('[data-tq]')) { clearTimeout(_twST); _twST = setTimeout(() => twSearch(t), 350); return; }
    if (t.form && t.form.querySelector('[data-trip]') && ['date','start','day','catId','allDay'].includes(t.name)) twConnSchedule(t.form);
    if ((t.name === 'mode' || t.name === 'np_mode') && t.form) { const sc = t.closest('[data-newplace]') || t.form, r = sc.querySelector('[data-route]'), m = sc.querySelector('[data-onlymin]'); if (r) r.hidden = t.value !== 'oepnv'; if (m) m.hidden = t.value === 'oepnv'; }
    if (t.dataset && t.dataset.k === 'line') { const row = t.closest('[data-rleg]'); if (row) row.querySelectorAll('[data-k="from"],[data-k="to"],[data-k="dir"]').forEach(x => x.value = ''); }
    if ((t.name === 'placeId' || t.name === 'catId') && t.form) { const host = t.form.querySelector('[data-rhost]'); if (host && host.dataset.pid) { host.innerHTML = ''; delete host.dataset.pid; } }
    if (t.form && t.form.querySelector('[data-leave]') && (['date','start','end','allDay','placeId','catId','day','np_min','np_mode','np_name','r_walkTo','r_walkFrom'].includes(t.name) || t.closest('[data-route]'))) leaveSchedule(t.form);
    if (t.name === 'placeId') { const b = t.closest('form').querySelector('[data-newplace]'); if (b) { b.hidden = t.value !== '__new'; if (!b.hidden) b.querySelector('[name=np_name]').focus(); } }
    if (t.name === 'colorCustom') t.closest('form').querySelectorAll('[name=color]').forEach(r => r.checked = false);
  });
  document.addEventListener('change', async ev => {
    const t = ev.target;
    if (t.dataset && t.dataset.set) {
      let v = t.type === 'number' ? parseFloat(t.value) : t.value;
      if (t.type === 'number' && isNaN(v)) return;
      if (t.type === 'text') v = v.trim();
      setPath(t.dataset.set, v);
      if (t.dataset.set === 'accent') applyTheme();
      commit(); return;
    }
    if (t.id === 'occNote' && t.dataset.key) { const v = t.value.trim(); if (v === (state.notes[t.dataset.key] || '')) return; if (v) state.notes[t.dataset.key] = v; else delete state.notes[t.dataset.key]; Store.schedule(); toast('Notiz gespeichert', ''); return; }
    if (t.id === 'icsFile' && t.files[0]) { const r = importICS(await t.files[0].text()); closeSheet(); toast('Import abgeschlossen', `${r.added} neu, ${r.updated} aktualisiert`); commit(); }
    if (t.id === 'backupFile' && t.files[0]) { try { state = migrate(JSON.parse(await t.files[0].text())); applyTheme(); toast('Sicherung geladen', ''); commit(); } catch { toast('Datei nicht lesbar', 'Wähle eine Sicherung aus dieser App.'); } }
  });
  document.addEventListener('keydown', ev => {
    if ((ev.ctrlKey || ev.metaKey) && !ev.altKey && ev.key.toLowerCase() === 'k') { ev.preventDefault(); if (sheet.ctx && sheet.ctx.cmd) closeSheet(); else { closeSheet(); openCmd(); } return; }
    if (ev.target.id === 'cmdInput') {
      if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') { ev.preventDefault(); const n = ui._cmd.length; if (n) { ui._cmdSel = (ui._cmdSel + (ev.key === 'ArrowDown' ? 1 : -1) + n) % n; cmdMark(); } return; }
      if (ev.key === 'Enter') { ev.preventDefault(); cmdRun(ui._cmdSel); return; }
    }
    if (ev.key === 'Escape' && !sheet.el.hidden) { closeSheet(); return; }
    if (ev.key === 'Escape' && ui.search && ev.target.id === 'searchInput') { ui.search = ''; ev.target.blur(); render(); return; }
    if ((ev.ctrlKey || ev.metaKey) && !ev.shiftKey && ev.key.toLowerCase() === 'z' && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || '') && ui.undo) { ev.preventDefault(); ACTIONS.undo(); return; }
    if (ev.key === 'Enter' && ev.target.tagName === 'INPUT' && !['checkbox','radio','button','submit','color','file'].includes(ev.target.type)) {
      const f = ev.target.closest('form[data-form]'); if (f) { ev.preventDefault(); submitForm(f); return; }
    }
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || '');
    if (typing || ev.metaKey || ev.ctrlKey || ev.altKey || !sheet.el.hidden) return;
    const k = ev.key.toLowerCase();
    if (k === 'n') { ev.preventDefault(); ACTIONS.add(); }
    else if (k === 't') { ui.view = 'kalender'; ui.mode = 'tag'; ui.cursor = startOfDay(new Date()); render(); }
    else if (MODE_KEYS[k]) { ui.view = 'kalender'; ui.search = ''; ui.mode = MODE_KEYS[k]; render(); }
    else if (ev.key === '?') { ev.preventDefault(); showKeys(); }
    else if (k === '/') { ev.preventDefault(); if (isNarrow()) document.getElementById('searchInput')?.focus(); else openCmd(); }
    else if (k >= '1' && k <= '9') { ui.view = NAV_IDS[+k-1] || ui.view; render(); }
    else if (k === 'arrowleft' && ui.view === 'kalender') ACTIONS.prev();
    else if (k === 'arrowright' && ui.view === 'kalender') ACTIONS.next();
  });
  window.addEventListener('scroll', () => document.getElementById('top').classList.toggle('scrolled', window.scrollY > 4), {passive:true});
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); window.__installEvt = e; });
function init(){
  sheet.el = document.getElementById('sheet'); sheet.card = document.getElementById('sheetCard');
  document.getElementById('fab').innerHTML = ic('plus');
  const local = Store.loadLocal();
  if (local) state = local; else { state = migrate(exampleState()); Store.fromExample = true; }
  try { const lv = JSON.parse(localStorage.getItem('kal-ui') || 'null'); if (lv && Date.now() - lv.t < 2*3600000 && NAV_IDS.includes(lv.view)) { ui.view = lv.view; if (MODE_ORDER[lv.mode] != null) ui.mode = lv.mode; } } catch {}
  const hs = /^(import|x)=/.test(location.hash.slice(1)) ? '' : location.hash.slice(1);
  if (LEGACY[hs]) { ui.view = 'kalender'; ui.mode = LEGACY[hs]; } else if (NAV_IDS.includes(hs)) ui.view = hs;
  WX.loadCache();
  applyTheme(); bindEvents(); bindDrag(); bindSwipe(); setSync(); render();
  Reminders.load(); Reminders.last = Date.now();
  setInterval(() => Reminders.check(), 20000);
  if (STANDALONE) { Loc.sync(); document.addEventListener('visibilitychange', () => Loc.sync()); }
  if (STANDALONE) { setTimeout(() => Transit.refresh(), 2500); setInterval(() => { if (!document.hidden) Transit.refresh(); }, 60000); document.addEventListener('visibilitychange', () => { if (!document.hidden) Transit.refresh(); }); }
  if (STANDALONE) { setTimeout(() => Push.sync(), 4000); setInterval(() => { if (!document.hidden) Push.sync(); }, 20*60000); document.addEventListener('visibilitychange', () => { if (!document.hidden) Push.queue(); }); }
  let lastMin = new Date().getMinutes(), lastDay = ymd(new Date());
  setInterval(() => {
    const n = new Date();
    if (ymd(n) !== lastDay) { lastDay = ymd(n); invalidate(); }
    applyDaypart();
    if (n.getMinutes() !== lastMin && sheet.el.hidden && !ui.search && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || '')) {
      lastMin = n.getMinutes(); if (ui.view === 'kalender' && ['tag','woche'].includes(ui.mode)) { const y = window.scrollY; render(); window.scrollTo(0, y); } else renderTop();
    }
  }, 15000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { Reminders.check(); invalidate(); renderSoft(); } });
  if (STANDALONE && /^#(import|x)=/.test(location.hash)) { ui._onbShown = true; const code = location.hash.replace(/^#(import|x)=/, ''); try { history.replaceState(null, '', location.pathname + location.search); } catch {} setTimeout(() => importFromCode(code), 300); }
  Store.connect();
  WX.start();
}
init();
</script>

<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js', {updateViaCache:'none'}).then(r => { r.update().catch(() => {}); document.addEventListener('visibilitychange', () => { if (!document.hidden) r.update().catch(() => {}); }); }).catch(() => {}));
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (reloaded) return; reloaded = true; try { sessionStorage.setItem('kal-updated', '1'); } catch {} if (!document.querySelector('#sheet:not([hidden])')) location.reload(); });
}
window.addEventListener('load', () => { try { if (sessionStorage.getItem('kal-updated')) { sessionStorage.removeItem('kal-updated'); setTimeout(() => toast('App aktualisiert', 'Version ' + APP_VERSION), 1200); } } catch {} });
