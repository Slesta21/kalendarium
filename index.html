<!--
=====================================================================
 KALENDARIUM 20  ·  persönlicher Kalender für alles
=====================================================================
 ARCHITEKTUR (für spätere Erweiterungen). Suche nach "§" für Sprungmarken.

  §1  CSS-TOKENS        Farben, Schriften (:root + Dark-Mode)
  §2  CSS-KOMPONENTEN   Layout, Navigation, Ansichten, Sheets
  §3  MARKUP            App-Gerüst
  §4  SYMBOLE           SYM (Kategorien), UI (Bedienung), WXP (Wetter)
  §5  DATUM-UTILS       ymd(), at(), addDays(), isoWeek(), fmt*()
  §6  DATENMODELL       defaultState(), exampleState(), migrate()
  §7  SPEICHER          Store: Konto-Datenbank (db) + localStorage
  §8  FEIERTAGE         holidaysFor(year) – berechnet, offline
  §9  WETTER            WX: AccuWeather über mcp, Cache, wxAt(date)
  §10 TERMINE           occurrences(from,to): Termine, Kurse, Fristen,
                        Geburtstage, Feiertage
  §11 WEGE              planDay(date): Losgehzeit, Puffer, Anschlüsse
  §12 SCHLAF            sleepPlan(): Schlafenszeit je Nacht, geglättet
  §13 ERINNERUNGEN      Reminders: Ton, Vibration, Hinweis
  §14 ICS               Export / Import
  §15 SCHNELLERFASSUNG  parseQuick()
  §16 ANSICHTEN         VIEWS.kalender (ein Tab, ui.mode = tag|woche|
                        monat|jahr), aufgaben, stundenplan, wetter,
                        links, einstellungen, suche · dayDashboard(d)
  §16c PLANER           workPlan(): Arbeits- und Lernblöcke aus Fristen,
                        Focus (Pomodoro), Gewohnheiten, Wochenrückblick
  §16b PRÜF-CHAT        lokal, ohne Claude: Termine prüfen, Fragen wie
                        "Wann muss ich morgen los?" beantworten
  §17 DETAILS           DETAIL.* große Leseansicht beim Antippen
  §18 FORMULARE         EDITORS.* und SAVE.*
  §19 AKTIONEN          ACTIONS{} – alle Klicks über data-act
  §20 START             init(), Verschieben, Tastenkürzel

 Datenobjekt (state), jeder Abschnitt wird einzeln gespeichert:
  settings   {name, accent, theme, weekStart, dayStart, dayEnd, sound,
              vibrate, showWeekend, hideEmptyWeekend, holidayRegion,
              observances, reminders{event,deadline,course},
              courseReminders, weather{cities[{key,name}], active},
              travel{bufferPct,minBuffer,rainExtra,arriveEarly,stayGap,
              remind}, sleep{on,hours,latency,routine,wakeWeek,
              wakeWeekend,flex,shift,remind}}
  categories [{id,name,color,symbol}]
  events     [{id,title,catId,placeId,date,allDay,start,end,bufferBefore,
              bufferAfter,location,notes,link,repeat{freq,interval,until},
              skip[],reminders[]|null,uid?,ex?}]
  courses    [{id,title,short,type,day,start,end,weeks,room,lecturer,
              catId,placeId,link,notes,skip[],ex?}]
  deadlines  [{id,title,catId,courseId,date,time,priority,done,
              subtasks[],reminders[]|null,link,notes,ex?}]
  todos      [{id,text,date,done,catId,ex?}]
  birthdays  [{id,name,date:"MM-DD",year,remind,ex?}]
  places     [{id,name,minutes,mode,home}]
  templates  [{id,name,dur,bb,ba,catId,placeId}]
  links      [{id,label,url,group,symbol}]
  semester   {name,start,end,breaks[],examStart,examEnd}
  habits     [{id,name,symbol,color,days[1-7],log{ymd:true}}]
  notes      {occurrenceKey: text}   Notizen zu einzelnen Terminen
  deadlines  + effort (h), exam (Lernplan), focusMin (erledigte Fokuszeit)
=====================================================================
-->

<style>
/* ================================================================
   §1 CSS-TOKENS
   Layout: Porzellanflächen, Ultramarin als Akzent, Gold nur für
   Feiertage und Geburtstage, Lavendel für Schlaf.
   ================================================================ */
:root{
  --accent:#3B4CCA;
  --paper:#EEF0F4;
  --surface:#FBFBFD;
  --raised:#FFFFFF;
  --sunk:#E3E6EE;
  --ink:#13162B;
  --muted:#545A73;
  --faint:#8A8FA6;
  --line:#D7DBE5;
  --gold:#9A6F1E;
  --sleep:#6655B8;
  --danger:#B02A3E;
  --warn:#946210;
  --ok:#25744F;
  --accent-ink:var(--accent);
  --accent-soft:color-mix(in oklab, var(--accent) 11%, var(--surface));
  --gold-soft:color-mix(in oklab, var(--gold) 13%, var(--surface));
  --sleep-soft:color-mix(in oklab, var(--sleep) 12%, var(--surface));
  --shadow:0 1px 2px rgba(19,22,43,.05), 0 10px 30px rgba(19,22,43,.07);
  --f-display:"Newsreader", "Iowan Old Style", Georgia, serif;
  --f-body:"Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:14px; --r-sm:8px; --rail:244px; --hour:64px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0B0D17; --surface:#131627; --raised:#191D31; --sunk:#1D2136; --ink:#E9EAF3; --muted:#A4A8C0;
    --faint:#6D7290; --line:#262A42; --gold:#D8B060; --sleep:#A99BF0; --danger:#EE7A8A; --warn:#DDB054; --ok:#6CC59A;
    --accent-ink:color-mix(in oklab, var(--accent) 55%, white);
    --accent-soft:color-mix(in oklab, var(--accent) 26%, var(--surface));
    --gold-soft:color-mix(in oklab, var(--gold) 16%, var(--surface));
    --sleep-soft:color-mix(in oklab, var(--sleep) 16%, var(--surface));
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 30px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0B0D17; --surface:#131627; --raised:#191D31; --sunk:#1D2136; --ink:#E9EAF3; --muted:#A4A8C0;
  --faint:#6D7290; --line:#262A42; --gold:#D8B060; --sleep:#A99BF0; --danger:#EE7A8A; --warn:#DDB054; --ok:#6CC59A;
  --accent-ink:color-mix(in oklab, var(--accent) 55%, white);
  --accent-soft:color-mix(in oklab, var(--accent) 26%, var(--surface));
  --gold-soft:color-mix(in oklab, var(--gold) 16%, var(--surface));
  --sleep-soft:color-mix(in oklab, var(--sleep) 16%, var(--surface));
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 30px rgba(0,0,0,.3);
  color-scheme:dark;
}

/* ================================================================
   §2 CSS-KOMPONENTEN
   ================================================================ */
*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px;border-radius:6px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.num{font-size:.88em}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.eyebrow{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
svg.s{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
svg.w{width:22px;height:22px;flex:none;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;stroke:var(--ink)}
svg.w .sun{stroke:var(--gold)} svg.w .rain{stroke:var(--accent-ink)} svg.w .bolt{stroke:var(--gold)} svg.w .moon{stroke:var(--sleep)}
svg.w.xl{width:56px;height:56px;stroke-width:1.2}
svg.w.lg{width:34px;height:34px;stroke-width:1.3}
svg.w.sm{width:18px;height:18px}

/* --- App-Layout --- */
.app{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;padding:26px 16px 18px;display:flex;flex-direction:column;gap:20px;overflow:auto}
.brand{padding:0 10px;display:flex;flex-direction:column;gap:2px}
.brand b{font-family:var(--f-display);font-size:28px;font-weight:500;font-style:italic;letter-spacing:-.01em;line-height:1}
.brand span{font-size:12px;color:var(--faint)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .sep{height:1px;background:var(--line);margin:8px 10px}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:none;padding:9px 12px;border-radius:10px;color:var(--muted);text-align:left;font-weight:500;font-size:15px}
.nav button:hover{background:var(--sunk);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--raised);color:var(--ink);box-shadow:var(--shadow)}
.nav button[aria-current="page"] svg{color:var(--accent-ink)}
.nav .count{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--faint)}
.nav .count.hot{color:var(--danger)}
.railwx{margin:0 4px;padding:14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;gap:12px;cursor:pointer;text-align:left;color:var(--ink);width:calc(100% - 8px)}
.railwx b{font-family:var(--f-display);font-size:30px;font-weight:500;line-height:1}
.railwx small{display:block;color:var(--muted);font-size:12.5px;line-height:1.3}
.rail-foot{margin-top:auto;padding:0 10px;font-size:12px;color:var(--faint);display:flex;flex-direction:column;gap:4px}

.col{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in oklab, var(--paper) 86%, transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:14px 32px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-bottom:1px solid transparent}
.top.scrolled{border-bottom-color:var(--line)}
.top h1{margin:0;font-family:var(--f-display);font-weight:500;font-size:32px;line-height:1.05;letter-spacing:-.01em;text-wrap:balance}
.top h1 i{font-style:italic;color:var(--accent-ink)}
.top .sub{font-size:13.5px;color:var(--muted)}
.top .grow{flex:1}
.pager{display:flex;gap:4px;align-items:center}
.search{position:relative;display:flex;align-items:center}
.search svg{position:absolute;left:12px;color:var(--faint)}
.search input{width:220px;max-width:44vw;padding:9px 12px 9px 38px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:15px}
main{padding:20px 32px 130px;min-width:0}

/* --- Buttons --- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 16px;border-radius:999px;font-size:14.5px;font-weight:500;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--sunk);color:var(--ink)}
.btn.danger{color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.sm{padding:6px 12px;font-size:13.5px}
.iconbtn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:999px;border:1px solid transparent;background:none;color:var(--muted);flex:none}
.iconbtn:hover{background:var(--sunk);color:var(--ink)}
.tabbar{display:none}
.fab{position:fixed;right:28px;bottom:calc(28px + env(safe-area-inset-bottom,0px));z-index:30;width:58px;height:58px;border-radius:20px;border:0;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 12px 32px color-mix(in oklab, var(--accent) 45%, transparent)}
.fab svg{width:26px;height:26px;stroke-width:1.8}

/* --- Panels --- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.panel-h h2{margin:0;font-family:var(--f-display);font-size:23px;font-weight:500}
.h2{margin:0;font-family:var(--f-display);font-size:24px;font-weight:500}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:24px;align-items:start}
.empty{padding:18px 2px;color:var(--muted);font-size:15px}
.empty b{display:block;color:var(--ink);font-weight:600;margin-bottom:2px}
.group-h{display:flex;align-items:baseline;gap:10px;margin:24px 0 8px}
.group-h:first-child{margin-top:0}
.group-h h3{margin:0;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.group-h.over h3{color:var(--danger)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:6px 13px;border-radius:999px;font-size:14px;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);background:var(--raised)}
.chip .sw{width:8px;height:8px;border-radius:50%;background:var(--c)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.tag.accent{background:var(--accent-soft);color:var(--accent-ink)}
.tag.gold{background:var(--gold-soft);color:var(--gold)}
.tag.sleep{background:var(--sleep-soft);color:var(--sleep)}
.tag.warn{background:color-mix(in oklab, var(--warn) 15%, var(--surface));color:var(--warn)}
.banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px;border:1px dashed var(--faint);border-radius:var(--r);margin-bottom:20px;font-size:14px;color:var(--muted)}
.note{font-size:14px;color:var(--muted);background:var(--sunk);border-radius:var(--r-sm);padding:11px 13px;line-height:1.55}

/* --- Heute: Kopf --- */
.hero{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:20px 28px;align-items:end;margin:4px 0 22px}
.hero .bignum{font-family:var(--f-display);font-size:clamp(84px,12vw,132px);line-height:.8;font-weight:400;letter-spacing:-.04em}
.hero .daytxt{display:flex;flex-direction:column;gap:6px;padding-bottom:6px;min-width:0}
.hero .daytxt .wd{font-family:var(--f-display);font-size:clamp(26px,3.4vw,36px);font-style:italic;line-height:1}
.hero .daytxt .mo{font-size:15px;color:var(--muted)}
.hero .chipsrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.wxnow{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);cursor:pointer;text-align:left;color:var(--ink)}
.wxnow .t{font-family:var(--f-display);font-size:46px;line-height:.9;font-weight:400;display:block}
.wxnow small{display:block;font-size:13px;color:var(--muted);line-height:1.35}
.wxnow .city{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:600;display:block}
.notices{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.notice{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:var(--r);background:var(--gold-soft);color:var(--ink);border:1px solid color-mix(in oklab, var(--gold) 30%, transparent);text-align:left;cursor:pointer;font-size:15px}
.notice svg{color:var(--gold)}
.notice.sleep{background:var(--sleep-soft);border-color:color-mix(in oklab, var(--sleep) 30%, transparent)}
.notice.sleep svg{color:var(--sleep)}
.notice.warn{background:color-mix(in oklab, var(--warn) 12%, var(--surface));border-color:color-mix(in oklab, var(--warn) 30%, transparent);cursor:default}
.notice.warn svg{color:var(--warn)}
.notice b{font-weight:600}
.next{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;padding:18px 20px;border-radius:var(--r);background:var(--ink);color:var(--paper);margin-bottom:18px;cursor:pointer;border:0;text-align:left;width:100%}
.next .lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.65;font-weight:600}
.next .t{font-size:19px;font-weight:600;margin:2px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.next .meta{font-size:14px;opacity:.78;display:flex;flex-wrap:wrap;gap:4px 14px}
.next .cd{font-family:var(--f-display);font-size:34px;line-height:1;text-align:right}
.next .cd small{display:block;font-family:var(--f-body);font-size:12px;opacity:.65}
.next .sym{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--c);color:#fff}

/* --- Tagesleiste mit Wetter --- */
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:22px}
.days button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;color:var(--ink)}
.days .wd{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.days .dn{font-family:var(--f-display);font-size:22px;line-height:1}
.days .tmp{font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap}
.days .dots{display:flex;gap:3px;height:5px}
.days .dots i{width:5px;height:5px;border-radius:50%;background:var(--c,var(--faint))}
.days button.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.days button.hol{background:var(--gold-soft)}

/* --- Tages-Zeitleiste (Heute & Tag) --- */
.tl{position:relative;display:grid;grid-template-columns:96px minmax(0,1fr)}
.tl-allday{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:6px;padding:0 0 14px 96px}
.tl-rail{display:flex;flex-direction:column}
.tl-h{height:var(--hour);display:flex;align-items:flex-start;gap:6px;padding:0 8px 0 0;border:0;background:none;text-align:left;color:var(--ink);position:relative}
.tl-h .hh{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);width:22px;transform:translateY(-8px)}
.tl-h .wx{display:flex;align-items:center;gap:3px;transform:translateY(-10px);padding:2px 5px;border-radius:8px}
.tl-h .wx .tt{font-family:var(--f-mono);font-size:12px}
.tl-h .wx .pp{font-family:var(--f-mono);font-size:10.5px;color:var(--accent-ink)}
.tl-h:hover .wx{background:var(--sunk)}
.tl-h.approx .wx{opacity:.55}
.tl-body{position:relative;border-left:1px solid var(--line);background-image:repeating-linear-gradient(to bottom, var(--line) 0, var(--line) 1px, transparent 1px, transparent var(--hour));cursor:copy}
.ev{position:absolute;left:8px;right:8px;border-radius:12px;padding:8px 12px;font-size:14px;line-height:1.3;overflow:hidden;cursor:pointer;background:color-mix(in oklab, var(--c) 14%, var(--raised));border:0;border-left:4px solid var(--c);color:var(--ink);text-align:left;display:flex;flex-direction:column;gap:2px;z-index:2}
.ev b{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ev .m{color:var(--muted);font-size:12.5px;display:flex;gap:10px;flex-wrap:wrap}
.ev .m .mono{font-size:12px}
.ev.past{opacity:.55}
.ev.short{padding:3px 10px;flex-direction:row;align-items:center;gap:8px}
.ev.short b{font-size:13.5px}
.ev[data-drag]{cursor:grab}
.ev.dragging{opacity:.88;box-shadow:var(--shadow);z-index:6;cursor:grabbing}
.buf{position:absolute;left:8px;right:8px;border-radius:10px;background:repeating-linear-gradient(135deg, color-mix(in oklab, var(--c) 12%, transparent) 0 6px, transparent 6px 12px);border:1px dashed color-mix(in oklab, var(--c) 45%, transparent);pointer-events:none;z-index:1}
.travel{position:absolute;left:8px;right:8px;border-radius:10px;border:1px dashed var(--faint);background:repeating-linear-gradient(90deg, color-mix(in oklab, var(--faint) 12%, transparent) 0 2px, transparent 2px 8px);color:var(--muted);font-size:12.5px;display:flex;align-items:center;gap:8px;padding:0 10px;overflow:hidden;white-space:nowrap;cursor:pointer;text-align:left;z-index:1}
.travel span{overflow:hidden;text-overflow:ellipsis}
.travel b{color:var(--ink);font-weight:600}
.travel.tight{border-color:var(--warn);color:var(--warn)}
.marker{position:absolute;left:0;right:0;height:0;z-index:4;pointer-events:none}
.marker::before{content:"";position:absolute;left:0;right:0;border-top:2px solid var(--c)}
.marker span{position:absolute;right:8px;top:-12px;font-size:11.5px;font-weight:600;background:var(--surface);color:var(--c);padding:2px 9px;border-radius:999px;border:1px solid color-mix(in oklab, var(--c) 40%, transparent);pointer-events:auto;display:flex;gap:5px;align-items:center;cursor:pointer;white-space:nowrap}
.marker.now{--c:var(--danger)}
.marker.now span{cursor:default}
.marker.now::after{content:"";position:absolute;left:-6px;top:-5px;width:10px;height:10px;border-radius:50%;background:var(--danger)}
.marker.sleep{--c:var(--sleep)}
.sleepzone{position:absolute;left:0;right:0;background:repeating-linear-gradient(0deg, var(--sleep-soft) 0 2px, transparent 2px 7px);pointer-events:none}
.gap{position:absolute;left:8px;right:8px;display:flex;justify-content:center;pointer-events:none;z-index:3}
.gap span{font-size:11.5px;color:var(--muted);background:var(--paper);padding:0 9px;border-radius:999px;transform:translateY(-50%);border:1px solid var(--line)}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:4px 10px;border-radius:999px;background:color-mix(in oklab, var(--c) 14%, var(--surface));border:1px solid color-mix(in oklab, var(--c) 30%, transparent);cursor:pointer;color:var(--ink);max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pill .mono{font-size:11.5px}

/* --- Listenzeilen --- */
.row-item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:13px 2px;border-top:1px solid var(--line)}
.row-item:first-child{border-top:0}
.row-item .main{cursor:pointer;min-width:0}
.row-item .ti{font-weight:500;font-size:15.5px;display:flex;align-items:center;gap:8px;min-width:0}
.row-item .ti span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-item .sm{font-size:13.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:2px;align-items:center}
.row-item.done .ti span{text-decoration:line-through;color:var(--faint)}
.check{width:24px;height:24px;border-radius:8px;border:1.5px solid var(--faint);background:none;display:grid;place-items:center;padding:0;color:#fff;flex:none}
.check.on{background:var(--accent);border-color:var(--accent)}
.check svg{width:15px;height:15px;stroke-width:2.4}
.cd{font-family:var(--f-mono);font-size:12px;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.cd.soon{background:color-mix(in oklab, var(--warn) 15%, var(--surface));color:var(--warn)}
.cd.over{background:color-mix(in oklab, var(--danger) 13%, var(--surface));color:var(--danger)}
.cd.ok{background:color-mix(in oklab, var(--ok) 14%, var(--surface));color:var(--ok)}
.prio{display:inline-flex;gap:2px;align-items:flex-end;height:12px}
.prio i{width:3px;border-radius:1px;background:var(--line)}
.prio i:nth-child(1){height:5px}.prio i:nth-child(2){height:8px}.prio i:nth-child(3){height:12px}
.prio[data-p="1"] i:nth-child(1),.prio[data-p="2"] i:nth-child(-n+2){background:var(--ink)}
.prio[data-p="3"] i{background:var(--danger)}
.progress{height:4px;border-radius:2px;background:var(--line);overflow:hidden;width:72px;display:inline-block;vertical-align:middle}
.progress i{display:block;height:100%;background:var(--accent)}
.todo-add,.quick{display:flex;gap:8px;margin-top:8px}
.todo-add input,.quick input{flex:1;min-width:0;padding:11px 15px;border:1px solid var(--line);border-radius:999px;background:var(--paper);font-size:15px}
.quick{margin-top:0}
.quick-prev{font-size:13px;color:var(--muted);margin-top:8px;min-height:18px;display:flex;flex-wrap:wrap;gap:4px 12px}
.quick-prev b{color:var(--ink);font-weight:600}

/* --- Woche --- */
.scroller{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.wk{min-width:780px;display:grid;grid-template-columns:72px repeat(var(--days),minmax(0,1fr))}
.wk-h{position:sticky;top:0;background:var(--surface);z-index:5;border-bottom:1px solid var(--line);padding:10px 6px 8px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.wk-h .wd{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.wk-h .dn{font-family:var(--f-display);font-size:26px;line-height:1}
.wk-h .wxl{display:flex;align-items:center;gap:4px;font-family:var(--f-mono);font-size:11px;color:var(--muted);min-height:20px}
.wk-h.today .dn{color:var(--accent-ink)}
.wk-h.today{box-shadow:inset 0 -2px 0 var(--accent)}
.wk-h.hol{background:var(--gold-soft)}
.wk-corner{border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:5}
.wk-all{border-bottom:1px solid var(--line);border-left:1px solid var(--line);padding:5px;min-height:34px;display:flex;flex-direction:column;gap:3px;min-width:0}
.wk-all .pill{font-size:11.5px;padding:2px 8px;border-radius:6px;width:100%}
.wk-all-l{border-bottom:1px solid var(--line);font-size:10px;color:var(--faint);padding:10px 6px;text-align:right}
.wk-times div{height:var(--hour);font-family:var(--f-mono);font-size:10.5px;color:var(--faint);text-align:right;padding-right:8px;transform:translateY(-7px)}
.wk-col{position:relative;border-left:1px solid var(--line);background-image:repeating-linear-gradient(to bottom, var(--line) 0, var(--line) 1px, transparent 1px, transparent var(--hour));cursor:copy}
.wk-col.today{background-color:color-mix(in oklab, var(--accent) 4%, transparent)}
.wk-col .ev{left:3px;right:3px;padding:4px 7px;border-radius:8px;font-size:12px;border-left-width:3px}
.wk-col .ev b{font-size:12.5px}
.wk-col .ev .m{font-size:11px}
.wk-col .buf,.wk-col .travel{left:3px;right:3px;border-radius:7px}
.wk-col .travel{font-size:10.5px;padding:0 5px}
.wk-col .marker span{font-size:10px;right:3px;padding:0 6px;top:-10px}

/* --- Monat --- */
.mo{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--line);gap:1px}
.mo-h{background:var(--surface);padding:9px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:center}
.mo-d{background:var(--surface);min-height:118px;padding:7px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0;border:0;text-align:left;color:var(--ink)}
.mo-d:hover{background:var(--raised)}
.mo-d.out{background:var(--paper);color:var(--faint)}
.mo-d.hol{background:var(--gold-soft)}
.mo-d .n{display:flex;justify-content:space-between;align-items:center;gap:4px}
.mo-d .n .d{font-family:var(--f-display);font-size:20px;line-height:1}
.mo-d .n .wx{display:flex;align-items:center;gap:2px;font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.mo-d.today .n .d{background:var(--accent);color:#fff;border-radius:999px;padding:3px 8px 4px;font-size:17px}
.mo-d .hn{font-size:11px;color:var(--gold);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mo-d .li{display:flex;align-items:center;gap:5px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mo-d .li i{width:6px;height:6px;border-radius:50%;background:var(--c);flex:none}
.mo-d .li .mono{font-size:10.5px;color:var(--muted)}
.mo-d .more{font-size:11px;color:var(--muted)}
.mo-d .dotrow{display:none;gap:3px;flex-wrap:wrap;margin-top:auto}
.mo-d .dotrow i{width:6px;height:6px;border-radius:50%;background:var(--c)}

/* --- Jahr --- */
.yr{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.ym{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.ym h3{margin:0 0 8px;font-family:var(--f-display);font-weight:500;font-size:20px;cursor:pointer}
.ym.cur h3{color:var(--accent-ink);font-style:italic}
.ymg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.ymg span{font-size:10px;color:var(--faint);text-align:center}
.ymg button{aspect-ratio:1;border:0;border-radius:6px;font-family:var(--f-mono);font-size:11px;background:color-mix(in oklab, var(--accent) calc(var(--load,0) * 1%), transparent);color:var(--ink);padding:0;min-width:0}
.ymg button.hol{box-shadow:inset 0 0 0 1.5px var(--gold);color:var(--gold);font-weight:600}
.ymg button.today{background:var(--accent);color:#fff}
.ymg button.we{color:var(--muted)}

/* --- Stundenplan, Karten --- */
.sem{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center}
.sem .big{font-family:var(--f-display);font-size:28px;font-weight:500}
.semprog{flex:1;min-width:200px}
.semprog .track{height:6px;background:var(--sunk);border-radius:3px;position:relative;overflow:hidden}
.semprog .track i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:3px}
.semprog .lbl{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:6px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.card{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;text-align:left;color:var(--ink);text-decoration:none;align-items:center;width:100%}
.card:hover{border-color:var(--faint)}
.card .sym{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:color-mix(in oklab, var(--c, var(--accent)) 14%, var(--surface));color:var(--c, var(--accent-ink))}
.card b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card small{color:var(--muted);font-size:13.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* --- Wetter --- */
.wxhero{display:flex;flex-wrap:wrap;gap:20px 36px;align-items:center;margin-bottom:22px}
.wxhero .t{font-family:var(--f-display);font-size:96px;line-height:.85;font-weight:400;letter-spacing:-.03em}
.wxhero .ph{font-size:18px;font-weight:500}
.wxhero .facts{display:grid;grid-template-columns:repeat(2,auto);gap:4px 22px;font-size:14px;color:var(--muted)}
.wxhero .facts b{color:var(--ink);font-weight:500}
.hours{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.hours button{flex:0 0 72px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--ink)}
.hours .h{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.hours .t{font-family:var(--f-display);font-size:22px;line-height:1}
.hours .p{font-family:var(--f-mono);font-size:11px;color:var(--accent-ink);min-height:14px}
.dayrow{display:grid;grid-template-columns:110px 40px minmax(0,1fr) 50px 140px;gap:12px;align-items:center;padding:12px 4px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;color:var(--ink);width:100%}
.dayrow:first-child{border-top:0}
.dayrow .ph{color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dayrow .rng{position:relative;height:6px;border-radius:3px;background:var(--sunk);flex:1}
.dayrow .rng i{position:absolute;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg, var(--accent), var(--gold))}
.citychips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}

/* --- Einstellungen --- */
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:18px;align-items:start}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .l{min-width:0}
.row .l b{display:block;font-weight:500}
.row .l small{color:var(--muted);font-size:13.5px;display:block}
.row input[type=number],.row input[type=time],.row select,.row input[type=text]{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);max-width:170px}
.row input[type=number]{width:80px}
.swatches{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.swatch{width:30px;height:30px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);background:var(--c);padding:0;position:relative;display:inline-block}
.swatch[aria-pressed="true"],.swatch:has(input:checked){box-shadow:0 0 0 2px var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--sunk);flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 13px;border-radius:999px;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--ink);box-shadow:var(--shadow)}
.listrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.listrow[data-act]{cursor:pointer}
.listrow:first-child{border-top:0}
.listrow .sw{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.listrow .grow{flex:1;min-width:0}
.listrow small{color:var(--muted);font-size:13px;display:block}
.switch{position:relative;width:44px;height:26px;border-radius:999px;background:var(--line);border:0;padding:0;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--raised);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(18px)}

/* --- Sheets --- */
.sheet{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px}
.sheet .scrim{position:absolute;inset:0;background:rgba(8,10,20,.48);animation:fade .18s ease-out}
.sheet .card2{position:relative;width:min(600px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--surface);border-radius:20px;box-shadow:0 30px 70px rgba(0,0,0,.35);padding:24px;animation:rise .22s cubic-bezier(.2,.8,.2,1)}
.sheet h2{margin:0 0 18px;font-family:var(--f-display);font-size:28px;font-weight:500;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;line-height:1.1}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(14px);opacity:0}}
.form{display:flex;flex-direction:column;gap:15px}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f > span{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.f input,.f select,.f textarea,.rfind-r input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);min-width:0;font-size:15.5px}
.f textarea{min-height:80px;resize:vertical}
.f input.title{font-size:21px;font-weight:500;background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:6px 0}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.inline-check{display:flex;align-items:center;gap:8px;font-size:15px}
.remchips{display:flex;flex-wrap:wrap;gap:6px}
.remchips label{display:inline-flex;position:relative}
.remchips input{position:absolute;opacity:0;pointer-events:none}
.remchips span{border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px;color:var(--muted);cursor:pointer}
.remchips input:checked + span{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.remchips input:focus-visible + span{outline:2px solid var(--accent-ink);outline-offset:2px}
.symgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.symgrid label{display:grid;place-items:center;height:42px;border:1px solid var(--line);border-radius:10px;cursor:pointer;color:var(--muted);position:relative}
.symgrid input{position:absolute;opacity:0;pointer-events:none}
.symgrid label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.sheet-foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;margin-top:6px;padding-top:16px;border-top:1px solid var(--line)}
.sheet-foot .r{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.breakrow{display:grid;grid-template-columns:1fr 1fr 1.2fr auto;gap:6px;align-items:center}
.breakrow input{padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--paper);min-width:0}
.subrow{display:flex;gap:8px;align-items:center}
.subrow input[type=text]{flex:1;padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:var(--paper);min-width:0}
.menu{display:grid;gap:8px}
.menu button{display:flex;gap:14px;align-items:center;text-align:left;padding:15px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink)}
.menu button:hover{border-color:var(--accent)}
.menu b{display:block;font-weight:600}
.menu small{color:var(--muted);font-size:13.5px}
.menu svg{color:var(--accent-ink)}

/* --- Detailansicht (große Schrift) --- */
.detail{font-size:17px}
.detail .dh{display:flex;gap:16px;align-items:flex-start;margin-bottom:18px}
.detail .dh .sym{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:color-mix(in oklab, var(--c) 16%, var(--surface));color:var(--c);flex:none}
.detail .dh .sym svg{width:26px;height:26px}
.detail .dh .txt{flex:1;min-width:0}
.detail .dt{font-family:var(--f-display);font-size:31px;line-height:1.1;font-weight:500;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.detail .ds{color:var(--muted);font-size:15px;margin-top:4px}
.detail .facts{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.detail .fact{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;padding:13px 0;border-bottom:1px solid var(--line);align-items:start}
.detail .fact svg{color:var(--muted);margin-top:3px}
.detail .fact b{font-weight:600;display:block}
.detail .fact small{display:block;color:var(--muted);font-size:14.5px;margin-top:1px}
.detail .big{font-family:var(--f-display);font-size:48px;line-height:1}
.detail .notes{white-space:pre-wrap;font-size:16px;line-height:1.6}
.detail .subs{display:flex;flex-direction:column;gap:8px}
.detail .subs label{display:flex;gap:10px;align-items:center;font-size:16px}
.detail .subs input{width:20px;height:20px;accent-color:var(--accent)}
.detail .wxgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:6px}
.detail .wxgrid div{background:var(--sunk);border-radius:12px;padding:10px 12px}
.detail .wxgrid small{display:block;font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.detail .wxgrid b{font-size:18px;font-weight:600}

/* --- Toasts --- */
.toasts{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:14px;z-index:60;display:flex;flex-direction:column;gap:8px;width:min(380px,calc(100vw - 28px))}
.toast{background:var(--ink);color:var(--paper);border-radius:14px;padding:13px 15px;box-shadow:0 14px 34px rgba(0,0,0,.28);display:flex;gap:12px;align-items:flex-start;animation:rise .22s ease-out}
.toast.rem{background:var(--raised);color:var(--ink);border:1px solid var(--accent);border-left-width:4px}
.toast .x{margin-left:auto;background:none;border:0;color:inherit;opacity:.6;padding:0}
.toast b{display:block}
.toast small{opacity:.78;font-size:13.5px}

/* --- Responsiv --- */
@media (max-width: 1060px){ .grid2{grid-template-columns:minmax(0,1fr)} }
@media (max-width: 860px){

  .top{padding:10px 16px}
  .top h1{font-size:26px}
  main{padding:14px 16px calc(116px + env(safe-area-inset-bottom,0px))}
  .search input{width:130px}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in oklab, var(--surface) 94%, transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--faint);padding:4px 0}
  .tabbar button[aria-current="page"]{color:var(--accent-ink)}
  .tabbar svg{width:23px;height:23px}
  .fab{bottom:calc(80px + env(safe-area-inset-bottom,0px));right:16px;width:54px;height:54px}
  .hero{grid-template-columns:auto minmax(0,1fr)}
  .hero .wxnow{grid-column:1 / -1}
  .panel{padding:16px}
  .tl{grid-template-columns:74px minmax(0,1fr)}
  .tl-allday{padding-left:74px}
  .tl-h .wx .pp{display:none}
  .mo-d{min-height:66px;padding:5px}
  .mo-d .li,.mo-d .more,.mo-d .hn,.mo-d .n .wx span{display:none}
  .mo-d .dotrow{display:flex}
  .sheet{place-items:end center;padding:0}
  .sheet .card2{width:100%;border-radius:22px 22px 0 0;max-height:92vh;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px))}
  .dayrow{grid-template-columns:84px 32px 40px minmax(0,1fr)}
  .dayrow .ph{display:none}
  .next{grid-template-columns:auto minmax(0,1fr)}
  .next .cd{grid-column:1 / -1;text-align:left;font-size:28px}

}
@media (min-width: 861px){ .hide-d{display:none !important} }
@media (prefers-reduced-motion: reduce){ *{animation:none !important;transition:none !important} }

/* ---- v3: klar und flach – keine Kästen, keine Seitenstreifen ---- */
body{font-size:16.5px;letter-spacing:.003em}
.top h1{font-weight:500;letter-spacing:-.015em}
.top h1 i,.hero .daytxt .wd,.brand b,.ym.cur h3{font-style:normal}
.top h1 i{color:var(--muted);font-weight:400}
.brand b{font-weight:600;letter-spacing:-.02em}
.panel{background:none;border:0;border-radius:0;padding:0}
.panel-h{margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.panel-h h2{font-size:24px}
.grid2{gap:44px}
.stack{gap:36px}
.settings{gap:40px 48px}
.settings .panel-h{border-bottom:0;padding-bottom:0}
.wxnow{background:none;border:0;padding:0}
.railwx{background:none;border:0;padding:6px 10px}
.next{background:var(--accent-soft);color:var(--ink);border-radius:18px}
.next .lbl,.next .meta,.next .cd small{opacity:1;color:var(--muted)}
.next .cd{color:var(--accent-ink)}
.days button{border:0;background:none;border-radius:14px}
.days button:hover{background:var(--sunk)}
.days button.today{box-shadow:none;background:var(--accent-soft)}
.days button.today .dn,.days button.today .wd{color:var(--accent-ink)}
.ev{border-left:0;background:color-mix(in oklab, var(--c) 17%, var(--surface));border-radius:12px}
.ev b{display:flex;align-items:center;gap:7px}
.ev b::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}
.wk-col .ev{border-left:0}
.wk-col .ev b::before{width:6px;height:6px}
.tl-body{border-left:0}
.buf{border-style:dotted}
.card{border:0;background:var(--sunk)}
.card:hover{background:color-mix(in oklab, var(--accent) 8%, var(--sunk))}
.scroller{border:0;background:none}
.wk-h,.wk-corner{background:var(--paper)}
.mo{border:0;background:var(--line);border-radius:16px}
.ym{border:0;background:none;padding:6px 4px}
.notice{border:0}
.banner{border:0;background:var(--sunk)}
.row-item{padding:14px 2px}
.chip{border-color:transparent;background:var(--sunk)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.toast.rem{border:0;box-shadow:0 14px 34px rgba(0,0,0,.22)}

/* ---- Stundenplan als Blockraster ---- */
.tt-grid{display:grid;grid-template-columns:64px repeat(var(--days),minmax(0,1fr));gap:8px;min-width:640px}
.tt-head{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:center;padding:4px 0 8px;font-weight:600}
.tt-head.today{color:var(--accent-ink)}
.tt-slot{display:flex;flex-direction:column;justify-content:center;align-items:flex-end;padding-right:6px;font-family:var(--f-mono);font-size:12px;color:var(--muted);line-height:1.3}
.tt-slot b{font-family:var(--f-display);font-size:20px;color:var(--ink);font-weight:500}
.tt-cell{min-height:104px;border-radius:16px;display:flex;flex-direction:column;gap:6px}
.tt-cell.free{border:1.5px dashed var(--line);background:none;cursor:pointer;align-items:center;justify-content:center;color:var(--faint);font-size:13px}
.tt-cell.free:hover{border-color:var(--accent);color:var(--accent-ink)}
.tt-block{flex:1;border:0;border-radius:16px;padding:12px 13px;background:color-mix(in oklab, var(--c) 17%, var(--surface));color:var(--ink);text-align:left;display:flex;flex-direction:column;gap:4px;cursor:pointer;min-width:0}
.tt-block:hover{background:color-mix(in oklab, var(--c) 24%, var(--surface))}
.tt-block .ty{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--c)}
.tt-block b{font-size:15.5px;font-weight:600;line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tt-block small{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tt-cell.lunch{min-height:20px}

/* ---- v4: Ein Kalender-Tab, Schlafzeile, kräftige Blöcke ---- */
.top .seg{margin-left:4px}
.sleepline{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:center;padding:13px 18px;border-radius:16px;background:var(--sleep-soft);border:0;color:var(--ink);margin-bottom:20px;font-size:15px;text-align:left;width:100%;cursor:pointer}
.sleepline span{display:inline-flex;gap:7px;align-items:center}
.sleepline svg{color:var(--sleep)}
.sleepline b{font-family:var(--f-mono);font-weight:500;font-size:15px}
.days button.sel{background:var(--ink);color:var(--paper)}
.days button.sel .wd,.days button.sel .tmp,.days button.sel .bed{color:inherit;opacity:.8}
.days .bed,.wk-h .bed,.mo-d .bed{font-family:var(--f-mono);font-size:10.5px;color:var(--sleep);display:flex;align-items:center;gap:3px}
.days .bed svg,.wk-h .bed svg,.mo-d .bed svg{width:11px;height:11px}
.ev.solid{background:var(--c);color:#fff}
.ev.solid b::before{background:#fff;opacity:.85}
.ev.solid .m{color:rgba(255,255,255,.86)}
.buf.block{background:color-mix(in oklab, var(--c) 16%, var(--surface));border:0;border-radius:12px}
.tt-block{background:var(--c);color:#fff;box-shadow:0 8px 20px -10px var(--c)}
.tt-block:hover{background:color-mix(in oklab, var(--c) 88%, black)}
.tt-block .ty{color:rgba(255,255,255,.82)}
.tt-block small{color:rgba(255,255,255,.85)}
.newplace{display:grid;gap:12px;padding-top:12px;border-top:1px solid var(--line)}
.newplace .q{font-weight:600;font-size:15px}

/* ---- v5: Übergänge, Tagesfarben, Stil-Optionen ---- */
:root{--r-ev:12px}
.ev,.tt-block,.buf.block,.tt-cell{border-radius:var(--r-ev)}
.nav button,.tabbar button,.seg button,.chip,.days button{transition:background .22s ease,color .22s ease,box-shadow .22s ease}
main.enter > *{animation:viewin .34s cubic-bezier(.2,.8,.2,1) both}
main.enter > *:nth-child(2){animation-delay:.035s} main.enter > *:nth-child(3){animation-delay:.07s} main.enter > *:nth-child(4){animation-delay:.1s} main.enter > *:nth-child(n+5){animation-delay:.13s}
@keyframes viewin{from{opacity:0;transform:translateY(12px)}}
:root[data-motion="off"] *{animation:none !important;transition:none !important}
.top{transition:border-color .2s}
.top .sub{min-height:1.2em}
/* Tagesfarbe: Farbe der dominanten Kategorie, Stärke nach Auslastung */
.dtint{background:color-mix(in oklab, var(--dc, transparent) var(--dl, 0%), var(--paper))}
.wk-h.dtint{background:color-mix(in oklab, var(--dc, transparent) var(--dl, 0%), var(--paper))}
.wk-col.dtint{background-color:color-mix(in oklab, var(--dc, transparent) calc(var(--dl, 0%) * .35), transparent)}
.mo-d.dtint{background:color-mix(in oklab, var(--dc, transparent) var(--dl, 0%), var(--surface))}
.days button.dtint:not(.sel){background:color-mix(in oklab, var(--dc, transparent) var(--dl, 0%), transparent)}
.ymg button.dtint:not(.today){background:color-mix(in oklab, var(--dc, transparent) calc(var(--dl, 0%) * 1.6), transparent)}
.hero .bignum{color:var(--dc, var(--ink))}
.daybar{display:flex;height:6px;border-radius:3px;overflow:hidden;gap:2px;margin-top:10px;max-width:280px}
.daybar i{display:block;height:100%;background:var(--c);border-radius:3px}
.wk-times div{display:flex;flex-direction:column;align-items:flex-end;gap:1px;line-height:1.15}
.wk-times .twx{display:flex;align-items:center;gap:2px;color:var(--muted);font-size:10.5px}
.wk-times .twx svg{width:15px;height:15px}
.wk-times .twx.approx{opacity:.55}
.marker.sleep.late span{top:-26px}
/* Stil: Schrift */
:root[data-font="modern"]{--f-display:var(--f-body)}
:root[data-font="modern"] .top h1,:root[data-font="modern"] .panel-h h2,:root[data-font="modern"] .h2{font-weight:650;letter-spacing:-.025em}
:root[data-font="modern"] .hero .bignum{font-weight:600;letter-spacing:-.06em}
:root[data-font="tech"]{--f-display:var(--f-mono)}
:root[data-font="tech"] .top h1{font-size:26px;letter-spacing:-.04em}
:root[data-font="tech"] .hero .bignum{letter-spacing:-.08em}
/* Stil: Dichte */
:root[data-density="compact"] body{font-size:15px}
:root[data-density="compact"] main{padding-top:12px}
:root[data-density="compact"] .row-item{padding:9px 2px}
:root[data-density="compact"] .grid2{gap:28px}
:root[data-density="airy"] body{font-size:17px}
:root[data-density="airy"] .row-item{padding:18px 2px}
:root[data-density="airy"] .grid2{gap:60px}
/* Stil: Ecken */
:root[data-radius="crisp"]{--r:6px;--r-sm:4px;--r-ev:5px}
:root[data-radius="round"]{--r:22px;--r-sm:12px;--r-ev:18px}
/* Stil: Hintergrundton (nur hell) */
@media (prefers-color-scheme: light){
  :root[data-tone="neutral"]:not([data-theme="dark"]){--paper:#F1F1F2;--surface:#FCFCFC;--sunk:#E6E6E9;--line:#DADADE;--muted:#56565E}
  :root[data-tone="warm"]:not([data-theme="dark"]){--paper:#F3F1EE;--surface:#FDFCFA;--sunk:#E9E5E0;--line:#DDD8D1;--muted:#5C5650;--faint:#958D84}
}
:root[data-tone="neutral"][data-theme="light"]{--paper:#F1F1F2;--surface:#FCFCFC;--sunk:#E6E6E9;--line:#DADADE;--muted:#56565E}
:root[data-tone="warm"][data-theme="light"]{--paper:#F3F1EE;--surface:#FDFCFA;--sunk:#E9E5E0;--line:#DDD8D1;--muted:#5C5650;--faint:#958D84}
.stylegrid{display:grid;gap:4px}
.preview{display:flex;gap:10px;align-items:center;padding:14px;border-radius:var(--r);background:var(--sunk);margin-top:6px}
.preview .ev{position:static;flex:1;height:auto;pointer-events:none}

/* ---- v6: Planer ---- */
.ev.work{background:repeating-linear-gradient(135deg, color-mix(in oklab, var(--c) 16%, var(--surface)) 0 7px, color-mix(in oklab, var(--c) 8%, var(--surface)) 7px 14px);outline:1.5px dashed color-mix(in oklab, var(--c) 60%, transparent);outline-offset:-1.5px;color:var(--ink)}
.ev.work b::before{border-radius:2px}
.layers{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;align-items:center}
.layers .lbl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-right:4px}
.wlist{display:flex;flex-direction:column;gap:12px}
.wday{border-radius:var(--r);background:var(--surface);padding:14px 16px}
.wday.dtint{background:color-mix(in oklab, var(--dc, transparent) var(--dl, 0%), var(--surface))}
.wday.today{box-shadow:inset 0 0 0 2px var(--accent)}
.wday-h{display:flex;align-items:center;gap:12px;cursor:pointer;margin-bottom:8px}
.wday-h .dn{font-family:var(--f-display);font-size:30px;line-height:1;min-width:38px}
.wday-h .wd{font-weight:600}
.wday-h small{display:block;color:var(--muted);font-size:13px}
.wday-h .sp{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.wday-h .sp .bed{color:var(--sleep);display:flex;gap:3px;align-items:center}
.wrow{display:grid;grid-template-columns:52px 8px minmax(0,1fr);gap:10px;align-items:center;padding:7px 0;border-top:1px solid color-mix(in oklab, var(--line) 70%, transparent);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;color:var(--ink);cursor:pointer;font-size:15px}
.wrow:first-of-type{border-top:0}
.wrow .t{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.wrow .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.wrow.work .dot{border-radius:2px;background:none;outline:1.5px dashed var(--c)}
.wrow.go{color:var(--muted);font-size:13.5px;cursor:default}
.wrow.go .dot{background:none;width:8px;height:2px;border-radius:1px;background:var(--faint)}
.wrow .ti{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrow .ti small{color:var(--muted);margin-left:6px}
.review{margin-top:28px}
.revgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:24px}
.stat .big{font-family:var(--f-display);font-size:34px;line-height:1}
.stat small{display:block;color:var(--muted);font-size:13px;margin-top:4px}
.catbars{display:flex;flex-direction:column;gap:8px}
.catbar{display:grid;grid-template-columns:120px minmax(0,1fr) 54px;gap:10px;align-items:center;font-size:14px}
.catbar .tr{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.catbar .tr i{display:block;height:100%;background:var(--c);border-radius:4px}
.catbar .n{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);text-align:right}
.habit{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.habit:first-of-type{border-top:0}
.habit .hd{display:flex;gap:4px}
.habit .hd i{width:9px;height:9px;border-radius:50%;background:var(--sunk)}
.habit .hd i.on{background:var(--c)}
.habit .hd i.off{background:transparent;outline:1px dashed var(--line)}
.habit .streak{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);white-space:nowrap}
.habit .hname{cursor:pointer;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.focusbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:45;display:flex;align-items:center;gap:12px;padding:10px 12px 10px 14px;border-radius:999px;background:var(--ink);color:var(--paper);box-shadow:0 14px 34px rgba(0,0,0,.3);max-width:calc(100vw - 32px)}
.focusbar .btn{background:transparent;color:var(--paper);border-color:color-mix(in oklab, var(--paper) 30%, transparent)}
.fb-ring{width:30px;height:30px;border-radius:50%;background:conic-gradient(var(--accent-ink) calc(var(--p) * 1%), color-mix(in oklab, var(--paper) 20%, transparent) 0);flex:none}
.fb-txt{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.fb-txt small{opacity:.7;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.fb-txt b{font-size:18px}
.ymg button.brk:not(.today){background:var(--sleep-soft)}
.ymg button.exam:not(.today){background:color-mix(in oklab, var(--danger) 16%, var(--surface))}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted);margin:14px 0 0}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
.notebox{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.notebox textarea{width:100%;min-height:90px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);font-size:15.5px;resize:vertical}
.toast .act{margin-top:6px}
@media (max-width: 860px){ .focusbar{bottom:calc(84px + env(safe-area-inset-bottom,0px))} .catbar{grid-template-columns:90px minmax(0,1fr) 48px} }

/* ---- v7: lebendiger Plan ---- */
.ev{background:linear-gradient(160deg, color-mix(in oklab, var(--c) 28%, var(--surface)), color-mix(in oklab, var(--c) 11%, var(--surface)));box-shadow:0 8px 18px -12px var(--c), inset 0 0 0 1px color-mix(in oklab, var(--c) 20%, transparent);transition:transform .16s ease, box-shadow .16s ease}
.ev:hover{transform:translateY(-1px);box-shadow:0 12px 24px -12px var(--c), inset 0 0 0 1px color-mix(in oklab, var(--c) 30%, transparent)}
.ev.solid{background:linear-gradient(155deg, color-mix(in oklab, var(--c) 82%, white), var(--c) 55%, color-mix(in oklab, var(--c) 85%, black));box-shadow:0 10px 22px -10px var(--c)}
.ev.work{box-shadow:none}
.ev .wm{position:absolute;right:-8px;bottom:-10px;opacity:.17;pointer-events:none;color:var(--c);display:flex}
.ev .wm svg{width:52px;height:52px;stroke-width:1.3}
.ev.solid .wm{color:#fff;opacity:.26}
.ev.short .wm{right:4px;bottom:auto;top:50%;transform:translateY(-50%);opacity:.22}
.ev.short .wm svg{width:20px;height:20px}
.wk-col .ev .wm svg{width:36px;height:36px}
.tt-block{position:relative;overflow:hidden;background:linear-gradient(155deg, color-mix(in oklab, var(--c) 80%, white), var(--c) 55%, color-mix(in oklab, var(--c) 85%, black))}
.tt-block .wm{position:absolute;right:-10px;bottom:-12px;opacity:.25;color:#fff;display:flex}
.tt-block .wm svg{width:64px;height:64px;stroke-width:1.2}
.sleepzone{background:radial-gradient(circle, color-mix(in oklab, var(--sleep) 55%, transparent) 0 1px, transparent 1.6px) 0 0/26px 26px, linear-gradient(to bottom, color-mix(in oklab, var(--sleep) 13%, transparent), color-mix(in oklab, var(--sleep) 22%, transparent))}
.marker.sleep span{background:var(--sleep);color:#fff;border:0;box-shadow:0 6px 14px -6px var(--sleep)}
.marker.now::before{box-shadow:0 0 10px 1px color-mix(in oklab, var(--danger) 60%, transparent)}
.marker.now span{background:var(--danger);color:#fff;border:0}
.wk-times div{border-radius:0}
.tl-h{border-radius:0}
.wk-h{gap:4px;padding:12px 6px 10px}
.wk-h .dn{font-size:32px;font-weight:500;padding:2px 8px;border-radius:14px}
.wk-h.today .dn{background:var(--accent);color:#fff;box-shadow:0 8px 18px -8px var(--accent)}
.wk-h .wxl svg{width:22px;height:22px}
.wk-h .bed{background:var(--sleep-soft);padding:1px 7px;border-radius:999px}
.wk-col:hover{background-color:color-mix(in oklab, var(--accent) 3%, transparent)}
.travel{background:repeating-linear-gradient(135deg, color-mix(in oklab, var(--faint) 14%, transparent) 0 4px, transparent 4px 9px);border-color:color-mix(in oklab, var(--faint) 70%, transparent)}
.whero{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:center;justify-content:space-between;padding:20px 22px;border-radius:calc(var(--r) + 6px);margin-bottom:18px;background:radial-gradient(120% 140% at 0% 0%, color-mix(in oklab, var(--accent) 22%, var(--surface)), transparent 60%), radial-gradient(120% 140% at 100% 100%, color-mix(in oklab, var(--sleep) 18%, var(--surface)), transparent 60%), var(--surface)}
.whero-t{display:flex;flex-direction:column;gap:2px}
.whero-t b{font-family:var(--f-display);font-size:34px;font-weight:500;line-height:1.05}
.whero-t span:last-child{color:var(--muted);font-size:14px}
.whero-c{display:flex;flex-wrap:wrap;gap:8px}
.wchip{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:999px;background:color-mix(in oklab, var(--c) 16%, var(--surface));font-size:13.5px;color:var(--ink);box-shadow:inset 0 0 0 1px color-mix(in oklab, var(--c) 22%, transparent)}
.wchip svg{color:var(--c)}
.wchip b{font-family:var(--f-mono);font-weight:500;font-size:13px}
.wrow:not(.go){background:linear-gradient(120deg, color-mix(in oklab, var(--c) 18%, transparent), color-mix(in oklab, var(--c) 6%, transparent));border:0;border-radius:12px;padding:9px 12px;margin-top:6px;position:relative;overflow:hidden}
.wrow.work{background:repeating-linear-gradient(135deg, color-mix(in oklab, var(--c) 14%, transparent) 0 7px, color-mix(in oklab, var(--c) 6%, transparent) 7px 14px)}
.wrow.go{border:0;padding:4px 12px}
.wday{box-shadow:0 10px 30px -22px var(--dc, #000)}
.wday-h .dn{font-size:34px;color:var(--dc, var(--ink))}
.next{background:radial-gradient(130% 160% at 0% 0%, color-mix(in oklab, var(--c) 28%, var(--surface)), transparent 65%), var(--accent-soft)}
.days button{position:relative}
.days button.today:not(.sel) .dn{color:var(--accent-ink)}

/* ---- v7.1: flach, ohne 3D (keine Schatten, kein Anheben, keine Hell-Dunkel-Verläufe) ---- */
.ev{background:color-mix(in oklab, var(--c) 18%, var(--surface));box-shadow:none;transform:none !important}
.ev:hover{box-shadow:none;background:color-mix(in oklab, var(--c) 24%, var(--surface))}
.ev.solid{background:var(--c);box-shadow:none}
.ev.solid:hover{background:color-mix(in oklab, var(--c) 90%, var(--ink))}
.tt-block{background:var(--c);box-shadow:none}
.tt-block:hover{background:color-mix(in oklab, var(--c) 90%, var(--ink))}
.wk-h.today .dn,.marker.sleep span,.wday,.fab{box-shadow:none}
.marker.now::before{box-shadow:none}
.wchip{box-shadow:none}
.whero{background:color-mix(in oklab, var(--accent) 9%, var(--surface))}
.next{background:var(--accent-soft)}
.wrow:not(.go){background:color-mix(in oklab, var(--c) 13%, transparent)}
.nav button[aria-current="page"],.seg button[aria-pressed="true"]{box-shadow:none}
.nav button[aria-current="page"]{background:var(--sunk)}
.seg button[aria-pressed="true"]{background:var(--surface)}
.toast,.sheet .card2,.focusbar{box-shadow:0 0 0 1px var(--line)}

/* ---- v8: Premium-Feinschliff ----
   Typo-Skala (5 Größen, 2 Gewichte) · 8-Punkt-Raster · gleich helle Palette ·
   Mikro-Animationen · Linienillustrationen für leere Zustände */
:root{
  --fs-xs:12px; --fs-s:14px; --fs-m:16px; --fs-l:22px; --fs-xl:32px; --fs-hero:112px;
  --w-reg:400; --w-bold:600;
  --s1:8px; --s2:16px; --s3:24px; --s4:32px; --s5:40px; --s6:48px;
}
body{font-size:var(--fs-m);font-variant-numeric:tabular-nums;font-weight:var(--w-reg)}
.eyebrow,.tag,.group-h h3,.wk-h .wd,.mo-h,.tt-head,.lbl,.f > span{font-size:var(--fs-xs);font-weight:var(--w-bold);letter-spacing:.12em}
.btn,.chip,.seg button,.nav button,.row-item .sm,.ev .m,.note,.muted,.faint,small{font-weight:var(--w-reg)}
.btn{font-size:var(--fs-s);font-weight:var(--w-bold)}
.chip,.seg button{font-size:var(--fs-s)}
.nav button{font-size:var(--fs-m)}
.top h1{font-size:var(--fs-xl);font-weight:var(--w-reg);letter-spacing:-.02em}
.panel-h h2,.h2,.sheet h2{font-size:var(--fs-l);font-weight:var(--w-reg);letter-spacing:-.01em}
.hero .bignum{font-size:clamp(80px,11vw,var(--fs-hero));font-weight:300;letter-spacing:-.05em}
.hero .daytxt .wd{font-size:var(--fs-xl);font-weight:var(--w-reg)}
.wk-h .dn,.mo-d .n .d,.days .dn,.wday-h .dn,.whero-t b,.stat .big,.detail .big,.wxhero .t,.wxnow .t{font-weight:300}
.whero-t b,.stat .big{font-size:var(--fs-xl)}
.row-item .ti,.ev b,.tt-block b,.card b,.listrow .grow,.notice b,.next .t,.menu b{font-weight:var(--w-bold)}
.row-item .ti{font-size:var(--fs-m)} .row-item .sm,.ev .m,.note,.card small{font-size:var(--fs-s)}
.num,.mono,.cd,.days .tmp,.wk-times,.hh{font-feature-settings:"tnum" 1,"zero" 0}
main{padding:var(--s3) var(--s4) 128px}
.top{padding:var(--s2) var(--s4)}
.grid2{gap:var(--s6)}
.stack{gap:var(--s5)}
.panel-h{margin-bottom:var(--s1);padding-bottom:var(--s1)}
.row-item{padding:var(--s2) 0;gap:var(--s2)}
.notices{gap:var(--s1);margin-bottom:var(--s3)}
.notice{padding:var(--s2) var(--s2)}
.days{gap:var(--s1);margin-bottom:var(--s3)}
.whero{padding:var(--s3);margin-bottom:var(--s3)}
.hero{margin:0 0 var(--s3);gap:var(--s2) var(--s4)}
.sleepline{padding:var(--s2) var(--s3);margin-bottom:var(--s3);gap:var(--s1) var(--s3)}
@media (max-width: 860px){ main{padding:var(--s2) var(--s2) calc(120px + env(safe-area-inset-bottom,0px))} .top{padding:var(--s1) var(--s2)} .grid2{gap:var(--s5)} }
/* Palette im Nachtmodus gedämpft, damit nichts blendet */
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .ev.solid,:root:not([data-theme="light"]) .tt-block{background:color-mix(in oklab, var(--c) 72%, var(--surface))} }
:root[data-theme="dark"] .ev.solid,:root[data-theme="dark"] .tt-block{background:color-mix(in oklab, var(--c) 72%, var(--surface))}
/* Mikro-Animationen */
.check svg path{stroke-dasharray:24;stroke-dashoffset:0}
.check.on svg path{animation:drawcheck .32s cubic-bezier(.2,.8,.2,1) both}
@keyframes drawcheck{from{stroke-dashoffset:24}}
.check{transition:background .18s ease,border-color .18s ease}
.check.on{animation:pop .22s ease-out}
@keyframes pop{50%{transform:scale(1.12)}}
.switch::after{transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.sheet .card2{animation-duration:.26s}
:root[data-motion="off"] .check.on svg path,:root[data-motion="off"] .check.on{animation:none}
/* Leere Zustände */
.emptyart{display:flex;flex-direction:column;align-items:center;text-align:center;gap:var(--s1);padding:var(--s3) var(--s2);color:var(--muted)}
.emptyart svg{width:72px;height:72px;fill:none;stroke:var(--faint);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;margin-bottom:4px}
.emptyart b{color:var(--ink);font-weight:var(--w-reg);font-family:var(--f-display);font-size:var(--fs-l)}
.emptyart span{font-size:var(--fs-s);max-width:34ch}
.tl-empty{position:absolute;left:0;right:0;top:40px;pointer-events:none}
.wday .emptyart{padding:var(--s1) 0;flex-direction:row;gap:var(--s2);text-align:left}
.wday .emptyart svg{width:40px;height:40px;margin:0}
.wday .emptyart b{font-size:var(--fs-m)}

/* ---- Prüf-Chat ---- */
.chat{display:flex;flex-direction:column;gap:10px;max-height:460px;overflow:auto;padding:2px 2px 6px}
.msg{max-width:92%;padding:11px 14px;border-radius:16px;font-size:15px;line-height:1.45}
.msg.me{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:6px}
.msg.bot{align-self:flex-start;background:var(--sunk);border-bottom-left-radius:6px;display:flex;flex-direction:column;gap:8px;width:92%}
.msg.bot .what{font-weight:600}
.find{display:flex;gap:9px;align-items:flex-start;font-size:14.5px}
.find i{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:none;background:var(--ok)}
.find.warn i{background:var(--warn)}
.find.bad i{background:var(--danger)}
.find.info i{background:var(--faint)}
.msg.bot .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.chat-hint{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px}
.chat-hint button{border:0;background:var(--sunk);border-radius:999px;padding:5px 11px;font-size:13px;color:var(--muted)}
.typing{display:inline-flex;gap:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--faint);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{50%{opacity:.25}}

[hidden]{display:none !important}
/* ===== v9: Tageszeit-Stimmung, breite Ansicht, Befehlsleiste, Einrichtung ===== */
:root{--mood:#D9965E}
:root[data-daypart="morgen"]{--mood:#D9965E}
:root[data-daypart="tag"]{--mood:#4F8BD0}
:root[data-daypart="abend"]{--mood:#B0668E}
:root[data-daypart="nacht"]{--mood:#4C5596}
:root{--mood-ink:color-mix(in oklab, var(--mood) 72%, var(--ink))}
.top{background:color-mix(in oklab, color-mix(in oklab, var(--mood) 6%, var(--paper)) 88%, transparent);transition:background-color 1.2s}
:root[data-daypart="nacht"] .top{background:color-mix(in oklab, color-mix(in oklab, var(--mood) 12%, var(--paper)) 90%, transparent)}
.whero .eyebrow,.hero .eyebrow{color:var(--mood-ink)}
.sky{display:flex;flex-direction:column;align-items:stretch;gap:2px;min-width:180px;color:var(--mood-ink)}
.sky svg{width:200px;height:58px;overflow:visible}
.sky .arc{fill:none;stroke:color-mix(in oklab, var(--mood) 28%, transparent);stroke-width:1.5}
.sky .arc.done{stroke:var(--mood);stroke-width:2}
.sky .hz{stroke:color-mix(in oklab, var(--ink) 14%, transparent);stroke-width:1}
.sky .sun{fill:var(--mood)}
.sky .sun.off{fill:var(--surface);stroke:var(--mood);stroke-width:1.5}
.sky .lab{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.sky .lab b{font-family:var(--f-body, inherit);font-weight:var(--w-bold, 600);letter-spacing:.12em;text-transform:uppercase;font-size:10.5px;color:var(--mood-ink)}

.wide3{display:grid;grid-template-columns:minmax(0,1fr) 316px;gap:var(--s5);align-items:start}
.wide3 > .w-left{display:none}
@media (min-width:1600px){ .wide3{grid-template-columns:228px minmax(0,1fr) 316px} .wide3 > .w-left{display:flex} }
.w-left,.w-right{position:sticky;top:88px;display:flex;flex-direction:column;gap:var(--s4);max-height:calc(100vh - 104px);overflow:auto;scrollbar-width:none;padding-bottom:var(--s3)}
.w-left::-webkit-scrollbar,.w-right::-webkit-scrollbar{display:none}
.w-mid{min-width:0}
.mm-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.mm-h b{font-family:var(--f-display);font-size:var(--fs-lg, 20px);font-weight:400}
.mm-h .nv{display:flex;gap:2px}
.mm-h .nv button{border:0;background:none;color:var(--muted);width:28px;height:28px;border-radius:8px;display:grid;place-items:center}
.mm-h .nv button:hover{background:var(--sunk);color:var(--ink)}
.mm-h .nv svg{width:16px;height:16px}
.mm{display:grid;grid-template-columns:repeat(7,1fr);gap:2px 0}
.mm .wd{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);text-align:center;padding-bottom:4px;font-weight:600}
.mm-d{position:relative;border:0;background:none;color:var(--ink);font-family:var(--f-mono);font-size:12.5px;height:30px;display:grid;place-items:center;border-radius:9px;padding:0}
.mm-d:hover{background:var(--sunk)}
.mm-d.inwk{background:color-mix(in oklab, var(--mood) 9%, transparent);border-radius:0}
.mm-d.inwk.wkfirst{border-radius:9px 0 0 9px}.mm-d.inwk.wklast{border-radius:0 9px 9px 0}
.mm-d.out{color:var(--faint)}
.mm-d.hol{color:var(--gold, #916A18)}
.mm-d.today{color:var(--accent-ink);font-weight:700}
.mm-d.sel{background:var(--ink);color:var(--paper);border-radius:9px}
.mm-d i{position:absolute;bottom:3px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--c)}
.mm-d.sel i{background:var(--paper)}
.side-h{font-size:var(--fs-xs);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:var(--w-bold, 600);margin:0 0 8px}
.up{display:flex;gap:10px;align-items:baseline;width:100%;border:0;background:none;text-align:left;padding:7px 8px;margin:0 -8px;border-radius:10px;color:var(--ink);font-size:14px}
.up:hover{background:var(--sunk)}
.up .d{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);flex:none;width:44px}
.up .d.hot{color:var(--danger)}
.up .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk-head{display:flex;align-items:flex-end;gap:12px}
.pk-head .n{font-family:var(--f-display);font-size:56px;line-height:.85;font-weight:300;letter-spacing:-.04em;color:var(--dc, var(--ink))}
.pk-head .w{display:flex;flex-direction:column;gap:2px;padding-bottom:3px;min-width:0}
.pk-head .w b{font-family:var(--f-display);font-size:var(--fs-lg, 20px);font-weight:400}
.pk-head .w span{font-size:13px;color:var(--muted)}
.pk-head .wx{margin-left:auto;display:flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:13px;color:var(--muted);border:0;background:none;padding:0}
.pk-head .wx svg{width:28px;height:28px}
.pk-sleep{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);border:0;background:none;padding:0;text-align:left}
.pk-sleep b{color:var(--ink);font-family:var(--f-mono);font-weight:500}
.pk-sleep svg{width:14px;height:14px;vertical-align:-2px;margin-right:4px}
.pk-list{display:flex;flex-direction:column}
.pk-row{display:grid;grid-template-columns:46px 10px minmax(0,1fr);gap:10px;align-items:baseline;border:0;background:none;text-align:left;padding:8px;margin:0 -8px;border-radius:10px;color:var(--ink)}
.pk-row:hover{background:var(--sunk)}
.pk-row .tm{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.pk-row .dt{width:8px;height:8px;border-radius:50%;background:var(--c);align-self:center}
.pk-row.leg .dt{background:none;border:1.5px dashed var(--muted);width:6px;height:6px}
.pk-row.work .dt{background:none;border:2px solid var(--c);width:5px;height:5px}
.pk-row .ti{display:flex;flex-direction:column;min-width:0;font-size:15px}
.pk-row .ti small{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk-row.leg .ti{font-size:13.5px;color:var(--muted)}
.pk-row.tight .ti{color:var(--danger)}
.pk-row.past{opacity:.5}
.w-right .panel{padding:0;background:none;border:0}
.wk-h.peek{background:color-mix(in oklab, var(--mood) 10%, var(--surface))}
.wk-h.peek:not(.today) .dn{color:var(--mood-ink)}
.whero-t b span[data-count]{font-size:inherit;color:inherit}
.whero-c{flex-basis:100%}
.whero .sky{margin-left:auto}

.topcmd{display:flex;align-items:center;gap:10px;border:0;background:var(--sunk);border-radius:999px;padding:8px 8px 8px 14px;color:var(--muted);font-size:14px;min-width:250px;cursor:pointer}
.topcmd:hover{color:var(--ink)}
.topcmd span{flex:1;text-align:left}
.topcmd svg{width:17px;height:17px}
kbd{font-family:var(--f-mono);font-size:11px;padding:2px 7px;border-radius:6px;background:color-mix(in oklab, var(--ink) 7%, transparent);color:var(--muted);white-space:nowrap}
.sheet.cmdmode{place-items:start center;padding-top:12vh}
.sheet.cmdmode .card2{width:min(640px,100%);padding:0;border-radius:18px;box-shadow:none;border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column}
.cmd-in{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.cmd-in input{flex:1;border:0;background:none;font-size:19px;color:var(--ink);outline:none;min-width:0;font-family:inherit;padding:0}
.cmd-in > svg{width:20px;height:20px;color:var(--muted);flex:none}
.cmd-list{max-height:min(54vh,460px);overflow:auto;padding:6px 8px 8px}
.cmd-sec{font-size:var(--fs-xs);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding:12px 12px 4px;font-weight:var(--w-bold, 600)}
.cmd-it{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-radius:12px;color:var(--ink)}
.cmd-it .ic{width:32px;height:32px;display:grid;place-items:center;border-radius:10px;background:color-mix(in oklab, var(--c, var(--muted)) 13%, transparent);color:var(--c, var(--muted));flex:none}
.cmd-it .ic svg{width:18px;height:18px}
.cmd-it .tx{display:flex;flex-direction:column;min-width:0;flex:1}
.cmd-it .tx b{font-weight:500;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmd-it .tx small{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmd-it .go{opacity:0;color:var(--muted)}
.cmd-it.on{background:color-mix(in oklab, var(--accent) 11%, transparent)}
.cmd-it.on .go{opacity:1}
.cmd-empty{padding:28px 20px;color:var(--muted);text-align:center;font-size:14.5px}
.cmd-foot{display:flex;gap:18px;padding:10px 20px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);flex-wrap:wrap;align-items:center}
.cmd-foot .grow{flex:1}
@media (max-width:860px){
  .sheet.cmdmode{padding:10px;padding-top:max(12px, env(safe-area-inset-top,0px))}
  .sheet.cmdmode .card2{border-radius:18px;max-height:82vh;padding:0}
  .cmd-foot{display:none}
}
.sheet.onbmode .card2{width:min(520px,100%);padding:var(--s4);box-shadow:none}
.onb-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--s4)}
.onb-dots{display:flex;gap:6px}
.onb-dots i{width:26px;height:4px;border-radius:2px;background:var(--line);transition:background-color .3s}
.onb-dots i.on{background:var(--mood)}
.onb h2{font-size:var(--fs-xl, 32px);margin:6px 0 8px}
.onb p.lead{color:var(--muted);margin:0 0 var(--s3);font-size:15.5px;line-height:1.5}
.onb .art{color:var(--mood);margin-bottom:var(--s2)}
.onb .art svg{width:44px;height:44px}
.onb .frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:860px){ .sheet.onbmode .card2{padding:var(--s3) var(--s3) calc(var(--s3) + env(safe-area-inset-bottom,0px))} }
@media (prefers-reduced-motion: reduce){ .top,.whero{transition:none} }

/* ===== v10 HARMONIE: ein Faden, eine Stimme, eine Bewegung =====
   1 Tagesfaden oben in jeder Ansicht (Mood-Farbe = der Faden)
   2 Jede Ansicht beginnt mit einem Satz (.lead) in derselben Schrift
   3 Flach: keine getönten Kästen, Hinweise sind Zeilen mit Haarlinie
   4 Zwei Schriften: Serif für Stimme und Titel, Sans (tabellarische
     Ziffern) für alles andere. Keine Versalien-Etiketten.
   5 Eine Bewegungssprache: --ease, View Transitions mit Richtung     */
:root{--ease:cubic-bezier(.2,.8,.2,1);--ease-io:cubic-bezier(.65,0,.35,1);--d1:.14s;--d2:.24s;--d3:.4s;
  --f-mono:var(--f-body)}
:root[data-font="tech"]{--f-display:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace}
body{font-variant-numeric:tabular-nums}

/* Kopfzeile: ruhig, kein Kasten; Mood lebt nur im Faden */
.top,:root[data-daypart="nacht"] .top{background:color-mix(in oklab, var(--paper) 90%, transparent);border-bottom:1px solid transparent;transition:border-color var(--d2)}
.top.scrolled{border-bottom-color:var(--line)}

/* Der Tagesfaden */
.top .faden{flex-basis:100%;order:10;display:grid;grid-template-columns:auto minmax(0,1fr) auto minmax(0,auto);align-items:center;gap:12px;border:0;background:none;padding:4px 0 0;margin:0;color:var(--muted);font-size:12.5px;cursor:pointer;text-align:left}
.ftrack{position:relative;height:12px}
.ftrack::before{content:"";position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;background:var(--line);border-radius:1px}
.fdone{position:absolute;left:0;top:50%;height:2px;margin-top:-1px;background:var(--mood);border-radius:1px;transition:width 1.2s var(--ease)}
.fseg{position:absolute;top:50%;height:6px;margin-top:-3px;border-radius:3px;background:var(--c);transition:opacity var(--d3)}
.fseg.past{opacity:.32}
.fnow{position:absolute;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--mood);transition:left 1.2s var(--ease)}

  ::view-transition-group(*){animation-duration:var(--d3);animation-timing-function:var(--ease)}
  ::view-transition-old(root),::view-transition-new(root){animation-duration:var(--d2)}
  ::view-transition-old(ptitle),::view-transition-new(ptitle){height:100%;width:auto;object-fit:none;object-position:left center;animation-duration:var(--d2)}
  ::view-transition-old(main){animation:var(--d2) var(--ease) both vt-fade-out}
  ::view-transition-new(main){animation:var(--d3) var(--ease) both vt-rise}
  :root[data-dir="next"]::view-transition-old(main){animation:var(--d3) var(--ease) both vt-out-l}
  :root[data-dir="next"]::view-transition-new(main){animation:var(--d3) var(--ease) both vt-in-r}

  :root[data-dir="prev"]::view-transition-new(main){animation:var(--d3) var(--ease) both vt-in-l}
  :root[data-dir="out"]::view-transition-old(main){animation:var(--d3) var(--ease) both vt-zo-old}
  :root[data-dir="out"]::view-transition-new(main){animation:var(--d3) var(--ease) both vt-zo-new}
  :root[data-dir="in"]::view-transition-old(main){animation:var(--d3) var(--ease) both vt-zi-old}
