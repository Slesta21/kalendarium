/* ===== Schlafanalyse ===== */
.sl-head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--s3) var(--s4);align-items:center;margin-bottom:var(--s4)}
.sl-score{position:relative;width:132px;height:132px}
.sl-score svg{width:132px;height:132px;transform:rotate(-90deg)}
.sl-score .bg{fill:none;stroke:var(--line);stroke-width:9}
.sl-score .fg{fill:none;stroke:var(--sleep);stroke-width:9;stroke-linecap:round;transition:stroke-dasharray 1s var(--ease)}
.sl-score .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.sl-score .num b{font-family:var(--f-display);font-size:44px;font-weight:300;line-height:1}
.sl-score .num small{font-size:12.5px;color:var(--muted)}
.sl-parts{display:flex;flex-direction:column;gap:9px;min-width:0}
.sl-part{display:grid;grid-template-columns:minmax(130px,170px) minmax(0,1fr) 36px;gap:10px;align-items:center;font-size:14px}
.sl-part i{height:6px;border-radius:3px;background:var(--line);position:relative;overflow:hidden}
.sl-part i::after{content:"";position:absolute;inset:0 auto 0 0;width:var(--v);background:var(--pc, var(--sleep));border-radius:3px}
.sl-part b{font-variant-numeric:tabular-nums;text-align:right;font-weight:600}
.sl-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s3);margin:0 0 var(--s4);padding:var(--s3) 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.sl-kpi{display:flex;flex-direction:column;gap:2px;min-width:0}
.sl-kpi small{font-size:12.5px;color:var(--muted)}
.sl-kpi b{font-family:var(--f-display);font-size:28px;font-weight:400;line-height:1.1;font-variant-numeric:tabular-nums}
.sl-kpi span{font-size:12.5px;color:var(--muted)}
.sl-kpi span.bad{color:var(--danger)} .sl-kpi span.good{color:var(--ok)}
.sl-chart{width:100%;height:auto;display:block}
.sl-chart text{fill:var(--muted);font-family:var(--f-body)}
.sl-chart .grid{stroke:var(--line);stroke-width:1}
.sl-chart .plan{fill:none;stroke:color-mix(in oklab, var(--sleep) 55%, transparent);stroke-width:1.2;stroke-dasharray:3 3}
.sl-chart .act{fill:var(--sleep)}
.sl-chart .mid{fill:var(--paper);stroke:var(--sleep);stroke-width:1.5}
.sl-chart .we{fill:color-mix(in oklab, var(--sleep) 7%, transparent)}
.sl-chart .need{stroke:var(--ink);stroke-width:1;stroke-dasharray:4 4;opacity:.55}
.sl-chart .bar{fill:color-mix(in oklab, var(--sleep) 70%, transparent)}
.sl-chart .bar.short{fill:color-mix(in oklab, var(--danger) 60%, transparent)}
.sl-chart .fut{fill:none;stroke:color-mix(in oklab, var(--sleep) 60%, transparent);stroke-width:1.2;stroke-dasharray:3 3}
.sl-sec{margin:var(--s4) 0 var(--s2);display:flex;align-items:baseline;justify-content:space-between;gap:8px 10px;flex-wrap:wrap}
.sl-sec h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:var(--fs-l, 22px)}
.sl-sec small{color:var(--muted);font-size:13px}
.chrono{position:relative;height:34px;margin:6px 0 4px}
.chrono .track{position:absolute;left:0;right:0;top:14px;height:6px;border-radius:3px;background:var(--line)}
.chrono .track::before,.chrono .track::after{content:"";position:absolute;top:-4px;width:1px;height:14px;background:var(--faint)}
.chrono .track::before{left:46%}.chrono .track::after{left:62%}
.chrono .pin{background:var(--sleep)!important;width:12px!important;height:12px!important;border-radius:50%!important;top:11px!important;margin-left:-6px!important}
.chrono .pin{position:absolute;top:6px;width:4px;height:22px;margin-left:-2px;border-radius:2px;background:var(--ink)}
.chrono-l{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.sl-ins{display:flex;flex-direction:column}
.sl-ins .it{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.sl-ins .it:first-child{border-top:1px solid var(--line)}
.sl-ins .it svg{width:18px;height:18px;color:var(--sleep);margin-top:2px}
.sl-ins .it.warn svg{color:var(--warn)} .sl-ins .it.good svg{color:var(--ok)}
.sl-ins b{font-weight:600}
.sl-ins small{display:block;color:var(--muted);font-size:13.5px;margin-top:2px;line-height:1.45}
.sl-tags{display:grid;grid-template-columns:minmax(0,1fr) 120px 48px;gap:6px 12px;align-items:center;font-size:14px}
.sl-tags i{height:6px;border-radius:3px;background:var(--line);position:relative}
.sl-tags i::after{content:"";position:absolute;top:-3px;width:2px;height:12px;left:var(--z);background:var(--muted)}
.sl-tags i em{position:absolute;top:0;height:6px;border-radius:3px;left:min(var(--z),var(--p));width:calc(max(var(--z),var(--p)) - min(var(--z),var(--p)));background:var(--pc)}
.sl-tags b{text-align:right;font-variant-numeric:tabular-nums}
.sl-log{display:flex;flex-direction:column}
.sl-log button{display:grid;grid-template-columns:90px minmax(0,1fr) auto;gap:10px;align-items:center;border:0;background:none;text-align:left;padding:10px 2px;border-bottom:1px solid var(--line);color:var(--ink);font-size:14px}
.sl-log button:hover{background:color-mix(in oklab, var(--ink) 3%, transparent)}
.sl-log .q{display:flex;gap:3px}.sl-log .q i{width:7px;height:7px;border-radius:50%;background:var(--line)}.sl-log .q i.on{background:var(--sleep)}
.seg.sq{display:flex;flex-wrap:wrap}.seg.sq button{flex:1}
.morning{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center}
.morning .acts{grid-column:1 / -1;display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:860px){ .sl-sec .seg{flex-basis:100%;display:flex} .sl-sec .seg button{flex:1} .sl-head{grid-template-columns:1fr;justify-items:center} .sl-parts{width:100%} .sl-kpis{grid-template-columns:repeat(2,minmax(0,1fr))} .sl-tags{grid-template-columns:minmax(0,1fr) 80px 44px} }

/* Schlaf, ruhige Fassung */
.sx-hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--s4);align-items:center;margin:0 0 var(--s4)}
.sx-score{display:flex;flex-direction:column;align-items:flex-start;min-width:96px}
.sx-score b{font-family:var(--f-display);font-size:76px;line-height:.9;font-weight:300;color:var(--sleep);letter-spacing:-.03em}
.sx-score span{font-size:14px;color:var(--muted);margin-top:4px}
.sx-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s3);padding:var(--s3) 0;margin-bottom:var(--s3);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.sx-stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.sx-stat span{font-size:13px;color:var(--muted)}
.sx-stat b{font-family:var(--f-display);font-size:28px;font-weight:400;line-height:1.15;font-variant-numeric:tabular-nums}
.sx-stat small{font-size:13px;color:var(--muted)}
.sx-stat small.bad{color:var(--danger)} .sx-stat small.good{color:var(--ok)}
.sx-tips{display:flex;flex-direction:column;gap:var(--s2);margin-bottom:var(--s3)}
.sx-tip{display:grid;grid-template-columns:22px minmax(0,1fr);gap:12px;align-items:start}
.sx-tip svg{width:20px;height:20px;color:var(--sleep);margin-top:1px}
.sx-tip.warn svg{color:var(--warn)}
.sx-tip b{font-weight:600;font-size:15px}
.sx-tip small{display:block;color:var(--muted);font-size:14px;line-height:1.5;margin-top:2px;max-width:62ch}
.sx-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:var(--s4) 0 var(--s2)}
.sx-h h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:var(--fs-l, 22px)}
.sx-h .seg button{padding:5px 12px}
.sl-chart .act{fill:var(--sleep)}
.sl-chart .plan{fill:none;stroke:color-mix(in oklab, var(--sleep) 45%, transparent);stroke-width:1.2;stroke-dasharray:none}
.sl-chart .fut{fill:color-mix(in oklab, var(--sleep) 10%, transparent);stroke:color-mix(in oklab, var(--sleep) 45%, transparent);stroke-width:1.2;stroke-dasharray:4 3}
.sl-chart .shortt{fill:var(--danger)}
.sl-chart .grid{stroke:color-mix(in oklab, var(--line) 70%, transparent)}
.sx-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:6px}
.sx-legend span{display:inline-flex;align-items:center;gap:6px}
.sx-legend i{width:16px;height:8px;border-radius:4px;display:inline-block}
.sx-legend i.a{background:var(--sleep)} .sx-legend i.p{border:1.2px solid color-mix(in oklab, var(--sleep) 45%, transparent)} .sx-legend i.w{background:color-mix(in oklab, var(--sleep) 9%, transparent);border-radius:2px}
.sx-log{display:flex;flex-direction:column}
.sx-log button{display:grid;grid-template-columns:minmax(80px,110px) minmax(0,1fr) auto auto;gap:14px;align-items:center;border:0;background:none;text-align:left;padding:11px 2px;border-bottom:1px solid var(--line);color:var(--ink);font-size:14.5px;font-variant-numeric:tabular-nums}
.sx-log button:hover{background:color-mix(in oklab, var(--ink) 3%, transparent)}
.sx-log .d{color:var(--muted)}
.sx-log .q{display:flex;gap:3px}.sx-log .q i{width:6px;height:6px;border-radius:50%;background:var(--line)}.sx-log .q i.on{background:var(--sleep)}
.sx-more{margin-top:var(--s3)}
.sx-more summary{cursor:pointer;color:var(--accent-ink);font-weight:500;font-size:14.5px;padding:8px 0;list-style:none}
.sx-more summary::-webkit-details-marker{display:none}
.sx-more summary::after{content:" ›";display:inline-block;transition:transform var(--d2) var(--ease)}
.sx-more[open] summary::after{transform:rotate(90deg)}
.sx-parts{display:flex;flex-direction:column;gap:8px;margin:6px 0 var(--s2)}
.sx-parts div{display:grid;grid-template-columns:170px minmax(0,1fr) 32px;gap:10px;align-items:center;font-size:14px}
.sx-parts i{height:5px;border-radius:3px;background:var(--line);position:relative;overflow:hidden}
.sx-parts i::after{content:"";position:absolute;inset:0 auto 0 0;width:var(--v);background:var(--sleep);border-radius:3px}
.sx-parts b{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.sx-p{font-size:14px;line-height:1.55;margin:0 0 10px;max-width:68ch}
@media (max-width:860px){ .sx-hero{grid-template-columns:1fr;gap:var(--s2)} .sx-score{flex-direction:row;align-items:baseline;gap:12px} .sx-score b{font-size:64px} .sx-stat b{font-size:22px} .sx-stats{gap:var(--s2)} .sx-log button{grid-template-columns:96px minmax(0,1fr) auto;gap:8px;white-space:nowrap} .sx-log .q{display:none} .sx-parts div{grid-template-columns:120px minmax(0,1fr) 30px} }

function wxKind(icon, night){
  const i = +icon;
  if (i === 1 || i === 2) return 'sun';
  if (i >= 3 && i <= 5) return 'partsun';
  if ([6,7,8,38].includes(i)) return 'cloud';
  if (i === 11) return 'fog';
  if ([12,18,26].includes(i)) return 'rain';
  if ([13,14,39,40].includes(i)) return 'showers';
  if ([15,16,17,41,42].includes(i)) return 'storm';
  if ([19,20,21,22,23,24,43,44].includes(i)) return 'snow';
  if ([25,29].includes(i)) return 'sleet';
  if (i === 30) return 'hot'; if (i === 31) return 'cold'; if (i === 32) return 'wind';
  if (i === 33 || i === 34) return 'moon';
  if (i >= 35 && i <= 37) return 'partmoon';
  return night ? 'moon' : 'partsun';
}

    body += `<button class="travel${l.tight?' tight':''}" style="top:${y(l.depart)}px;height:${h}px" data-act="travelInfo" data-date="${ymd(date)}" data-i="${i}">${ic('weg','s')}<span>${label}</span></button>`;
  });
  for (const L of layoutLanes(timed.map(o => ({o, start:o.start, end:o.end})))) {
    const o = L.o, w = 100 / L.lanes, pos = `left:calc(${L.lane*w}% + 8px);width:calc(${w}% - 16px);right:auto`;
    const top = y(o.start), h = Math.max(26, (o.end - o.start)/3600000*PX - 3);
    const solid = o.kind === 'course' || o.bb || o.ba, bc = solid ? 'buf block' : 'buf';
    if (o.bb) body += `<div class="${bc}" style="--c:${o.cat.color};top:${top - o.bb/60*PX}px;height:${o.bb/60*PX + 8}px;${pos}"></div>`;
    if (o.ba) body += `<div class="${bc}" style="--c:${o.cat.color};top:${top + h - 8}px;height:${Math.max(0, o.ba/60*PX + 8)}px;${pos}"></div>`;
    const pl = placeLabel(o);
    body += `<button class="ev${solid ? ' solid' : ''}${isClash(o) ? ' clash' : ''}${o.kind === 'work' ? ' work' : ''}${h < 46 ? ' short' : ''}${o.end < now ? ' past' : ''}" style="--c:${o.cat.color};top:${top}px;height:${h}px;${pos}" data-key="${esc(o.key)}" data-act="detail" data-kind="${o.kind}" data-id="${o.id}" data-date="${ymd(o.start)}" ${isDraggable(o)?'data-drag="1"':''}>
      <b>${esc(o.kind==='course' ? (o.ref.short||o.ref.title) + ' · ' + (COURSE_TYPES[o.ref.type]||'') : o.title)}</b>
      <span class="m"><span class="mono">${hm(o.start)}–${hm(o.end)}</span>${pl?`<span>${esc(pl)}</span>`:''}</span><span class="wm" aria-hidden="true">${sy(o.kind === 'work' ? (o.ref.exam ? 'buch' : 'feder') : o.cat.symbol)}</span></button>`;
  }
  for (const k of plan.links) {
    if (k.overlap) body += `<div class="gap" style="top:${y(k.b.start)}px"><span style="color:var(--danger)">Überschneidung</span></div>`;
    else if (k.back2back) body += `<div class="gap" style="top:${y(k.a.end) + k.gap/120*PX}px"><span>${k.gap ? k.gap + ' min Pause' : 'direkt im Anschluss'}${k.same?' · bleib vor Ort':''}</span></div>`;
  }
  if (sameDay(date, now) && now.getHours() >= h0 && now.getHours() < h1) body += `<div class="marker now" style="top:${y(now)}px" data-now-anchor><span>${hm(now)}</span></div>`;
  if (!timed.length) body += `<div class="tl-empty">${emptyArt('frei', 'Ein freier Tag.', 'Tippe auf eine Stunde, um etwas einzutragen.')}</div>`;
  const alld = allday.map(o => `<button class="pill" style="--c:${o.cat.color}" data-act="detail" data-kind="${o.kind}" data-id="${esc(o.id)}" data-date="${ymd(o.start)}">${o.kind==='deadline'?`${sy('flagge')}<span class="mono">${hm(o.start)}</span>`:sy(o.cat.symbol)} ${esc(o.title)}</button>`).join('');
  return `<div class="tl" style="--hour:${PX}px">${alld?`<div class="tl-allday">${alld}</div>`:''}<div class="tl-rail">${rail}</div><div class="tl-body" style="height:${H*PX}px" data-act="gridAdd" data-date="${ymd(date)}" data-h0="${h0}" data-px="${PX}">${body}</div></div>`;
}

const VIEWS = {
  /* ---------- KALENDER: ein Tab mit Tag · Woche · Monat · Jahr ---------- */
  kalender(){
    if (ui.mode === 'woche') return VIEWS.woche();
    if (ui.mode === 'monat') return VIEWS.monat();
    if (ui.mode === 'jahr') return VIEWS.jahr();
    return dayDashboard(ui.cursor);
  },

  /* ---------- WOCHE ---------- */
  woche(){
    const s = state.settings, ws = startOfWeek(ui.cursor, s.weekStart);
    let days = Array.from({length:7}, (_,i) => addDays(ws,i));
    if (!s.showWeekend) days = days.filter(d => isoDow(d) <= 5);
    else if (s.hideEmptyWeekend) days = days.filter(d => isoDow(d) <= 5 || dayItems(d).some(o => o.kind !== 'holiday'));
    const short = (workPlan()._short || []).map(x => `<div class="notice warn">${ic('aufgaben')}<span><b>${esc(x.d.title)}:</b> Für ${dur(x.missing)} Arbeit ist vor der Frist kein Platz mehr. Plane Zeit frei oder verschiebe etwas.</span></div>`).join('');
    const mid = weekHero(days) + layersBar() + (short ? `<div class="notices">${short}</div>` : '') + weekGrid(days) + weekReview(days);
    if (!isWide()) return mid;
    return `<div class="wide3"><aside class="w-left" aria-label="Monatsübersicht">${miniMonth()}${sideUpcoming()}</aside><div class="w-mid">${mid}</div><aside class="w-right" aria-label="Ausgewählter Tag">${dayPeek(days)}</aside></div>`;
  },

  /* ---------- SCHLAF: ruhig, das Wichtigste zuerst, Details auf Wunsch ---------- */
  schlaf(){
    const days = ui.sleepRange || 7, st = sleepStats(days), P = sleepPlan(), t0 = startOfDay(new Date()), tn = P[ymd(addDays(t0, 1))];
    const short = st.durAvg != null ? st.need - st.durAvg : null, enough = st.N >= 3;
    const verdict = st.score == null ? '' : st.score >= 85 ? 'Sehr gut' : st.score >= 70 ? 'Gut' : st.score >= 55 ? 'Ausbaufähig' : 'Unruhig';
    const ins = sleepInsights(st).filter(x => x.lvl !== 'good').slice(0, 2);
    const tips = ins.length ? ins : sleepInsights(st).slice(0, 1);
    const tonight = tn ? `Heute Nacht ins Bett um <button class="ln" data-act="sleepInfo" data-date="${ymd(addDays(t0, 1))}">${hm(tn.bed)}</button>, Wecker ${hm(tn.wake)}.` : '';
    const stat = (lbl, val, sub, cls = '') => `<div class="sx-stat"><span>${lbl}</span><b>${val}</b><small class="${cls}">${sub}</small></div>`;
    const regTxt = st.sri != null ? (st.sri >= 80 ? 'sehr regelmäßig' : st.sri >= 70 ? 'regelmäßig' : 'schwankt') : st.sdBed != null ? (st.sdBed < 30 ? 'regelmäßig' : 'schwankt') : '';
    const log = (state.sleepLog || []).slice().sort((a, b) => b.date.localeCompare(a.date));
    const logRow = x => { const n = sleepNight(x); return `<button data-act="sleepLog" data-date="${x.date}"><span>${esc(fmtShort(parseYMD(x.date)))}</span><span>${x.bed} – ${x.wake}</span><span class="d">${fmtH(n.dur)}</span><span class="q">${[1,2,3,4,5].map(k => `<i class="${k <= x.q ? 'on' : ''}"></i>`).join('')}</span></button>`; };
    return `
      <section class="sx-hero">
        <div class="sx-score">${enough ? `<b data-count="${st.score}">${st.score}</b><span>${verdict}</span>` : `<b>–</b><span>noch keine Werte</span>`}</div>
        <p class="lead" style="margin:0">${enough ? `Im Schnitt <b>${fmtH(st.durAvg)}</b> Schlaf${short > 15 ? `, <b class="hot">${dur(Math.round(short))} zu wenig</b>` : short < -15 ? ', etwas mehr als nötig' : ', genau richtig'}. ` : 'Trag ein paar Nächte ein, dann entsteht hier deine Auswertung. '}${tonight}</p>
      </section>
      ${enough ? `<div class="sx-stats">
        ${stat('Schlaf pro Nacht', fmtH(st.durAvg), `Bedarf ${fmtH(st.need)}`, short > 15 ? 'bad' : 'good')}
        ${stat('Rhythmus', st.sri != null ? String(st.sri) : st.sdBed != null ? `±${Math.round(st.sdBed)} min` : '–', regTxt, regTxt === 'schwankt' ? 'bad' : 'good')}
        ${stat('Wochenende', st.sjl != null ? `+${fmtH(st.sjl)}` : '–', st.sjl == null ? 'später' : st.sjl > 90 ? 'zu viel Verschiebung' : 'im Rahmen', st.sjl > 90 ? 'bad' : 'good')}
      </div>` : ''}
      ${tips.length ? `<div class="sx-tips">${tips.map(x => `<div class="sx-tip ${x.lvl}">${ic(x.icon)}<div><b>${esc(x.t)}</b><small>${esc(x.sub)}</small></div></div>`).join('')}</div>` : ''}
      <div class="sx-h"><h2>Nächte</h2><div class="seg" role="group" aria-label="Zeitraum">${[[7,'7'],[14,'14'],[30,'30']].map(([v,l]) => `<button data-act="sleepRange" data-v="${v}" aria-pressed="${days === v}">${l}</button>`).join('')}</div></div>
      ${sleepNightsChart(st)}
      <div class="sx-h"><h2>Protokoll</h2><button class="btn sm primary" data-act="sleepLog" data-date="${ymd(t0)}">${ic('plus','s')}Nacht eintragen</button></div>
      <div class="sx-log">${log.length ? log.slice(0, 5).map(logRow).join('') : emptyArt('frei', 'Noch keine Nacht eingetragen.', 'Am besten morgens kurz nach dem Aufstehen.')}</div>
      ${log.length > 5 ? `<details class="sx-more"><summary>Alle ${log.length} Nächte</summary><div class="sx-log">${log.slice(5).map(logRow).join('')}</div></details>` : ''}
      ${enough ? `<details class="sx-more"><summary>Details zur Auswertung</summary>
        <div class="sx-parts">${st.parts.map(p => `<div><span>${p.l}</span><i style="--v:${p.v}%"></i><b>${p.v}</b></div>`).join('')}</div>
        ${st.msfsc != null ? `<p class="sx-p"><b>Chronotyp:</b> ${chronoLabel(st.msfsc)}. Deine Schlafmitte an freien Tagen liegt bei ${fmtMid(st.msfsc)}${st.msw != null ? `, unter der Woche bei ${fmtMid(st.msw)}` : ''}.</p>` : ''}
        ${st.sri != null ? `<p class="sx-p"><b>Rhythmus ${st.sri}:</b> Wahrscheinlichkeit, zur selben Uhrzeit im selben Zustand zu sein wie am Vortag (Sleep Regularity Index, −100 bis 100). Über 80 ist sehr regelmäßig.</p>` : ''}
        ${st.tagFx.length ? `<p class="sx-p"><b>Einflüsse auf die Erholung (1 bis 5):</b> ${st.tagFx.map(f => `${esc(f.l)} ${f.with.toFixed(1).replace('.', ',')} statt ${f.without.toFixed(1).replace('.', ',')}`).join(' · ')}.</p>` : ''}
        <p class="sx-p faint">Berechnet aus deinen Einträgen nach SRI (Phillips 2017) und MCTQ (Roenneberg). Kein Ersatz für eine ärztliche Untersuchung.</p>
      </details>` : ''}`;
  },

  /* ---------- MONAT ---------- */
  monat(){
    const now = new Date(), c = ui.cursor, first = new Date(c.getFullYear(), c.getMonth(), 1);
    const gs = startOfWeek(first, state.settings.weekStart), occ = occurrences(gs, addDays(gs, 42));
    const heads = Array.from({length:7}, (_,i) => `<div class="mo-h">${WD_SHORT[isoDow(addDays(gs,i))-1]}</div>`).join('');
    const cells = Array.from({length:42}, (_,i) => {
      const d = addDays(gs,i), its = occ.filter(o => sameDay(o.start, d)), hol = its.filter(o => o.kind === 'holiday'), rest = its.filter(o => o.kind !== 'holiday');
      const dw = wxDay(d), isHol = hol.some(h => h.ref.kind === 'holiday');
      const tint = d.getMonth() === c.getMonth() ? dayTint(d) : {cls:'', style:''};
      return `<button class="mo-d${d.getMonth()!==c.getMonth()?' out':''}${sameDay(d,now)?' today':''}${isHol?' hol':''}${tint.cls}" style="${tint.style}" data-act="openDay" data-date="${ymd(d)}" aria-label="${fmtLong(d)}, ${rest.length} Einträge">
        <span class="n"><span class="d">${d.getDate()}</span>${dw?`<span class="wx">${wi(dw.icon,'sm')}<span>${tC(dw.hi)}</span></span>`:''}</span>
        ${(() => { const b = state.settings.sleep.on && sleepPlan()[ymd(addDays(d,1))]; return b && d.getMonth() === c.getMonth() ? `<span class="bed hide-m">${ic('mond','s')}${hm(b.bed)}</span>` : ''; })()}
        ${hol.slice(0,1).map(h => `<span class="hn">${esc(h.title)}</span>`).join('')}
        ${rest.slice(0,3).map(o => `<span class="li" style="--c:${o.cat.color}"><i></i>${!o.allDay?`<span class="mono">${hm(o.start)}</span>`:''}${esc(o.title)}</span>`).join('')}
        ${rest.length>3?`<span class="more">+${rest.length-3} weitere</span>`:''}
        <span class="dotrow">${[...hol.filter(h => h.ref.kind === 'holiday'), ...rest].slice(0,6).map(o => `<i style="--c:${o.cat.color}"></i>`).join('')}</span></button>`;
    }).join('');
    return `<div class="mo">${heads}${cells}</div>`;
  },

  /* ---------- JAHR ---------- */
  jahr(){
    const y = ui.cursor.getFullYear(), now = new Date(), ws = state.settings.weekStart;
    const load = {}; occurrences(new Date(y,0,1), new Date(y+1,0,1), {extras:false}).forEach(o => { const k = ymd(o.start); load[k] = (load[k]||0) + 1; });
    const hl = holidaysFor(y).filter(h => h.kind === 'holiday'), hol = new Set(hl.map(h => h.date));
    const heads = Array.from({length:7}, (_,i) => `<span>${WD_SHORT[(i + (ws===1?0:6)) % 7][0]}</span>`).join('');
    const months = Array.from({length:12}, (_,m) => {
      const first = new Date(y, m, 1), off = (first.getDay() - ws + 7) % 7, len = new Date(y, m+1, 0).getDate();
      const cells = '<span></span>'.repeat(off) + Array.from({length:len}, (_,i) => {
        const d = new Date(y, m, i+1), k = ymd(d), l = Math.min(4, load[k]||0);
        const tint = load[k] ? dayTint(d) : {cls:'', style:''};
        return `<button class="${hol.has(k)?'hol ':''}${sameDay(d,now)?'today ':''}${isoDow(d)>=6?'we ':''}${examPhase(d)?'exam ':''}${inBreak(d)?'brk ':''}${tint.cls}" style="--load:${l*14};${tint.style}" data-act="openDay" data-date="${k}" title="${fmtLong(d)}${load[k]?' · '+load[k]+' Einträge':''}">${i+1}</button>`;
      }).join('');
      return `<div class="ym${now.getFullYear()===y&&now.getMonth()===m?' cur':''}"><h3 data-act="openMonth" data-m="${m}">${MONTHS[m]}</h3><div class="ymg">${heads}${cells}</div></div>`;
    }).join('');
    return `<div class="yr">${months}</div>
      <div class="legend"><span><i style="background:var(--sleep-soft)"></i>Vorlesungsfrei</span><span><i style="background:color-mix(in oklab, var(--danger) 16%, var(--surface))"></i>Prüfungsphase</span><span><i style="box-shadow:inset 0 0 0 1.5px var(--gold)"></i>Feiertag</span><span><i style="background:color-mix(in oklab, var(--accent) 20%, transparent)"></i>Tagesfarbe nach Terminen</span></div>
      <div class="group-h"><h3>Gesetzliche Feiertage ${y} · ${esc(REGIONS[state.settings.holidayRegion]||'')}</h3></div>
      <section class="panel" style="padding:6px 18px">${hl.map(h => `<div class="row-item"><span style="color:var(--gold);display:flex">${ic('feiertag','s')}</span><div class="main" data-act="openDay" data-date="${h.date}"><div class="ti"><span>${esc(h.name)}</span></div></div><span class="num muted">${fmtShort(parseYMD(h.date))}</span></div>`).join('') || '<div class="empty">Keine Region gewählt.</div>'}</section>`;
  },

  /* ---------- FRISTEN & TO-DOS ---------- */
  aufgaben(){
    const now = new Date(), t0 = startOfDay(now);
    const list = state.deadlines.filter(d => ui.fcat === 'all' || d.catId === ui.fcat);
    const groups = [
      {id:'over', label:'Überfällig', f:d => !d.done && at(d.date,d.time||'23:59') < now},
      {id:'today', label:'Heute', f:d => !d.done && at(d.date,d.time||'23:59') >= now && sameDay(parseYMD(d.date), now)},
      {id:'week', label:'Nächste 7 Tage', f:d => !d.done && parseYMD(d.date) > t0 && parseYMD(d.date) < addDays(t0,8)},
      {id:'later', label:'Später', f:d => !d.done && parseYMD(d.date) >= addDays(t0,8)},
      {id:'done', label:'Erledigt', f:d => d.done}
    ];
    const sorted = list.slice().sort((a,b) => at(a.date,a.time||'23:59') - at(b.date,b.time||'23:59') || (b.priority||1)-(a.priority||1));
    const chips = [`<button class="chip" data-act="fcat" data-v="all" aria-pressed="${ui.fcat==='all'}">Alle</button>`].concat(state.categories.filter(c => state.deadlines.some(d => d.catId === c.id)).map(c => `<button class="chip" style="--c:${c.color}" data-act="fcat" data-v="${esc(c.id)}" aria-pressed="${ui.fcat===c.id}"><span class="sw"></span>${esc(c.name)}</button>`)).join('');
    const body = groups.map(g => {
      if (g.id === 'done' && !ui.showDone) return '';
      let items = sorted.filter(g.f); if (!items.length) return '';
      if (g.id === 'done') items = items.reverse();
      return `<div class="group-h${g.id==='over'?' over':''}"><h3>${g.label}</h3><span class="faint num">${items.length}</span></div><section class="panel" style="padding:4px 18px">${items.map(d => deadlineRow(d, now)).join('')}</section>`;
    }).join('');
    const open = state.todos.filter(t => !t.done).sort((a,b) => (a.date||'9') < (b.date||'9') ? -1 : 1), done = state.todos.filter(t => t.done);
    return `<div class="grid2">
      <div>
        <div class="toolbar"><h2 class="h2">Fristen</h2><div class="chips"><button class="chip" data-act="toggleShowDone" aria-pressed="${ui.showDone}">Erledigte</button><button class="btn primary sm" data-act="newDeadline">${ic('plus','s')}Frist</button></div></div>
        <div class="chips" style="margin-bottom:14px">${chips}</div>
        ${body || emptyArt('flagge', 'Keine offenen Fristen.', 'Abgaben, Kündigungen, Anmeldungen, Rechnungen: alles mit Datum gehört hierher.')}
      </div>
      <div>
        <div style="margin-bottom:36px">${habitsPanel(startOfDay(new Date()))}</div>
        <div class="toolbar"><h2 class="h2">To-dos</h2></div>
        <section class="panel">
          ${open.map(todoRow).join('') || emptyArt('liste', 'Alles erledigt.', 'Neue To-dos schreibst du einfach unten hinein.')}
          <form class="todo-add" data-form="todo"><input name="text" placeholder="Neues To-do" autocomplete="off" aria-label="Neues To-do"><button class="btn sm" type="submit" aria-label="Hinzufügen">${ic('plus','s')}</button></form>
          ${done.length?`<div class="group-h" style="margin-top:18px"><h3>Erledigt</h3><button class="btn ghost sm" data-act="clearTodos">Leeren</button></div>${done.slice(-8).map(todoRow).join('')}`:''}
        </section>
      </div></div>`;
  },

  /* ---------- STUNDENPLAN ---------- */
  stundenplan(){
    const now = new Date(), sem = state.semester, sr = semesterRange();
    let prog = '';
    if (sr) { const total = sr.end - sr.start, pct = Math.round(clamp(now - sr.start, 0, total)/total*100), wl = Math.max(0, Math.ceil((sr.end - now)/(7*86400000)));
      prog = `<div class="semprog"><div class="track"><i style="width:${pct}%"></i></div><div class="lbl"><span class="num">${parseYMD(sem.start).toLocaleDateString(DE)}</span><span>${now < sr.start ? 'beginnt bald' : now >= sr.end ? 'beendet' : `noch ${wl} Wochen`}</span><span class="num">${parseYMD(sem.end).toLocaleDateString(DE)}</span></div></div>`; }
    const days = state.courses.some(c => +c.day === 6) ? 6 : 5;
    const courses = [...state.courses].sort((a,b) => a.day - b.day || minutesOf(a.start) - minutesOf(b.start));
    return `<section class="panel" style="margin-bottom:18px"><div class="sem"><div><div class="eyebrow">Semester</div><div class="big">${esc(sem.name || 'Noch nicht festgelegt')}</div></div>${prog || '<span class="muted">Beginn und Ende festlegen, damit Kurse nur in der Vorlesungszeit erscheinen.</span>'}<button class="btn sm" data-act="editSemester">${ic('stift','s')}Bearbeiten</button></div></section>
      ${state.courses.length ? `<div class="scroller" style="margin-bottom:22px">${ttGrid(days)}</div>` : ''}
      <div class="toolbar"><h2 class="h2">Kurse</h2><div class="chips"><button class="btn sm" data-act="importIcsPrompt">${ic('hoch','s')}ICS importieren</button><button class="btn primary sm" data-act="newCourse">${ic('plus','s')}Kurs</button></div></div>
      ${courses.length ? `<div class="cards">${courses.map(c => { const cat = catById(c.catId); return `<button class="card" style="--c:${cat.color}" data-act="edit" data-kind="course" data-id="${c.id}"><span class="sym">${sy(cat.symbol)}</span><span style="min-width:0"><b>${esc(c.title)}</b><small>${WD_SHORT[c.day-1]} <span class="num">${esc(c.start)}–${esc(c.end)}</span> · ${COURSE_TYPES[c.type]||c.type}${c.weeks!=='all'?` · ${c.weeks==='odd'?'ungerade':'gerade'} KW`:''}${c.room?` · ${esc(c.room)}`:''}</small></span></button>`; }).join('')}</div>`
        : emptyArt('buch', 'Noch keine Kurse.', 'Tippe auf einen freien Block oder importiere den Stundenplan als ICS aus MOSES.')}
      <p class="note" style="margin-top:16px">Jeder Block dauert 2 Stunden: 90 min Lehrveranstaltung mit je 15 min Puffer. Freie Blöcke antippen, um dort einen Kurs anzulegen. Kurse fallen an Feiertagen und in vorlesungsfreien Zeiten automatisch aus.</p>`;
  },

  /* ---------- WETTER ---------- */
  wetter(){
    const cities = state.settings.weather.cities, act = WX.activeKey(), c = WX.cur(), now = new Date();
    const chips = cities.map(x => `<button class="chip" data-act="wxCity" data-key="${esc(x.key)}" aria-pressed="${x.key===act}">${esc(x.name)}</button>`).join('') + `<button class="chip" data-act="go" data-v="einstellungen">${ic('plus','s')}Ort</button>`;
    if (!c) return `<div class="citychips">${chips}</div>${wxStatusNote() || `<div class="panel empty"><b>Wetter wird geladen …</b>${WX.provider === 'om' ? 'Daten von Open-Meteo.' : 'Beim ersten Mal fragt die Seite, ob sie AccuWeather verwenden darf.'}</div>`}`;
    const h = wxAt(now), d0 = c.daily && c.daily[0], all = c.daily || [];
    const hours = (c.hourly||[]).map(x => { const t = new Date(x.t); return `<button data-act="wxHour" data-t="${x.t}"><span class="h">${sameDay(t,now)?'':WD_SHORT[isoDow(t)-1]+' '}${pad(t.getHours())}</span>${wi(x.icon,'',!x.day)}<span class="t">${tC(x.temp)}</span><span class="p">${x.precip>=10?Math.round(x.precip)+'%':''}</span></button>`; }).join('');
    const lo = Math.min(...all.map(x => x.lo)), hi = Math.max(...all.map(x => x.hi)), span = Math.max(1, hi - lo);
    const daysHtml = all.map(x => { const d = parseYMD(x.date); return `<button class="dayrow" data-act="wxDay" data-date="${x.date}"><span><b>${dayLabel(d)}</b> <span class="muted num">${d.getDate()}.${d.getMonth()+1}.</span></span>${wi(x.icon)}<span class="ph">${esc(x.phrase)}</span><span class="num" style="color:var(--accent-ink)">${x.precip>=10?x.precip+'%':''}</span><span style="display:flex;align-items:center;gap:8px;min-width:0"><span class="num muted">${tC(x.lo)}</span><span class="rng"><i style="left:${(x.lo-lo)/span*100}%;right:${100-(x.hi-lo)/span*100}%"></i></span><span class="num">${tC(x.hi)}</span></span></button>`; }).join('');
    return `<div class="citychips">${chips}</div>
      ${h ? `<section class="wxhero">${wi(h.icon,'xl',!h.day)}<div class="t">${tC(h.temp)}</div><div><div class="ph">${esc(h.phrase||'')}</div><div class="muted">gefühlt ${tC(h.feel ?? h.temp)}${d0?` · heute ${tC(d0.hi)} / ${tC(d0.lo)}`:''}</div></div>
        <div class="facts">${h.wind?`<span>Wind</span><b>${esc(h.wind)}</b>`:''}${h.humidity?`<span>Luftfeuchte</span><b>${esc(h.humidity)}</b>`:''}<span>Regenrisiko</span><b>${Math.round(h.precip||0)} %</b>${d0&&d0.uv?`<span>UV</span><b>${esc(d0.uv)}</b>`:''}</div></section>` : ''}
      <div class="group-h"><h3>Nächste 12 Stunden</h3></div>
      <div class="hours">${hours || '<span class="muted">Keine Stundenwerte.</span>'}</div>
      <div class="group-h"><h3>10 Tage</h3><span class="faint" style="font-size:12px">Stand ${c.at ? hm(new Date(c.at)) : ''} · ${WX.src()}</span></div>
      <section class="panel" style="padding:4px 18px">${daysHtml}</section>`;
  },

  /* ---------- LINKS ---------- */
  links(){
    const groups = Object.entries(LINK_GROUPS).map(([g, label]) => {
      const items = state.links.filter(l => (l.group||'other') === g); if (!items.length) return '';
      return `<div class="group-h"><h3>${label}</h3></div><div class="cards">${items.map(l => `<div style="position:relative;min-width:0"><a class="card" href="${esc(safeUrl(l.url))}" target="_blank" rel="noopener"><span class="sym">${sy(l.symbol||'kreis')}</span><span style="min-width:0;padding-right:36px"><b>${esc(l.label)}</b><small class="mono">${esc(hostOf(safeUrl(l.url)))}</small></span></a><button class="iconbtn" style="position:absolute;top:12px;right:8px" data-act="edit" data-kind="link" data-id="${l.id}" aria-label="${esc(l.label)} bearbeiten">${ic('stift','s')}</button></div>`).join('')}</div>`;
    }).join('');
    const cl = state.courses.filter(c => safeUrl(c.link));
    return `<div class="toolbar"><span></span><button class="btn primary sm" data-act="newLink">${ic('plus','s')}Link</button></div>
      ${groups || emptyArt('link', 'Noch keine Links.', 'Zum Beispiel ISIS, MOSES oder dein Discord-Server.')}
      ${cl.length ? `<div class="group-h"><h3>Kursseiten</h3></div><div class="cards">${cl.map(c => `<a class="card" style="--c:${catById(c.catId).color}" href="${esc(safeUrl(c.link))}" target="_blank" rel="noopener"><span class="sym">${sy(catById(c.catId).symbol)}</span><span style="min-width:0"><b>${esc(c.short||c.title)}</b><small class="mono">${esc(hostOf(safeUrl(c.link)))}</small></span></a>`).join('')}</div>` : ''}`;
  },

  /* ---------- EINSTELLUNGEN ---------- */
  einstellungen(){
    const s = state.settings, T = s.travel, S = s.sleep;
    const sw = (path, on, label) => `<button class="switch" role="switch" aria-checked="${!!on}" data-act="toggle" data-k="${path}" aria-label="${label}"></button>`;
    const numIn = (path, val, min, max, step=1, label='') => `<input type="number" data-set="${path}" value="${val}" min="${min}" max="${max}" step="${step}" aria-label="${label||path}">`;
    const remList = arr => (arr||[]).map(m => REMINDER_OPTS.find(r=>r[0]===m)?.[1] || m+' min').join(', ') || 'keine';
    const notif = !('Notification' in window) ? 'In dieser Ansicht nicht verfügbar' : Notification.permission === 'granted' ? 'Erlaubt' : Notification.permission === 'denied' ? 'Blockiert' : 'Noch nicht gefragt';
    return `<div class="settings">
      <section class="panel">
        <div class="panel-h"><h2>Darstellung</h2></div>
        <div class="row"><div class="l"><b>Name</b><small>Für die Begrüßung</small></div><input type="text" data-set="name" value="${esc(s.name)}" placeholder="Dein Name" aria-label="Name"></div>
        <div class="row"><div class="l"><b>Akzentfarbe</b></div></div>
        <div class="swatches" style="padding-bottom:12px">${ACCENTS.map(a => `<button class="swatch" style="--c:${a.c}" data-act="accent" data-c="${a.c}" aria-pressed="${s.accent.toLowerCase()===a.c.toLowerCase()}" aria-label="${a.name}" title="${a.name}"></button>`).join('')}<label class="swatch" style="--c:conic-gradient(#b33,#c93,#5a3,#38a,#73a,#b33);cursor:pointer;overflow:hidden" title="Eigene Farbe"><input type="color" data-set="accent" value="${esc(s.accent)}" style="opacity:0;width:100%;height:100%;border:0;padding:0" aria-label="Eigene Akzentfarbe"></label></div>
        <div class="row"><div class="l"><b>Modus</b></div><div class="seg">${[['system','System'],['light','Hell'],['dark','Dunkel']].map(([v,l]) => `<button data-act="setv" data-k="theme" data-v="${v}" aria-pressed="${s.theme===v}">${l}</button>`).join('')}</div></div>
        <div class="row"><div class="l"><b>Woche beginnt</b></div><div class="seg"><button data-act="setv" data-k="weekStart" data-v="1" data-num="1" aria-pressed="${s.weekStart==1}">Montag</button><button data-act="setv" data-k="weekStart" data-v="0" data-num="1" aria-pressed="${s.weekStart==0}">Sonntag</button></div></div>
        <div class="row"><div class="l"><b>Wochenende anzeigen</b></div>${sw('showWeekend', s.showWeekend, 'Wochenende anzeigen')}</div>
        <div class="row"><div class="l"><b>Sa und So ausblenden, wenn leer</b><small>In der Wochenansicht</small></div>${sw('hideEmptyWeekend', s.hideEmptyWeekend, 'Leeres Wochenende ausblenden')}</div>
        <div class="row"><div class="l"><b>Sichtbare Stunden</b><small>Wird bei frühen oder späten Terminen erweitert</small></div><span style="display:flex;gap:6px;align-items:center">${numIn('dayStart', s.dayStart, 0, 12, 1, 'Erste Stunde')}–${numIn('dayEnd', s.dayEnd, 13, 24, 1, 'Letzte Stunde')}</span></div>
      </section>

      <section class="panel">
        <div class="panel-h"><h2>Stil</h2></div>
        ${(() => { const st = s.style, seg = (k, opts) => `<div class="seg">${opts.map(([v,l]) => `<button data-act="setv" data-k="style.${k}" data-v="${v}" aria-pressed="${st[k]===v}">${l}</button>`).join('')}</div>`;
          return `<div class="row"><div class="l"><b>Schrift</b><small>Überschriften und Zahlen</small></div>${seg('font', [['classic','Klassisch'],['modern','Modern'],['tech','Technisch']])}</div>
          <div class="row"><div class="l"><b>Hintergrund</b><small>Im hellen Modus</small></div>${seg('tone', [['cool','Kühl'],['neutral','Neutral'],['warm','Warm']])}</div>
          <div class="row"><div class="l"><b>Dichte</b></div>${seg('density', [['compact','Kompakt'],['normal','Normal'],['airy','Luftig']])}</div>
          <div class="row"><div class="l"><b>Ecken</b></div>${seg('radius', [['crisp','Klar'],['soft','Weich'],['round','Rund']])}</div>
          <div class="row"><div class="l"><b>Tagesfarben</b><small>Jeder Tag färbt sich nach seinen Terminen</small></div>${sw('style.dayColors', st.dayColors, 'Tagesfarben')}</div>
          <div class="row"><div class="l"><b>Übergänge</b><small>Sanfte Animation beim Wechseln</small></div>${sw('style.motion', st.motion, 'Übergänge')}</div>
          <div class="preview"><button class="ev solid" style="--c:${catById('uni').color}"><b>Statik · Vorlesung</b><span class="m"><span class="mono">10:15–11:45</span></span></button><button class="ev" style="--c:${catById('freunde').color}"><b>Kino</b><span class="m"><span class="mono">20:15</span></span></button></div>`; })()}
      </section>

      <section class="panel">
        <div class="panel-h"><h2>Wetter</h2></div>
        <div>${s.weather.cities.map(c => `<div class="listrow"><span style="color:var(--accent-ink);display:flex">${ic('ort','s')}</span><span class="grow">${esc(c.name)}${c.key===WX.activeKey()?' <span class="tag accent">Standard</span>':''}</span>${c.key!==WX.activeKey()?`<button class="btn ghost sm" data-act="wxCity" data-key="${esc(c.key)}">Als Standard</button>`:''}<button class="iconbtn" data-act="wxRemove" data-key="${esc(c.key)}" aria-label="${esc(c.name)} entfernen">${ic('x','s')}</button></div>`).join('')}</div>
        <div class="f" style="margin-top:12px"><span>Weitere Städte</span><div class="chips">${CITY_PRESETS.filter(p => !s.weather.cities.some(c => c.key === p.key)).map(p => `<button class="chip" data-act="wxAdd" data-key="${p.key}" data-name="${esc(p.name)}">${ic('plus','s')}${esc(p.name)}</button>`).join('')}</div></div>
        <form class="todo-add" data-form="wxSearch" style="margin-top:12px"><input name="q" placeholder="Andere Stadt suchen, z. B. Lissabon" autocomplete="off" aria-label="Stadt suchen"><button class="btn sm" type="submit">Suchen</button></form>
        <div id="wxResults"></div>
      </section>

      <section class="panel">
        <div class="panel-h"><h2>Orte und Wege</h2><button class="btn sm" data-act="newPlace">${ic('plus','s')}Ort</button></div>
        <div>${state.places.map(p => `<div class="listrow" data-act="edit" data-kind="place" data-id="${esc(p.id)}"><span style="color:var(--accent-ink);display:flex">${ic(p.home?'haus':'ort','s')}</span><span class="grow">${esc(p.name)}<small>${p.home?`Startpunkt für alle Wege${p.vbb ? ' · ' + esc(p.vbb.name) : Transit.ok() ? ' · Haltestelle eintragen für Live-Verbindungen' : ''}`:`${p.vbb && Transit.ok() ? 'Live · ' : ''}${p.mode === 'oepnv' && routeOk(p.route) ? `${esc(routeLabel(p.route))} · ${dur(routeBase(p.route))}${routeLegs(p.route).every(g => g.at) ? ' · nach Fahrplan' : ''}` : `${dur(p.minutes)} · ${MODES[p.mode]} · mit Puffer ${dur(travelMinutes(p).total)}`}`}</small></span>${p.home?'':ic('weiter','s')}</div>`).join('')}</div>
        ${STANDALONE ? `<div class="row" style="margin-top:8px"><div class="l"><b>Erkennen, ob du zuhause bist</b><small>${esc(Loc.label())}</small></div>${sw('loc.on', s.loc && s.loc.on, 'Erkennen, ob du zuhause bist')}</div>` : ''}
        <div class="row"${STANDALONE ? '' : ' style="margin-top:8px"'}><div class="l"><b>Früher da sein</b><small>Ankunft vor Beginn</small></div><span>${numIn('travel.arriveEarly', T.arriveEarly, 0, 60, 1, 'Früher da sein')} min</span></div>
        <details class="sx-more"><summary>Puffer für Wege ohne Fahrplan</summary>
        <div class="row"><div class="l"><b>Puffer</b><small>Aufschlag auf geschätzte Wegzeiten</small></div><span>${numIn('travel.bufferPct', T.bufferPct, 0, 100, 1, 'Puffer in Prozent')} %</span></div>
        <div class="row"><div class="l"><b>Mindestpuffer</b></div><span>${numIn('travel.minBuffer', T.minBuffer, 0, 60, 1, 'Mindestpuffer')} min</span></div>
        <div class="row"><div class="l"><b>Regenzuschlag</b><small>Für Rad und Fußweg bei Regen</small></div><span>${numIn('travel.rainExtra', T.rainExtra, 0, 60, 1, 'Regenzuschlag')} min</span></div>
        <div class="row"><div class="l"><b>Vor Ort bleiben</b><small>Kein Heimweg, wenn die Lücke kürzer ist als Hin- und Rückweg plus</small></div><span>${numIn('travel.stayGap', T.stayGap, 0, 240, 5, 'Vor Ort bleiben')} min</span></div>
        </details>
        <div class="row"><div class="l"><b>Erinnerung zum Losgehen</b><small>10 min vorher</small></div>${sw('travel.remind', T.remind, 'Erinnerung zum Losgehen')}</div>
        <p class="note">${STANDALONE ? 'Im Termin gibst du nur das Ziel an. Fußwege, Linien, Fahrzeit und Verspätungen holt der Kalender aus dem Fahrplan, die Puffer gelten nur für Wege ohne Fahrplan.' : 'Wegzeit einmal pro Ort eintragen. In der App rechnet der Kalender mit dem echten Fahrplan.'}</p>
      </section>

      <section class="panel">
        <div class="panel-h"><h2>Schlaf</h2>${sw('sleep.on', S.on, 'Schlafplanung')}</div>
        <div class="row"><div class="l"><b>Schlafdauer</b></div><span>${numIn('sleep.hours', S.hours, 5, 11, .5, 'Schlafdauer')} h</span></div>
        <div class="row"><div class="l"><b>Automatisch berechnen</b><small>Fester Rhythmus aus deinem Stundenplan, frühe Tage vorbereitet, späte Abende berücksichtigt</small></div>${sw('sleep.auto', S.auto !== false, 'Schlafzeiten automatisch berechnen')}</div>
        ${S.auto !== false && state.settings.sleep.on ? (() => { sleepPlan(); const m = _sleepMeta; return m ? `<p class="note">Dein Rhythmus: werktags <b>${toHM(m.anchorW)}</b>, am Wochenende <b>${toHM(m.anchorWE)}</b> aufstehen (${m.anchorSrc}). Schlaf: ${m.cycles ? `${m.cycles} Zyklen, ${dur(m.sleepT)}` : dur(m.sleepT)}.</p>` : ''; })() : ''}
        <div class="row"><div class="l"><b>In Schlafzyklen planen</b><small>90-min-Zyklen, Wecker am Zyklusende</small></div>${sw('sleep.cycles', S.cycles !== false, 'Schlafzyklen')}</div>
        <div class="row"><div class="l"><b>Abschalten vor dem Schlafen</b><small>Nach dem letzten Termin oder der Ankunft zuhause</small></div><span>${numIn('sleep.windDown', S.windDown ?? 30, 0, 120, 5, 'Abschalten')} min</span></div>
        <div class="row"><div class="l"><b>${S.auto !== false ? 'Spätestens aufstehen werktags' : 'Aufstehen werktags'}</b><small>${S.auto !== false ? 'Obergrenze für den Rhythmus' : 'Wenn nichts Früheres ansteht'}</small></div><input type="time" data-set="sleep.wakeWeek" value="${esc(S.wakeWeek)}" aria-label="Aufstehen werktags"></div>
        <div class="row"><div class="l"><b>${S.auto !== false ? 'Wunsch am Wochenende' : 'Aufstehen am Wochenende'}</b>${S.auto !== false ? '<small>Höchstens 1 h nach dem Werktags-Rhythmus</small>' : ''}</div><input type="time" data-set="sleep.wakeWeekend" value="${esc(S.wakeWeekend)}" aria-label="Aufstehen am Wochenende"></div>
        <div class="row"><div class="l"><b>Morgenroutine</b><small>Zeit zwischen Aufstehen und Losgehen</small></div><span>${numIn('sleep.routine', S.routine, 0, 180, 5, 'Morgenroutine')} min</span></div>
        <div class="row"><div class="l"><b>Einschlafzeit</b></div><span>${numIn('sleep.latency', S.latency, 0, 60, 5, 'Einschlafzeit')} min</span></div>
        <div class="row"><div class="l"><b>Max. Verschiebung pro Nacht</b><small>Hält deinen Rhythmus stabil</small></div><span>${numIn('sleep.shift', S.shift, 10, 120, 5, 'Verschiebung')} min</span></div>
        <div class="row"><div class="l"><b>Später aufstehen höchstens</b><small>Auch wenn der erste Termin spät ist</small></div><span>${numIn('sleep.flex', S.flex, 0, 180, 15, 'Später aufstehen')} min</span></div>
        <div class="row"><div class="l"><b>Erinnerung vor Schlafenszeit</b></div><span>${numIn('sleep.remind', S.remind, 0, 120, 5, 'Erinnerung Schlafenszeit')} min</span></div>
      </section>

      <section class="panel">
        <div class="panel-h"><h2>Feiertage</h2></div>
        <div class="row"><div class="l"><b>Region</b></div><select data-set="holidayRegion" aria-label="Region">${Object.entries(REGIONS).map(([k,v]) => `<option value="${k}" ${s.holidayRegion===k?'selected':''}>${v}</option>`).join('')}</select></div>
        <div class="row"><div class="l"><b>Besondere Tage</b><small>Muttertag, Advent, Zeitumstellung, Silvester …</small></div>${sw('observances', s.observances, 'Besondere Tage')}</div>
      </section>

      <section class="panel">
        <div class="panel-h"><h2>Erinnerungen</h2><button class="btn sm" data-act="testReminder">${ic('glocke','s')}Testen</button></div>
        <div class="row"><div class="l"><b>Ton</b></div>${sw('sound', s.sound, 'Ton')}</div>
        <div class="row"><div class="l"><b>Vibration</b><small>Wenn der Browser es erlaubt</small></div>${sw('vibrate', s.vibrate, 'Vibration')}</div>
        <div class="row"><div class="l"><b>Systembenachrichtigungen</b><small>${notif}</small></div><button class="btn sm" data-act="askNotif">Erlauben</button></div>
        ${STANDALONE ? pushRows() : ''}
        <div class="row"><div class="l"><b>Kurse erinnern</b></div>${sw('courseReminders', s.courseReminders, 'Kurse erinnern')}</div>
        ${['event','deadline','course'].map(k => `<div class="row"><div class="l"><b>Standard ${({event:'Termine',deadline:'Fristen',course:'Kurse'})[k]}</b><small>${remList(s.reminders[k])}</small></div><button class="btn sm" data-act="editDefaultRem" data-k="${k}">Ändern</button></div>`).join('')}
        <p class="note">Erinnerungen erscheinen, solange die Seite offen ist. Damit dein Handy auch sonst vibriert, übernimm den Kalender per Export in die Kalender-App deines Handys. Losgeh-Erinnerungen werden mit exportiert.</p>
      </section>

      <section class="panel">
        <div class="panel-h"><h2>Kategorien</h2><button class="btn sm" data-act="newCategory">${ic('plus','s')}Neu</button></div>
        ${state.categories.map(c => `<div class="listrow" style="--c:${c.color}" data-act="edit" data-kind="category" data-id="${esc(c.id)}"><span class="sw"></span><span style="color:${c.color};display:flex">${sy(c.symbol)}</span><span class="grow">${esc(c.name)}${c.placeId && placeById(c.placeId) ? `<small>Standardort: ${esc(placeById(c.placeId).name)}</small>` : ''}</span>${ic('weiter','s')}</div>`).join('')}
      </section>

      <section class="panel">
        <div class="panel-h"><h2>Vorlagen und Blöcke</h2><button class="btn sm" data-act="newTemplate">${ic('plus','s')}Neu</button></div>
        ${state.templates.map(t => `<div class="listrow" data-act="edit" data-kind="template" data-id="${esc(t.id)}"><span style="color:var(--accent-ink);display:flex">${ic('block','s')}</span><span class="grow">${esc(t.name)}<small>${dur(t.dur)}${t.bb||t.ba?` · Puffer ${t.bb} / ${t.ba} min · belegt ${dur(t.dur+t.bb+t.ba)}`:''}</small></span>${ic('weiter','s')}</div>`).join('')}
        <p class="note">Vorlagen wählst du beim Erstellen eines Termins mit einem Tipp. Ein Uni-Block sind 90 min mit je 15 min Puffer, belegt also 2 Stunden.</p>
      </section>

      <section class="panel">
        <div class="panel-h"><h2>Geburtstage</h2><button class="btn sm" data-act="newBirthday">${ic('plus','s')}Neu</button></div>
        ${state.birthdays.length ? state.birthdays.slice().sort((a,b) => a.date < b.date ? -1 : 1).map(b => `<div class="listrow" data-act="edit" data-kind="birthday" data-id="${esc(b.id)}"><span style="color:var(--gold);display:flex">${ic('geschenk','s')}</span><span class="grow">${esc(b.name)}<small>${Number(b.date.slice(3))}. ${MONTHS[+b.date.slice(0,2)-1]}${b.year?' · '+b.year:''}</small></span>${ic('weiter','s')}</div>`).join('') : '<div class="empty" style="padding:4px 0">Noch keine Geburtstage.</div>'}
      </section>

      <section class="panel">
        <div class="panel-h"><h2>Export und Daten</h2></div>
        <div class="row"><div class="l"><b>Für die Kalender-App kopieren</b><small>ICS mit allen Terminen und Erinnerungen</small></div><button class="btn sm" data-act="copyIcs">${ic('kopie','s')}Kopieren</button></div>
        <div class="row"><div class="l"><b>ICS als Datei sichern</b><small>Als .txt gespeichert, Endung in .ics ändern</small></div><button class="btn sm" data-act="saveIcs">${ic('runter','s')}Sichern</button></div>
        <div class="row"><div class="l"><b>ICS importieren</b><small>Stundenplan aus MOSES oder andere Kalender</small></div><button class="btn sm" data-act="importIcsPrompt">${ic('hoch','s')}Import</button></div>
        ${STANDALONE ? syncRows() : `<div class="row"><div class="l"><b>Speicherort</b><small>${Store.mode==='cloud'?'Privat in deinem Claude-Konto, auf allen Geräten gleich':'Nur in diesem Browser'}</small></div></div>`}
        <div class="row"><div class="l"><b>Sicherung speichern</b></div><button class="btn sm" data-act="saveBackup">${ic('runter','s')}JSON</button></div>
        <div class="row"><div class="l"><b>Sicherung laden</b><small>Ersetzt alle Daten</small></div><label class="btn sm" style="cursor:pointer">${ic('hoch','s')}Datei<input type="file" id="backupFile" accept=".json,application/json" hidden></label></div>
        ${hasExamples() ? `<div class="row"><div class="l"><b>Beispiele entfernen</b></div><button class="btn sm" data-act="clearExamples">Entfernen</button></div>` : ''}

/* ================================================================
   §16c PLANER
   workPlan(): verteilt den Aufwand offener Fristen als Arbeitsblöcke
   in freie Zeit vor der Abgabe. Prüfungen (exam) werden gleichmäßig
   über bis zu 14 Tage verteilt (Lernplan), normale Fristen so früh wie
   möglich (max. 7 Tage vorher). Energie-Kurve: hohe Priorität morgens,
   niedrige eher abends. Blöcke höchstens 90 min, dazwischen 15 min Pause.
   ================================================================ */
const roundUp15 = d => { const x = new Date(d); const m = x.getMinutes(); const r = Math.ceil(m/15)*15; x.setMinutes(r, 0, 0); return x; };
function subtractIntervals(slots, taken){
  let out = slots.map(x => [new Date(x[0]), new Date(x[1])]);
  for (const [a,b] of taken) {
    const next = [];
    for (const [s,e] of out) {
      if (b <= s || a >= e) { next.push([s,e]); continue; }
      if (a > s) next.push([s, new Date(a)]);
      if (b < e) next.push([new Date(b), e]);
    }
    out = next;
  }
  return out;
}
function deadlineRemaining(d){
  const subs = d.subtasks || [], frac = subs.length ? subs.filter(x => x.done).length / subs.length : 0;
  return Math.max(0, Math.round((+d.effort||0) * 60 * (1 - frac) - (+d.focusMin||0)));
}
function workPlan(){
  if (_workCache) return _workCache;
  const res = {}, short = [], now = new Date(), t0 = startOfDay(now), used = {};
  const tasks = state.deadlines.filter(d => !d.done && +d.effort > 0).map(d => ({d, due: at(d.date, d.time||'23:59'), need: deadlineRemaining(d), exam: !!d.exam, prio: +d.priority || 2}))
    .filter(x => x.need > 0 && x.due > now).sort((a,b) => (b.exam - a.exam) || a.due - b.due);
  for (const T of tasks) {
    const lastDay = startOfDay(T.due.getHours() < 12 ? addDays(T.due, -1) : T.due);
    let first = addDays(startOfDay(T.due), -(T.exam ? 14 : 7)); if (first < t0) first = t0;
    const days = []; for (let d = new Date(first); d <= lastDay; d = addDays(d,1)) days.push(new Date(d));
    let remaining = T.need;
    for (let i = 0; i < days.length && remaining > 0; i++) {
      const d = days[i], left = days.length - i, k = ymd(d);
      let quota = T.exam ? Math.max(30, Math.ceil(remaining / left / 30) * 30) : remaining;
      quota = Math.min(quota, T.exam ? 180 : 150, remaining);
      const sp = sleepPlan(), wk = sp[k], bd = sp[ymd(addDays(d,1))];
      const lo = wk ? addMin(wk.wake, 60) : null, hi = bd ? addMin(bd.bed, -30) : null;
      let free = subtractIntervals(freeSlots(d), used[k] || []).map(([a,b]) => [lo && a < lo ? lo : a, hi && b > hi ? hi : b]).filter(([a,b]) => b - a >= 30*60000);
      if (sameDay(d, T.due)) free = free.map(([a,b]) => [a, new Date(Math.min(b, addMin(T.due, -60)))]).filter(([a,b]) => b > a);
      free.sort((x,y) => T.prio === 1 ? y[0] - x[0] : x[0] - y[0]);
      for (const [a,b] of free) {
        if (quota <= 0) break;
        let st = roundUp15(a);
        while (quota > 0 && (b - st) >= 30*60000) {
          const len = Math.min(90, Math.max(30, quota), Math.floor((b - st)/60000/15)*15);
          if (len < 30) break;
          const en = addMin(st, len);
          (res[k] = res[k] || []).push({kind:'work', id:T.d.id, title:(T.exam ? 'Lernen: ' : 'Arbeiten: ') + T.d.title, start:st, end:en, allDay:false, cat:catById(T.d.catId), ref:T.d, key:`w:${T.d.id}:${+st}`, placeId:'', bb:0, ba:0});
          (used[k] = used[k] || []).push([st, addMin(en, 15)]);
          quota -= len; remaining -= len; st = addMin(en, 15);
        }
      }
    }
    if (remaining > 0) short.push({d:T.d, missing:remaining});
  }
  res._short = short;
  return (_workCache = res);
}
const workFor = d => state.settings.layers.work ? (workPlan()[ymd(d)] || []) : [];
const layerOk = o => !(o.kind === 'course' && !state.settings.layers.courses);
/* Nächste freie Zeit für einen Termin (für Konflikte) */
function nextFree(durMin, from, ignoreId){
  const keep = state.events; if (ignoreId) { state.events = state.events.filter(e => e.id !== ignoreId); invalidate(); }
  try {
    for (let i = 0; i < 14; i++) {
      const d = addDays(startOfDay(from), i);
      for (const [a,b] of subtractIntervals(freeSlots(d), (workPlan()[ymd(d)]||[]).map(w => [w.start, w.end]))) {
        const st = roundUp15(new Date(Math.max(a, i === 0 ? from : a)));

}
/* Gewohnheiten */
function habitStreak(h){

/* Fokus-Timer (Pomodoro 25/5) – erledigte Zeit wird bei der Frist angerechnet */
const Focus = {
  t:null,
  start(dl){ ui.focus = {id: dl ? dl.id : null, title: dl ? dl.title : 'Fokus', phase:'work', len:25, endsAt: Date.now() + 25*60000, paused:false}; Reminders.unlock(); clearInterval(this.t); this.t = setInterval(() => this.tick(), 1000); this.draw(); toast('Fokus gestartet', '25 min, danach 5 min Pause.'); },
  tick(){
    const f = ui.focus; if (!f) return;

  },
  log(min){ const d = ui.focus && state.deadlines.find(x => x.id === ui.focus.id); if (d) { d.focusMin = (+d.focusMin||0) + min; Store.schedule(); invalidate(); renderSoft(); } },
  toggle(){ const f = ui.focus; if (!f) return; if (f.paused) { f.endsAt = Date.now() + f.remain; f.paused = false; } else { f.remain = f.endsAt - Date.now(); f.paused = true; } this.draw(); },

  },
  draw(){
    let el = document.getElementById('focusbar'); const f = ui.focus;

    if (!el) { el = document.createElement('div'); el.id = 'focusbar'; el.className = 'focusbar'; el.setAttribute('role','timer'); document.getElementById('app').appendChild(el); el.innerHTML = `<div class="fb-ring"></div><div class="fb-txt"><small></small><b class="mono"></b></div><button class="btn sm" data-act="focusToggle"></button><button class="btn sm" data-act="focusStop">Stopp</button>`; }

};

    try { const url = URL.createObjectURL(new Blob([data], {type:'application/octet-stream'})), a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000); return true; }

  }
  try { const dl = window.claude && await claude.use('downloads'); if (!dl) { toast('Speichern nicht möglich', 'In dieser Ansicht können keine Dateien gespeichert werden.'); return false; } await dl.save({filename, data}); return true; }
  catch (e) { if (e && e.code !== 'declined') toast('Speichern nicht möglich', e.message || 'Bitte später erneut versuchen.'); return false; }
}

function toast(title, body, opts = {}){

  const bye = () => { if (el.classList.contains('out')) return; el.classList.add('out'); setTimeout(() => el.remove(), 220); };
  el.querySelector('.x').onclick = bye;

/* ================================================================
   §16h PUSH ÜBER NTFY: Erinnerungen und Vibration auch bei
   geschlossener App. Die App plant die Erinnerungen der nächsten
   Stunden als verzögerte Nachrichten auf einem geheimen ntfy-Thema
   (ntfy.sh, kostenlos). Die ntfy-App auf dem Handy zeigt sie zur
   richtigen Zeit an, auch wenn Kalendarium geschlossen ist.
   Jede Erinnerung hat eine feste Kennung (sequence id): geänderte
   Zeiten werden ersetzt, gelöschte Termine werden zurückgezogen.
   ================================================================ */
const Push = {
  srv:'https://ntfy.sh', timer:null, busy:false, count:0, err:'', horizonH:60, lastSync:0,
  on(){ const n = state && state.settings.ntfy; return !!(STANDALONE && n && n.on && n.topic); },
  topic(){ return state.settings.ntfy.topic; },
  seq(key){ let a = 5381, b = 52711; for (let i = 0; i < key.length; i++) { const c = key.charCodeAt(i); a = ((a * 33) ^ c) >>> 0; b = ((b * 31) + c) >>> 0; } return 'k' + a.toString(36) + b.toString(36); },
  url(extra = ''){ return `${this.srv}/${encodeURIComponent(this.topic())}${extra}`; },
  async send(a, seq){
    const q = new URLSearchParams({title: a.title, priority: String(a.prio || 4), tags: 'calendar', click: APP_URL});
    if (a.at) q.set('delay', String(Math.round(a.at / 1000)));
    const r = await fetch(this.url((seq ? '/' + seq : '') + '?' + q.toString()), {method:'POST', body: a.body});
    if (!r.ok) { const e = new Error('ntfy ' + r.status); e.status = r.status; throw e; }
  },
  queue(){ if (!this.on()) return; clearTimeout(this.timer); this.timer = setTimeout(() => this.sync(), 6000); },
  async known(){
    const r = await fetch(this.url('/json?poll=1&sched=1&since=all'), {cache:'no-store'}); if (!r.ok) throw new Error('poll');
    const now = Date.now() / 1000, k = {};
    for (const line of (await r.text()).split('\n')) { if (!line.trim()) continue; try { const m = JSON.parse(line); if (m.event === 'message' && m.sequence_id && m.time > now + 5) k[m.sequence_id] = m.time; } catch {} }
    return k;
  },
  async sync(force){
    if (!this.on() || this.busy) return; if (navigator.onLine === false) { this.err = 'Offline'; return; }
    this.busy = true; this.err = '';
    try {
      const now = Date.now(), want = Reminders.plan(now + 20000, now + this.horizonH * 3600000), known = await this.known(), ids = new Set();
      for (const a of want) {
        const id = this.seq(a.key); ids.add(id);
        if (known[id] && Math.abs(known[id] - Math.round(a.at / 1000)) < 30) continue;
        try { await this.send(a, id); }
        catch (e) { if (e.status === 400 && this.horizonH > 12) { this.horizonH = Math.max(12, this.horizonH / 2); this.busy = false; return this.sync(force); } throw e; }
      }
      for (const id in known) if (!ids.has(id) && id.startsWith('k')) { try { await fetch(this.url('/' + id), {method:'DELETE'}); } catch {} }
      this.count = want.length; this.lastSync = Date.now();
    } catch (e) { this.err = e && e.status === 429 ? 'Zu viele Nachrichten heute, versuche es später.' : 'ntfy.sh nicht erreichbar.'; }
    finally { this.busy = false; }
  },
  async clear(){ if (!state.settings.ntfy || !state.settings.ntfy.topic) return; try { const k = await this.known(); for (const id in k) await fetch(this.url('/' + id), {method:'DELETE'}); } catch {} }
};
function pushRows(){

/* ================================================================
   §16g APP-VERSION: Abgleich über ein privates GitHub-Gist, Wetter von
   Open-Meteo. Nur aktiv, wenn die Seite außerhalb von claude.ai läuft.
   ================================================================ */
const GistSync = {
  key:'kal-gist', file:'kalendarium.json', cfg:null, timer:null, poll:null, busy:false, status:'',
  load(){ try { this.cfg = JSON.parse(localStorage.getItem(this.key) || 'null'); } catch { this.cfg = null; } },
  save(){ try { localStorage.setItem(this.key, JSON.stringify(this.cfg)); } catch {} },
  on(){ return !!(this.cfg && this.cfg.token && this.cfg.id); },
  label(){ if (!this.on()) return 'Nur auf diesem Gerät gespeichert'; return this.status === 'auth' ? 'Abgleich: Schlüssel ungültig' : this.status === 'offline' ? 'Offline, gleicht später ab' : 'Abgleich mit GitHub aktiv'; },
  localAt(){ return +(localStorage.getItem('kal-saved-at') || 0); },
  async api(path, opts = {}){
    const r = await fetch('https://api.github.com' + path, {...opts, cache:'no-store', headers:{'Accept':'application/vnd.github+json', 'Authorization':'Bearer ' + this.cfg.token, ...(opts.body ? {'Content-Type':'application/json'} : {})}});
    if (!r.ok) { const e = new Error('http ' + r.status); e.status = r.status; throw e; }
    return r.json();
  },
  payload(){ return JSON.stringify({app:'kalendarium', v:1, savedAt: this.localAt() || Date.now(), state}); },
  apply(d){
    if (!d || !d.state) return false;
    state = migrate(d.state); Store.fromExample = false; Store.saveLocal();
    try { localStorage.setItem('kal-saved-at', String(d.savedAt || Date.now())); } catch {}
    invalidate(); applyTheme(); renderSoft(); return true;
  },
  async read(g){ const f = g.files && g.files[this.file]; if (!f) return null; let txt = f.content; if (f.truncated) txt = await (await fetch(f.raw_url)).text(); try { return JSON.parse(txt); } catch { return null; } },
  /* Beim ersten Verbinden: vorhandenes Gist gewinnt (das andere Gerät), sonst neues anlegen */
  async connect(token){
    this.cfg = {token, id:''};
    let list = [];
    for (let page = 1; page <= 5; page++) { const g = await this.api(`/gists?per_page=100&page=${page}`); list = list.concat(g); if (g.length < 100) break; }
    const found = list.find(g => g.files && g.files[this.file]);
    if (found) {
      this.cfg.id = found.id; const g = await this.api('/gists/' + found.id), d = await this.read(g);
      this.cfg.at = g.updated_at; this.save(); this.status = 'ok'; if (d) this.apply(d); this.start(true); return true;
    }
    if (!this.localAt()) try { localStorage.setItem('kal-saved-at', String(Date.now())); } catch {}
    const g = await this.api('/gists', {method:'POST', body: JSON.stringify({description:'Kalendarium (privater Abgleich)', public:false, files:{[this.file]:{content: this.payload()}}})});
    this.cfg.id = g.id; this.cfg.at = g.updated_at; this.save(); this.status = 'ok'; this.start(true); return false;
  },
  async pull(){
    if (!this.on() || this.busy) return; this.busy = true;
    try {
      const g = await this.api('/gists/' + this.cfg.id);
      if (g.updated_at !== this.cfg.at) {
        const d = await this.read(g);
        if (d && (d.savedAt || 0) > this.localAt()) { this.apply(d); setSync('Vom anderen Gerät aktualisiert'); clearTimeout(this._st); this._st = setTimeout(() => setSync(), 4000); }
        else if (d && (d.savedAt || 0) < this.localAt()) { this.cfg.at = g.updated_at; this.save(); this.busy = false; return this.push(); }
        this.cfg.at = g.updated_at; this.save();
      }
      this.status = 'ok';
    } catch (e) { this.fail(e); } finally { this.busy = false; if (!this._st) setSync(); }
  },
  queue(){ if (!this.on()) return; clearTimeout(this.timer); this.timer = setTimeout(() => this.push(), 1500); },
  async push(){
    if (!this.on()) return; if (this.busy) { this.queue(); return; } this.busy = true;
    try { const g = await this.api('/gists/' + this.cfg.id, {method:'PATCH', body: JSON.stringify({files:{[this.file]:{content: this.payload()}}})}); this.cfg.at = g.updated_at; this.save(); this.status = 'ok'; }
    catch (e) { this.fail(e); } finally { this.busy = false; setSync(); }
  },
  fail(e){ this.status = e && (e.status === 401 || e.status === 403 || e.status === 404) ? 'auth' : 'offline'; },
  start(skipPull){
    clearInterval(this.poll); if (!this.on()) return;
    if (!skipPull) this.pull();
    this.poll = setInterval(() => { if (!document.hidden) this.pull(); }, 45000);
    if (!this._vis) { this._vis = true; document.addEventListener('visibilitychange', () => { if (!document.hidden) this.pull(); }); window.addEventListener('online', () => { this.push(); }); }
  },
  disconnect(){ clearInterval(this.poll); clearTimeout(this.timer); this.cfg = null; this.status = ''; try { localStorage.removeItem(this.key); } catch {} setSync(); }
};

/* Wetter ohne Konto: Open-Meteo (frei, ohne Schlüssel) */
const WMO_DE = {0:'Klar',1:'Überwiegend klar',2:'Teilweise bewölkt',3:'Bewölkt',45:'Nebel',48:'Reifnebel',51:'Leichter Nieselregen',53:'Nieselregen',55:'Starker Nieselregen',56:'Gefrierender Niesel',57:'Gefrierender Niesel',61:'Leichter Regen',63:'Regen',65:'Starker Regen',66:'Gefrierender Regen',67:'Gefrierender Regen',71:'Leichter Schneefall',73:'Schneefall',75:'Starker Schneefall',77:'Schneegriesel',80:'Regenschauer',81:'Regenschauer',82:'Heftige Schauer',85:'Schneeschauer',86:'Schneeschauer',95:'Gewitter',96:'Gewitter mit Hagel',99:'Gewitter mit Hagel'};
function wmoIcon(c, day){
  c = +c;
  if (c === 0) return day ? 1 : 33; if (c === 1) return day ? 2 : 34; if (c === 2) return day ? 3 : 35; if (c === 3) return 7;
  if (c === 45 || c === 48) return 11; if (c >= 51 && c <= 57) return day ? 13 : 39; if (c >= 61 && c <= 65) return 18; if (c === 66 || c === 67) return 26;
  if (c >= 71 && c <= 77) return 22; if (c >= 80 && c <= 82) return day ? 14 : 40; if (c === 85 || c === 86) return day ? 21 : 44; if (c >= 95) return day ? 15 : 41;
  return day ? 4 : 36;
}
const windDir = deg => ['N','NNO','NO','ONO','O','OSO','SO','SSO','S','SSW','SW','WSW','W','WNW','NW','NNW'][Math.round(((+deg || 0) % 360) / 22.5) % 16];
const OM = {
  async geo(q){

    const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(name)}&count=1&language=de&format=json`), j = await r.json(), x = j.results && j.results[0];
    if (!x) throw new Error('nogeo');

    const r = await fetch(url); if (!r.ok) throw new Error('om'); const j = await r.json(), H = j.hourly || {}, D = j.daily || {};

      nIcon: wmoIcon(code, false), nPhrase: WMO_DE[code] || '', nPrecip: D.precipitation_probability_max[i] ?? 0, wind: `${windDir(D.wind_direction_10m_dominant[i])} ${Math.round(D.wind_speed_10m_max[i])} km/h`, gusts: `${Math.round(D.wind_gusts_10m_max[i])} km/h`,

/* ================================================================
   §16f GEDÄCHTNIS UND ÜBERSCHNEIDUNGEN
   titleMemory(): findet den letzten Termin mit gleichem Titel
   (z. B. „Scrim“, „Turnier“) und bietet an, Kategorie, Uhrzeit,
   Ort, Puffer, Erinnerungen und Link zu übernehmen.
   ovlUpdate(): prüft im Termin-Editor live auf Überschneidungen,
   Wege, Heimweg und Schlaf und schlägt freie Zeit vor.
   ================================================================ */
const normTitle = t => String(t || '').toLowerCase().replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
function titleMemory(title, excludeId){
  const k = normTitle(title); if (k.length < 2) return null;
  const ok = e => e.id !== excludeId && e.id !== '_cand';
  let pool = state.events.filter(e => ok(e) && normTitle(e.title) === k);
  if (!pool.length && k.length >= 4 && !k.includes(' ')) pool = state.events.filter(e => ok(e) && normTitle(e.title).split(' ')[0] === k);
  if (!pool.length) return null;
  /* Die übliche Uhrzeit gewinnt (am häufigsten), bei Gleichstand der jüngste vergangene Termin */
  const today = ymd(new Date()), rank = e => (e.date <= today ? '1' : '0') + e.date + (e.start || '');
  const groups = {}; for (const e of pool) { const g = e.allDay ? 'ganz' : `${e.start}|${e.end}`; (groups[g] = groups[g] || []).push(e); }
  const best = Object.values(groups).sort((a, b) => b.length - a.length || rank(b.reduce((x, y) => rank(y) > rank(x) ? y : x)).localeCompare(rank(a.reduce((x, y) => rank(y) > rank(x) ? y : x))))[0];
  best.sort((a, b) => rank(b).localeCompare(rank(a)));
  const e = best[0], len = !e.allDay && e.start && e.end ? ((minutesOf(e.end) - minutesOf(e.start) + 1440) % 1440 || 60) : 0;
  return {e, n: pool.length, len};
}
function memSummary(m){
  const e = m.e, cat = state.categories.find(c => c.id === e.catId);
  const pl = e.placeId === 'home' ? 'Zuhause' : e.placeId && placeById(e.placeId) ? placeById(e.placeId).name : (e.location || '');
  return [cat && cat.name, e.allDay ? 'ganztägig' : `${e.start}–${e.end}`, pl, (+e.bufferBefore || +e.bufferAfter) ? `Puffer ${+e.bufferBefore || 0}/${+e.bufferAfter || 0} min` : ''].filter(Boolean).join(' · ');
}
function applyMemory(c, p){
  if (!c || c.kind === 'deadline') return c;
  const m = titleMemory(c.title); if (!m) return c;
  const e = m.e;
  if (c.kind === 'todo') { if (!c.date || e.allDay) return c; c.kind = 'event'; }
