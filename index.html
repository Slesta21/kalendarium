<!--
=====================================================================
 KALENDARIUM 83  ·  persönlicher Kalender für alles
=====================================================================
 ARCHITEKTUR (für spätere Erweiterungen). Suche nach "§" für Sprungmarken.

  §1  CSS-TOKENS        Farben, Schriften (:root + Dark-Mode)
  §2  CSS-KOMPONENTEN   Layout, Navigation, Ansichten, Sheets
  §3  MARKUP            App-Gerüst
  §4  SYMBOLE           SYM (Kategorien), UI (Bedienung), WXP (Wetter)
  §5  DATUM-UTILS       ymd(), at(), addDays(), isoWeek(), fmt*()
  §6  DATENMODELL       defaultState(), exampleState(), migrate()
  §7  SPEICHER          Store: Konto-Datenbank (db) + localStorage
  §8  FEIERTAGE         holidaysFor(year) – berechnet, offline
  §9  WETTER            WX: AccuWeather über mcp, Cache, wxAt(date)
  §10 TERMINE           occurrences(from,to): Termine, Kurse, Fristen,
                        Geburtstage, Feiertage
  §11 WEGE              planDay(date): Losgehzeit, Puffer, Anschlüsse
  §12 SCHLAF            sleepPlan(): Schlafenszeit je Nacht, geglättet
  §13 ERINNERUNGEN      Reminders: Ton, Vibration, Hinweis
  §14 ICS               Export / Import
  §15 SCHNELLERFASSUNG  parseQuick()
  §16 ANSICHTEN         VIEWS.kalender (ein Tab, ui.mode = tag|woche|
                        monat|jahr), aufgaben, stundenplan, wetter,
                        links, einstellungen, suche · dayDashboard(d)
  §16c PLANER           workPlan(): Arbeits- und Lernblöcke aus Fristen,
                        Focus (Pomodoro), Gewohnheiten, Wochenrückblick
  §16b PRÜF-CHAT        lokal, ohne Claude: Termine prüfen, Fragen wie
                        "Wann muss ich morgen los?" beantworten
  §17 DETAILS           DETAIL.* große Leseansicht beim Antippen
  §18 FORMULARE         EDITORS.* und SAVE.*
  §19 AKTIONEN          ACTIONS{} – alle Klicks über data-act
  §20 START             init(), Verschieben, Tastenkürzel

 Datenobjekt (state), jeder Abschnitt wird einzeln gespeichert:
  settings   {name, accent, theme, weekStart, dayStart, dayEnd, sound,
              vibrate, showWeekend, hideEmptyWeekend, holidayRegion,
              observances, reminders{event,deadline,course},
              courseReminders, weather{cities[{key,name}], active},
              travel{bufferPct,minBuffer,rainExtra,arriveEarly,stayGap,
              remind}, sleep{on,hours,latency,routine,wakeWeek,
              wakeWeekend,flex,shift,remind}}
  categories [{id,name,color,symbol}]
  events     [{id,title,catId,placeId,date,allDay,start,end,bufferBefore,
              bufferAfter,location,notes,link,repeat{freq,interval,until},
              skip[],reminders[]|null,uid?,ex?}]
  courses    [{id,title,short,type,day,start,end,weeks,room,lecturer,
              catId,placeId,link,notes,skip[],ex?}]
  deadlines  [{id,title,catId,courseId,date,time,priority,done,
              subtasks[],reminders[]|null,link,notes,ex?}]
  todos      [{id,text,date,done,catId,ex?}]
  birthdays  [{id,name,date:"MM-DD",year,remind,ex?}]
  places     [{id,name,minutes,mode,home}]
  templates  [{id,name,dur,bb,ba,catId,placeId}]
  links      [{id,label,url,group,symbol}]
  semester   {name,start,end,breaks[],examStart,examEnd}
  habits     [{id,name,symbol,color,days[1-7],log{ymd:true}}]
  notes      {occurrenceKey: text}   Notizen zu einzelnen Terminen
  deadlines  + effort (h), exam (Lernplan), focusMin (erledigte Fokuszeit)
=====================================================================
-->

<style>
/* ================================================================
   §1 CSS-TOKENS
   Layout: Porzellanflächen, Ultramarin als Akzent, Gold nur für
   Feiertage und Geburtstage, Lavendel für Schlaf.
   ================================================================ */
:root{
  --accent:#3B4CCA;
  --paper:#EEF0F4;
  --surface:#FBFBFD;
  --raised:#FFFFFF;
  --sunk:#E3E6EE;
  --ink:#13162B;
  --muted:#545A73;
  --faint:#8A8FA6;
  --line:#D7DBE5;
  --gold:#9A6F1E;
  --sleep:#6655B8;
  --danger:#B02A3E;
  --warn:#946210;
  --ok:#25744F;
  --accent-ink:var(--accent);
  --accent-soft:color-mix(in oklab, var(--accent) 11%, var(--surface));
  --gold-soft:color-mix(in oklab, var(--gold) 13%, var(--surface));
  --sleep-soft:color-mix(in oklab, var(--sleep) 12%, var(--surface));
  --shadow:0 1px 2px rgba(19,22,43,.05), 0 10px 30px rgba(19,22,43,.07);
  --f-display:"Newsreader", "Iowan Old Style", Georgia, serif;
  --f-body:"Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:14px; --r-sm:8px; --rail:244px; --hour:64px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0B0D17; --surface:#131627; --raised:#191D31; --sunk:#1D2136; --ink:#E9EAF3; --muted:#A4A8C0;
    --faint:#6D7290; --line:#262A42; --gold:#D8B060; --sleep:#A99BF0; --danger:#EE7A8A; --warn:#DDB054; --ok:#6CC59A;
    --accent-ink:color-mix(in oklab, var(--accent) 55%, white);
    --accent-soft:color-mix(in oklab, var(--accent) 26%, var(--surface));
    --gold-soft:color-mix(in oklab, var(--gold) 16%, var(--surface));
    --sleep-soft:color-mix(in oklab, var(--sleep) 16%, var(--surface));
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 30px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0B0D17; --surface:#131627; --raised:#191D31; --sunk:#1D2136; --ink:#E9EAF3; --muted:#A4A8C0;
  --faint:#6D7290; --line:#262A42; --gold:#D8B060; --sleep:#A99BF0; --danger:#EE7A8A; --warn:#DDB054; --ok:#6CC59A;
  --accent-ink:color-mix(in oklab, var(--accent) 55%, white);
  --accent-soft:color-mix(in oklab, var(--accent) 26%, var(--surface));
  --gold-soft:color-mix(in oklab, var(--gold) 16%, var(--surface));
  --sleep-soft:color-mix(in oklab, var(--sleep) 16%, var(--surface));
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 30px rgba(0,0,0,.3);
  color-scheme:dark;
}

/* ================================================================
   §2 CSS-KOMPONENTEN
   ================================================================ */
*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-body);font-size:var(--t-body);line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px;border-radius:var(--r-xs)}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.num{font-size:.88em}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.eyebrow{font-size:var(--t-xs);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
svg.s{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
svg.w{width:22px;height:22px;flex:none;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;stroke:var(--ink)}
svg.w .sun{stroke:var(--gold)} svg.w .rain{stroke:var(--accent-ink)} svg.w .bolt{stroke:var(--gold)} svg.w .moon{stroke:var(--sleep)}
svg.w.xl{width:56px;height:56px;stroke-width:1.2}
svg.w.lg{width:34px;height:34px;stroke-width:1.3}
svg.w.sm{width:18px;height:18px}

/* --- App-Layout --- */
.app{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;padding:26px 16px 18px;display:flex;flex-direction:column;gap:20px;overflow:auto}
.brand{padding:0 10px;display:flex;flex-direction:column;gap:2px}
.brand b{font-family:var(--f-display);font-size:var(--t-h2);font-weight:500;font-style:italic;letter-spacing:-.01em;line-height:1}
.brand span{font-size:var(--t-xs);color:var(--faint)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .sep{height:1px;background:var(--line);margin:8px 10px}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:none;padding:9px 12px;border-radius:var(--r-sm);color:var(--muted);text-align:left;font-weight:500;font-size:var(--t-ui)}
.nav button:hover{background:var(--sunk);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--raised);color:var(--ink);box-shadow:var(--shadow)}
.nav button[aria-current="page"] svg{color:var(--accent-ink)}
.nav .count{margin-left:auto;font-family:var(--f-mono);font-size:var(--t-xs);color:var(--faint)}
.nav .count.hot{color:var(--danger)}
.railwx{margin:0 4px;padding:14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;gap:12px;cursor:pointer;text-align:left;color:var(--ink);width:calc(100% - 8px)}
.railwx b{font-family:var(--f-display);font-size:var(--t-h2);font-weight:500;line-height:1}
.railwx small{display:block;color:var(--muted);font-size:var(--t-sm);line-height:1.3}
.rail-foot{margin-top:auto;padding:0 10px;font-size:var(--t-xs);color:var(--faint);display:flex;flex-direction:column;gap:4px}

.col{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in oklab, var(--paper) 86%, transparent);backdrop-filter:blur(var(--blur-1));-webkit-backdrop-filter:blur(var(--blur-1));padding:14px 32px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-bottom:1px solid transparent}
.top.scrolled{border-bottom-color:var(--line)}
.top h1{margin:0;font-family:var(--f-display);font-weight:500;font-size:var(--t-h1);line-height:1.05;letter-spacing:-.01em;text-wrap:balance}
.top h1 i{font-style:italic;color:var(--accent-ink)}
.top .sub{font-size:var(--t-md);color:var(--muted)}
.top .grow{flex:1}
.pager{display:flex;gap:4px;align-items:center}
.search{position:relative;display:flex;align-items:center}
.search svg{position:absolute;left:12px;color:var(--faint)}
.search input{width:220px;max-width:44vw;padding:9px 12px 9px 38px;border:1px solid var(--line);border-radius:var(--r-pill);background:var(--surface);font-size:var(--t-ui)}
main{padding:20px 32px 130px;min-width:0}

/* --- Buttons --- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 16px;border-radius:var(--r-pill);font-size:var(--t-md);font-weight:500;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--sunk);color:var(--ink)}
.btn.danger{color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.sm{padding:6px 12px;font-size:var(--t-md)}
.iconbtn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:var(--r-pill);border:1px solid transparent;background:none;color:var(--muted);flex:none}
.iconbtn:hover{background:var(--sunk);color:var(--ink)}
.tabbar{display:none}
.fab{position:fixed;right:28px;bottom:calc(28px + env(safe-area-inset-bottom,0px));z-index:30;width:58px;height:58px;border-radius:var(--r-lg);border:0;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 12px 32px color-mix(in oklab, var(--accent) 45%, transparent)}
.fab svg{width:26px;height:26px;stroke-width:1.8}

/* --- Panels --- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.panel-h h2{margin:0;font-family:var(--f-display);font-size:var(--t-h3);font-weight:500}
.h2{margin:0;font-family:var(--f-display);font-size:var(--t-h3);font-weight:500}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:24px;align-items:start}
.empty{padding:18px 2px;color:var(--muted);font-size:var(--t-ui)}
.empty b{display:block;color:var(--ink);font-weight:600;margin-bottom:2px}
.group-h{display:flex;align-items:baseline;gap:10px;margin:24px 0 8px}
.group-h:first-child{margin-top:0}
.group-h h3{margin:0;font-size:var(--t-sm);letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.group-h.over h3{color:var(--danger)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:6px 13px;border-radius:var(--r-pill);font-size:var(--t-md);color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);background:var(--raised)}
.chip .sw{width:8px;height:8px;border-radius:50%;background:var(--c)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:var(--t-xs);font-weight:600;letter-spacing:.07em;text-transform:uppercase;padding:3px 9px;border-radius:var(--r-pill);background:var(--sunk);color:var(--muted);white-space:nowrap}
.tag.accent{background:var(--accent-soft);color:var(--accent-ink)}
.tag.gold{background:var(--gold-soft);color:var(--gold)}
.tag.sleep{background:var(--sleep-soft);color:var(--sleep)}
.tag.warn{background:color-mix(in oklab, var(--warn) 15%, var(--surface));color:var(--warn)}
.banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px;border:1px dashed var(--faint);border-radius:var(--r);margin-bottom:20px;font-size:var(--t-md);color:var(--muted)}
.note{font-size:var(--t-md);color:var(--muted);background:var(--sunk);border-radius:var(--r-sm);padding:11px 13px;line-height:1.55}

/* --- Heute: Kopf --- */
.hero{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:20px 28px;align-items:end;margin:4px 0 22px}
.hero .bignum{font-family:var(--f-display);font-size:clamp(84px,12vw,132px);line-height:.8;font-weight:400;letter-spacing:-.04em}
.hero .daytxt{display:flex;flex-direction:column;gap:6px;padding-bottom:6px;min-width:0}
.hero .daytxt .wd{font-family:var(--f-display);font-size:clamp(26px,3.4vw,36px);font-style:italic;line-height:1}
.hero .daytxt .mo{font-size:var(--t-ui);color:var(--muted)}
.hero .chipsrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.wxnow{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);cursor:pointer;text-align:left;color:var(--ink)}
.wxnow .t{font-family:var(--f-display);font-size:var(--t-d1);line-height:.9;font-weight:400;display:block}
.wxnow small{display:block;font-size:var(--t-sm);color:var(--muted);line-height:1.35}
.wxnow .city{font-size:var(--t-xs);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:600;display:block}
.notices{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.notice{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:var(--r);background:var(--gold-soft);color:var(--ink);border:1px solid color-mix(in oklab, var(--gold) 30%, transparent);text-align:left;cursor:pointer;font-size:var(--t-ui)}
.notice svg{color:var(--gold)}
.notice.sleep{background:var(--sleep-soft);border-color:color-mix(in oklab, var(--sleep) 30%, transparent)}
.notice.sleep svg{color:var(--sleep)}
.notice.warn{background:color-mix(in oklab, var(--warn) 12%, var(--surface));border-color:color-mix(in oklab, var(--warn) 30%, transparent);cursor:default}
.notice.warn svg{color:var(--warn)}
.notice b{font-weight:600}
.next{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;padding:18px 20px;border-radius:var(--r);background:var(--ink);color:var(--paper);margin-bottom:18px;cursor:pointer;border:0;text-align:left;width:100%}
.next .lbl{font-size:var(--t-xs);letter-spacing:.14em;text-transform:uppercase;opacity:.65;font-weight:600}
.next .t{font-size:var(--t-lead);font-weight:600;margin:2px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.next .meta{font-size:var(--t-md);opacity:.78;display:flex;flex-wrap:wrap;gap:4px 14px}
.next .cd{font-family:var(--f-display);font-size:var(--t-h1);line-height:1;text-align:right}
.next .cd small{display:block;font-family:var(--f-body);font-size:var(--t-xs);opacity:.65}
.next .sym{width:44px;height:44px;border-radius:var(--r);display:grid;place-items:center;background:var(--c);color:#fff}

/* --- Tagesleiste mit Wetter --- */
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:22px}
.days button{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;color:var(--ink)}
.days .wd{font-size:var(--t-xs);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.days .dn{font-family:var(--f-display);font-size:var(--t-h3);line-height:1}
.days .tmp{font-family:var(--f-mono);font-size:var(--t-xs);color:var(--muted);white-space:nowrap}
.days .dots{display:flex;gap:3px;height:5px}
.days .dots i{width:5px;height:5px;border-radius:50%;background:var(--c,var(--faint))}
.days button.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.days button.hol{background:var(--gold-soft)}

/* --- Tages-Zeitleiste (Heute & Tag) --- */
.tl{position:relative;display:grid;grid-template-columns:96px minmax(0,1fr)}
.tl-allday{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:6px;padding:0 0 14px 96px}
.tl-rail{display:flex;flex-direction:column}
.tl-h{height:var(--hour);display:flex;align-items:flex-start;gap:6px;padding:0 8px 0 0;border:0;background:none;text-align:left;color:var(--ink);position:relative}
.tl-h .hh{font-family:var(--f-mono);font-size:var(--t-sm);color:var(--muted);width:22px;transform:translateY(-8px)}
.tl-h .wx{display:flex;align-items:center;gap:3px;transform:translateY(-10px);padding:2px 5px;border-radius:var(--r-sm)}
.tl-h .wx .tt{font-family:var(--f-mono);font-size:var(--t-xs)}
.tl-h .wx .pp{font-family:var(--f-mono);font-size:var(--t-2xs);color:var(--accent-ink)}
.tl-h:hover .wx{background:var(--sunk)}
.tl-h.approx .wx{opacity:.55}
.tl-body{position:relative;border-left:1px solid var(--line);background-image:repeating-linear-gradient(to bottom, var(--line) 0, var(--line) 1px, transparent 1px, transparent var(--hour));cursor:copy}
.ev{position:absolute;left:8px;right:8px;border-radius:var(--r);padding:8px 12px;font-size:var(--t-md);line-height:1.3;overflow:hidden;cursor:pointer;background:color-mix(in oklab, var(--c) 14%, var(--raised));border:0;border-left:4px solid var(--c);color:var(--ink);text-align:left;display:flex;flex-direction:column;gap:2px;z-index:2}
.ev b{font-weight:600;font-size:var(--t-ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ev .m{color:var(--muted);font-size:var(--t-sm);display:flex;gap:10px;flex-wrap:wrap}
.ev .m .mono{font-size:var(--t-xs)}
.ev.past{opacity:.55}
.ev.short{padding:3px 10px;flex-direction:row;align-items:center;gap:8px}
.ev.short b{font-size:var(--t-md)}
.ev[data-drag]{cursor:grab}
.ev.dragging{opacity:.88;box-shadow:var(--shadow);z-index:6;cursor:grabbing}
.buf{position:absolute;left:8px;right:8px;border-radius:var(--r-sm);background:repeating-linear-gradient(135deg, color-mix(in oklab, var(--c) 12%, transparent) 0 6px, transparent 6px 12px);border:1px dashed color-mix(in oklab, var(--c) 45%, transparent);pointer-events:none;z-index:1}
.travel{position:absolute;left:8px;right:8px;border-radius:var(--r-sm);border:1px dashed var(--faint);background:repeating-linear-gradient(90deg, color-mix(in oklab, var(--faint) 12%, transparent) 0 2px, transparent 2px 8px);color:var(--muted);font-size:var(--t-sm);display:flex;align-items:center;gap:8px;padding:0 10px;overflow:hidden;white-space:nowrap;cursor:pointer;text-align:left;z-index:1}
.travel span{overflow:hidden;text-overflow:ellipsis}
.travel b{color:var(--ink);font-weight:600}
.travel.tight{border-color:var(--warn);color:var(--warn)}
.marker{position:absolute;left:0;right:0;height:0;z-index:4;pointer-events:none}
.marker::before{content:"";position:absolute;left:0;right:0;border-top:2px solid var(--c)}
.marker span{position:absolute;right:8px;top:-12px;font-size:var(--t-xs);font-weight:600;background:var(--surface);color:var(--c);padding:2px 9px;border-radius:var(--r-pill);border:1px solid color-mix(in oklab, var(--c) 40%, transparent);pointer-events:auto;display:flex;gap:5px;align-items:center;cursor:pointer;white-space:nowrap}
.marker.now{--c:var(--danger)}
.marker.now span{cursor:default}
.marker.now::after{content:"";position:absolute;left:-6px;top:-5px;width:10px;height:10px;border-radius:50%;background:var(--danger)}
.marker.sleep{--c:var(--sleep)}
.sleepzone{position:absolute;left:0;right:0;background:repeating-linear-gradient(0deg, var(--sleep-soft) 0 2px, transparent 2px 7px);pointer-events:none}
.gap{position:absolute;left:8px;right:8px;display:flex;justify-content:center;pointer-events:none;z-index:3}
.gap span{font-size:var(--t-xs);color:var(--muted);background:var(--paper);padding:0 9px;border-radius:var(--r-pill);transform:translateY(-50%);border:1px solid var(--line)}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:var(--t-sm);padding:4px 10px;border-radius:var(--r-pill);background:color-mix(in oklab, var(--c) 14%, var(--surface));border:1px solid color-mix(in oklab, var(--c) 30%, transparent);cursor:pointer;color:var(--ink);max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pill .mono{font-size:var(--t-xs)}

/* --- Listenzeilen --- */
.row-item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:13px 2px;border-top:1px solid var(--line)}
.row-item:first-child{border-top:0}
.row-item .main{cursor:pointer;min-width:0}
.row-item .ti{font-weight:500;font-size:var(--t-ui);display:flex;align-items:center;gap:8px;min-width:0}
.row-item .ti span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-item .sm{font-size:var(--t-md);color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:2px;align-items:center}
.row-item.done .ti span{text-decoration:line-through;color:var(--faint)}
.check{width:24px;height:24px;border-radius:var(--r-sm);border:1.5px solid var(--faint);background:none;display:grid;place-items:center;padding:0;color:#fff;flex:none}
.check.on{background:var(--accent);border-color:var(--accent)}
.check svg{width:15px;height:15px;stroke-width:2.4}
.cd{font-family:var(--f-mono);font-size:var(--t-xs);padding:3px 9px;border-radius:var(--r-pill);background:var(--sunk);color:var(--muted);white-space:nowrap}
.cd.soon{background:color-mix(in oklab, var(--warn) 15%, var(--surface));color:var(--warn)}
.cd.over{background:color-mix(in oklab, var(--danger) 13%, var(--surface));color:var(--danger)}
.cd.ok{background:color-mix(in oklab, var(--ok) 14%, var(--surface));color:var(--ok)}
.prio{display:inline-flex;gap:2px;align-items:flex-end;height:12px}
.prio i{width:3px;border-radius:1px;background:var(--line)}
.prio i:nth-child(1){height:5px}.prio i:nth-child(2){height:8px}.prio i:nth-child(3){height:12px}
.prio[data-p="1"] i:nth-child(1),.prio[data-p="2"] i:nth-child(-n+2){background:var(--ink)}
.prio[data-p="3"] i{background:var(--danger)}
.progress{height:4px;border-radius:var(--r-hair);background:var(--line);overflow:hidden;width:72px;display:inline-block;vertical-align:middle}
.progress i{display:block;height:100%;background:var(--accent)}
.todo-add,.quick{display:flex;gap:8px;margin-top:8px}
.todo-add input,.quick input{flex:1;min-width:0;padding:11px 15px;border:1px solid var(--line);border-radius:var(--r-pill);background:var(--paper);font-size:var(--t-ui)}
.quick{margin-top:0}
.quick-prev{font-size:var(--t-sm);color:var(--muted);margin-top:8px;min-height:18px;display:flex;flex-wrap:wrap;gap:4px 12px}
.quick-prev b{color:var(--ink);font-weight:600}

/* --- Woche --- */
.scroller{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.wk{min-width:780px;display:grid;grid-template-columns:72px repeat(var(--days),minmax(0,1fr))}
.wk-h{position:sticky;top:0;background:var(--surface);z-index:5;border-bottom:1px solid var(--line);padding:10px 6px 8px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.wk-h .wd{font-size:var(--t-xs);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.wk-h .dn{font-family:var(--f-display);font-size:var(--t-h2);line-height:1}
.wk-h .wxl{display:flex;align-items:center;gap:4px;font-family:var(--f-mono);font-size:var(--t-xs);color:var(--muted);min-height:20px}
.wk-h.today .dn{color:var(--accent-ink)}
.wk-h.today{box-shadow:inset 0 -2px 0 var(--accent)}
.wk-h.hol{background:var(--gold-soft)}
.wk-corner{border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:5}
.wk-all{border-bottom:1px solid var(--line);border-left:1px solid var(--line);padding:5px;min-height:34px;display:flex;flex-direction:column;gap:3px;min-width:0}
.wk-all .pill{font-size:var(--t-xs);padding:2px 8px;border-radius:var(--r-xs);width:100%}
.wk-all-l{border-bottom:1px solid var(--line);font-size:var(--t-2xs);color:var(--faint);padding:10px 6px;text-align:right}
.wk-times div{height:var(--hour);font-family:var(--f-mono);font-size:var(--t-2xs);color:var(--faint);text-align:right;padding-right:8px;transform:translateY(-7px)}
.wk-col{position:relative;border-left:1px solid var(--line);background-image:repeating-linear-gradient(to bottom, var(--line) 0, var(--line) 1px, transparent 1px, transparent var(--hour));cursor:copy}
.wk-col.today{background-color:color-mix(in oklab, var(--accent) 4%, transparent)}
.wk-col .ev{left:3px;right:3px;padding:4px 7px;border-radius:var(--r-sm);font-size:var(--t-xs);border-left-width:3px}
.wk-col .ev b{font-size:var(--t-sm)}
.wk-col .ev .m{font-size:var(--t-xs)}
.wk-col .buf,.wk-col .travel{left:3px;right:3px;border-radius:var(--r-xs)}
.wk-col .travel{font-size:var(--t-2xs);padding:0 5px}
.wk-col .marker span{font-size:var(--t-2xs);right:3px;padding:0 6px;top:-10px}

/* --- Monat --- */
.mo{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--line);gap:1px}
.mo-h{background:var(--surface);padding:9px;font-size:var(--t-xs);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:center}
.mo-d{background:var(--surface);min-height:118px;padding:7px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0;border:0;text-align:left;color:var(--ink)}
.mo-d:hover{background:var(--raised)}
.mo-d.out{background:var(--paper);color:var(--faint)}
.mo-d.hol{background:var(--gold-soft)}
.mo-d .n{display:flex;justify-content:space-between;align-items:center;gap:4px}
.mo-d .n .d{font-family:var(--f-display);font-size:var(--t-lead);line-height:1}
.mo-d .n .wx{display:flex;align-items:center;gap:2px;font-family:var(--f-mono);font-size:var(--t-2xs);color:var(--muted)}
.mo-d.today .n .d{background:var(--accent);color:#fff;border-radius:var(--r-pill);padding:3px 8px 4px;font-size:var(--t-body)}
.mo-d .hn{font-size:var(--t-xs);color:var(--gold);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mo-d .li{display:flex;align-items:center;gap:5px;font-size:var(--t-xs);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mo-d .li i{width:6px;height:6px;border-radius:50%;background:var(--c);flex:none}
.mo-d .li .mono{font-size:var(--t-2xs);color:var(--muted)}
.mo-d .more{font-size:var(--t-xs);color:var(--muted)}
.mo-d .dotrow{display:none;gap:3px;flex-wrap:wrap;margin-top:auto}
.mo-d .dotrow i{width:6px;height:6px;border-radius:50%;background:var(--c)}

/* --- Jahr --- */
.yr{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.ym{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.ym h3{margin:0 0 8px;font-family:var(--f-display);font-weight:500;font-size:var(--t-lead);cursor:pointer}
.ym.cur h3{color:var(--accent-ink);font-style:italic}
.ymg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.ymg span{font-size:var(--t-2xs);color:var(--faint);text-align:center}
.ymg button{aspect-ratio:1;border:0;border-radius:var(--r-xs);font-family:var(--f-mono);font-size:var(--t-xs);background:color-mix(in oklab, var(--accent) calc(var(--load,0) * 1%), transparent);color:var(--ink);padding:0;min-width:0}
.ymg button.hol{box-shadow:inset 0 0 0 1.5px var(--gold);color:var(--gold);font-weight:600}
.ymg button.today{background:var(--accent);color:#fff}
.ymg button.we{color:var(--muted)}

/* --- Stundenplan, Karten --- */
.sem{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center}
.sem .big{font-family:var(--f-display);font-size:var(--t-h2);font-weight:500}
.semprog{flex:1;min-width:200px}
.semprog .track{height:6px;background:var(--sunk);border-radius:var(--r-hair);position:relative;overflow:hidden}
.semprog .track i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:var(--r-hair)}
.semprog .lbl{display:flex;justify-content:space-between;font-size:var(--t-sm);color:var(--muted);margin-top:6px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.card{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;text-align:left;color:var(--ink);text-decoration:none;align-items:center;width:100%}
.card:hover{border-color:var(--faint)}
.card .sym{width:38px;height:38px;border-radius:var(--r-sm);display:grid;place-items:center;background:color-mix(in oklab, var(--c, var(--accent)) 14%, var(--surface));color:var(--c, var(--accent-ink))}
.card b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card small{color:var(--muted);font-size:var(--t-md);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* --- Wetter --- */
.wxhero{display:flex;flex-wrap:wrap;gap:20px 36px;align-items:center;margin-bottom:22px}
.wxhero .t{font-family:var(--f-display);font-size:var(--t-d4);line-height:.85;font-weight:400;letter-spacing:-.03em}
.wxhero .ph{font-size:var(--t-lead);font-weight:500}
.wxhero .facts{display:grid;grid-template-columns:repeat(2,auto);gap:4px 22px;font-size:var(--t-md);color:var(--muted)}
.wxhero .facts b{color:var(--ink);font-weight:500}
.hours{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.hours button{flex:0 0 72px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--ink)}
.hours .h{font-family:var(--f-mono);font-size:var(--t-xs);color:var(--muted)}
.hours .t{font-family:var(--f-display);font-size:var(--t-h3);line-height:1}
.hours .p{font-family:var(--f-mono);font-size:var(--t-xs);color:var(--accent-ink);min-height:14px}
.dayrow{display:grid;grid-template-columns:110px 40px minmax(0,1fr) 50px 140px;gap:12px;align-items:center;padding:12px 4px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;color:var(--ink);width:100%}
.dayrow:first-child{border-top:0}
.dayrow .ph{color:var(--muted);font-size:var(--t-md);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dayrow .rng{position:relative;height:6px;border-radius:var(--r-hair);background:var(--sunk);flex:1}
.dayrow .rng i{position:absolute;top:0;bottom:0;border-radius:var(--r-hair);background:linear-gradient(90deg, var(--accent), var(--gold))}
.citychips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}

/* --- Einstellungen --- */
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:18px;align-items:start}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .l{min-width:0}
.row .l b{display:block;font-weight:500}
.row .l small{color:var(--muted);font-size:var(--t-md);display:block}
.row input[type=number],.row input[type=time],.row select,.row input[type=text]{padding:7px 10px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--paper);max-width:170px}
.row input[type=number]{width:80px}
.swatches{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.swatch{width:30px;height:30px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);background:var(--c);padding:0;position:relative;display:inline-block}
.swatch[aria-pressed="true"],.swatch:has(input:checked){box-shadow:0 0 0 2px var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-pill);padding:2px;background:var(--sunk);flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 13px;border-radius:var(--r-pill);font-size:var(--t-md);color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--ink);box-shadow:var(--shadow)}
.listrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.listrow[data-act]{cursor:pointer}
.listrow:first-child{border-top:0}
.listrow .sw{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.listrow .grow{flex:1;min-width:0}
.listrow small{color:var(--muted);font-size:var(--t-sm);display:block}
.switch{position:relative;width:44px;height:26px;border-radius:var(--r-pill);background:var(--line);border:0;padding:0;flex:none;transition:background var(--d1)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--raised);box-shadow:none;transition:transform var(--d1)}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(18px)}

/* --- Sheets --- */
.sheet{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px}
.sheet .scrim{position:absolute;inset:0;background:rgba(8,10,20,.48);animation:fade var(--d2) var(--ease)}
.sheet .card2{position:relative;width:min(600px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--surface);border-radius:var(--r-lg);box-shadow:none;padding:24px;animation:rise var(--d2) var(--ease)}
.sheet h2{margin:0 0 18px;font-family:var(--f-display);font-size:var(--t-h2);font-weight:500;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;line-height:1.1}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(14px);opacity:0}}
.form{display:flex;flex-direction:column;gap:15px}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f > span{font-size:var(--t-xs);font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.f input,.f select,.f textarea,.rfind-r input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--paper);min-width:0;font-size:var(--t-ui)}
.f textarea{min-height:80px;resize:vertical}
.f input.title{font-size:var(--t-lead);font-weight:500;background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:6px 0}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.inline-check{display:flex;align-items:center;gap:8px;font-size:var(--t-ui)}
.remchips{display:flex;flex-wrap:wrap;gap:6px}
.remchips label{display:inline-flex;position:relative}
.remchips input{position:absolute;opacity:0;pointer-events:none}
.remchips span{border:1px solid var(--line);border-radius:var(--r-pill);padding:5px 11px;font-size:var(--t-sm);color:var(--muted);cursor:pointer}
.remchips input:checked + span{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.remchips input:focus-visible + span{outline:2px solid var(--accent-ink);outline-offset:2px}
.symgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.symgrid label{display:grid;place-items:center;height:42px;border:1px solid var(--line);border-radius:var(--r-sm);cursor:pointer;color:var(--muted);position:relative}
.symgrid input{position:absolute;opacity:0;pointer-events:none}
.symgrid label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.sheet-foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;margin-top:6px;padding-top:16px;border-top:1px solid var(--line)}
.sheet-foot .r{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.breakrow{display:grid;grid-template-columns:1fr 1fr 1.2fr auto;gap:6px;align-items:center}
.breakrow input{padding:8px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--paper);min-width:0}
.subrow{display:flex;gap:8px;align-items:center}
.subrow input[type=text]{flex:1;padding:8px 11px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--paper);min-width:0}
.menu{display:grid;gap:8px}
.menu button{display:flex;gap:14px;align-items:center;text-align:left;padding:15px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink)}
.menu button:hover{border-color:var(--accent)}
.menu b{display:block;font-weight:600}
.menu small{color:var(--muted);font-size:var(--t-md)}
.menu svg{color:var(--accent-ink)}

/* --- Detailansicht (große Schrift) --- */
.detail{font-size:var(--t-body)}
.detail .dh{display:flex;gap:16px;align-items:flex-start;margin-bottom:18px}
.detail .dh .sym{width:52px;height:52px;border-radius:var(--r);display:grid;place-items:center;background:color-mix(in oklab, var(--c) 16%, var(--surface));color:var(--c);flex:none}
.detail .dh .sym svg{width:26px;height:26px}
.detail .dh .txt{flex:1;min-width:0}
.detail .dt{font-family:var(--f-display);font-size:var(--t-h2);line-height:1.1;font-weight:500;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.detail .ds{color:var(--muted);font-size:var(--t-ui);margin-top:4px}
.detail .facts{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.detail .fact{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;padding:13px 0;border-bottom:1px solid var(--line);align-items:start}
.detail .fact svg{color:var(--muted);margin-top:3px}
.detail .fact b{font-weight:600;display:block}

.detail .wxgrid div{background:var(--sunk);border-radius:var(--r);padding:10px 12px}

.detail .wxgrid b{font-size:var(--t-lead);font-weight:600}

/* --- Toasts --- */
.toasts{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:14px;z-index:60;display:flex;flex-direction:column;gap:8px;width:min(380px,calc(100vw - 28px))}
.toast{background:var(--ink);color:var(--paper);border-radius:var(--r);padding:13px 15px;box-shadow:none;display:flex;gap:12px;align-items:flex-start;animation:rise var(--d2) var(--ease)}
.toast.rem{background:var(--raised);color:var(--ink);border:1px solid var(--accent);border-left-width:4px}
.toast .x{margin-left:auto;background:none;border:0;color:inherit;opacity:.6;padding:0}
.toast b{display:block}
.toast small{opacity:.78;font-size:var(--t-md)}

/* --- Responsiv --- */
@media (max-width: 1060px){ .grid2{grid-template-columns:minmax(0,1fr)} }
@media (max-width: 860px){
  .app{grid-template-columns:minmax(0,1fr)}
